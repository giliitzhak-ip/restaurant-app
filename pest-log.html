<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>יומן ביצוע הדברה – יצחק אחזקות והדברות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --forest:#1f5236;--forest-2:#2c6b47;--leaf:#3f9d5a;--mint:#e3f1e7;--mint-2:#f1f8f3;
  --gold:#b39c6a;--gold-soft:#f3ecdc;
  --bg:#f4f7f4;--surface:#fff;--ink:#15271c;--muted:#5d6f63;--line:#d5e3d9;--danger:#c8433a;--danger-soft:#fbe9e7;
  --r-lg:20px;--r-md:14px;--r-sm:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1712;--surface:#16231b;--ink:#e7efe9;--muted:#9fb3a6;--line:#2a3d31;--mint:#1e3326;--mint-2:#18291f;--gold-soft:#2c2718;--danger-soft:#3a1d1a}}
:root[data-theme="dark"]{--bg:#0e1712;--surface:#16231b;--ink:#e7efe9;--muted:#9fb3a6;--line:#2a3d31;--mint:#1e3326;--mint-2:#18291f;--gold-soft:#2c2718;--danger-soft:#3a1d1a}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Rubik,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:600px;margin:0 auto;min-height:100vh;padding-bottom:110px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.hero{background:var(--forest);color:#fff;padding:22px 20px 64px;border-radius:0 0 32px 32px}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:48px;height:48px;border-radius:14px;background:var(--gold);color:var(--forest);display:grid;place-items:center;font-weight:800;font-size:26px;flex:none}
.bname{font-weight:700;font-size:18px;line-height:1.2}
.bsub{font-size:13px;color:#cfe3d5}
.sync{font-size:12px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.14);white-space:nowrap}
.hello{margin:22px 0 0;font-size:23px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px;margin-top:-40px}
.tile{border:0;background:var(--surface);border-radius:var(--r-lg);box-shadow:0 6px 18px rgba(20,50,30,.12);padding:18px 14px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;cursor:pointer;position:relative;color:var(--leaf);text-align:right;min-height:104px}
.tile b{color:var(--ink);font-size:16px}
.tile small{color:var(--muted);font-size:12px}
.tile.primary{background:var(--gold);color:var(--forest)}.tile.primary b,.tile.primary small{color:var(--forest)}
.badge{position:absolute;top:10px;left:10px;background:var(--danger);color:#fff;min-width:22px;height:22px;border-radius:11px;font-size:12px;display:grid;place-items:center;padding:0 6px}
.block{padding:22px 16px 0}
.block h2{font-size:17px;margin:0 0 10px}

.top{position:sticky;top:0;z-index:20;background:var(--forest);color:#fff;padding:10px 12px}
.toprow{display:flex;align-items:center;gap:8px;min-height:40px}
.top h1{flex:1;margin:0;font-size:18px;font-weight:700;text-align:center}
.top .sub{text-align:center;font-size:13px;color:#cfe3d5;margin-top:-2px}
.iconbtn{width:42px;height:42px;border-radius:50%;border:0;background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.progress{height:4px;background:rgba(255,255,255,.2);border-radius:2px;margin-top:8px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--gold);transition:width .3s}
.stepper{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line);scrollbar-width:none}
.stepper::-webkit-scrollbar{display:none}
.st{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px 6px 8px;font-size:13px;display:flex;gap:6px;align-items:center;cursor:pointer;color:var(--muted)}
.st b{width:22px;height:22px;border-radius:50%;background:var(--mint);color:var(--forest-2);display:grid;place-items:center;font-size:12px}
.st.on{border-color:var(--forest-2);color:var(--ink);font-weight:600}.st.on b{background:var(--forest-2);color:#fff}
.st.bad b{background:var(--danger);color:#fff}
.page{padding:16px}

.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:14px;overflow:hidden}
.sech{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;background:var(--mint-2);border-bottom:1px solid var(--line)}
.sech h3{margin:0;font-size:16px}
.secb{padding:2px 14px 14px}
details.sec>summary{list-style:none;cursor:pointer}
details.sec>summary::-webkit-details-marker{display:none}
.field{display:block;margin-top:12px}
.field>span,.flabel{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
.req::after{content:" *";color:var(--danger)}
.opt{font-size:12px;color:var(--muted);font-weight:400}
.inp,.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:var(--r-sm);padding:11px 12px;min-height:46px}
textarea{min-height:96px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err .inp,.err input,.err select,.err textarea,input.err,textarea.err,select.err{border-color:var(--danger)!important;background:var(--danger-soft)!important}
.errtxt{color:var(--danger);font-size:13px;margin-top:4px}
.flash{animation:flash 1.4s ease}
@keyframes flash{0%,60%{box-shadow:0 0 0 4px var(--gold)}100%{box-shadow:0 0 0 0 transparent}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;font-size:14px;cursor:pointer;min-height:40px}
.chip.on{background:var(--forest-2);border-color:var(--forest-2);color:#fff}
.chips.err .chip{border-color:var(--danger)}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.seg button{flex:1;border:0;background:var(--surface);padding:11px 4px;font-size:15px;cursor:pointer;min-height:46px}
.seg button+button{border-right:1px solid var(--line)}
.seg button.on{background:var(--forest-2);color:#fff}
.seg.err{border-color:var(--danger)}
.bigseg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bigseg button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:14px 6px;cursor:pointer;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--leaf)}
.bigseg button span{color:var(--ink);font-size:14px}
.bigseg button.on{border-color:var(--forest-2);background:var(--mint);box-shadow:inset 0 0 0 1px var(--forest-2)}
.bigseg.err button{border-color:var(--danger)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.toggle span{font-weight:500}
.sw{width:52px;height:30px;border-radius:15px;background:var(--line);border:0;position:relative;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:right .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw[aria-checked="true"]{background:var(--leaf)}.sw[aria-checked="true"]::after{right:25px}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;cursor:pointer}
.check input{width:24px;height:24px;accent-color:var(--forest-2);flex:none;margin:0}
.check.err{color:var(--danger)}
.item{border:1px solid var(--line);border-radius:var(--r-md);padding:4px 12px 14px;margin-top:12px}
.itemh{display:flex;justify-content:space-between;align-items:center;padding-top:8px;gap:8px}
.itemh strong{font-size:15px}
.btn{border:0;border-radius:var(--r-md);padding:13px 18px;font-weight:600;cursor:pointer;background:var(--forest-2);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;text-decoration:none}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.gold{background:var(--gold);color:var(--forest)}
.btn.sm{padding:8px 12px;font-size:14px;min-height:40px;border-radius:var(--r-sm)}
.btn.w{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{border:0;background:transparent;color:var(--forest-2);font-weight:600;cursor:pointer;padding:6px 4px;font-size:14px}
:root[data-theme="dark"] .link{color:var(--leaf)}
.del{border:0;background:transparent;color:var(--danger);font-size:14px;cursor:pointer;padding:8px}
.hint{font-size:13px;color:var(--muted);margin:8px 0 0}
.note{background:var(--gold-soft);border-radius:var(--r-md);padding:10px 12px;font-size:14px;margin-top:12px}
.dbtag{display:inline-block;font-size:12px;background:var(--gold-soft);color:#7a6634;border-radius:6px;padding:2px 8px;margin-top:6px}
.footer{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:30}
.footer .in{max-width:568px;margin:0 auto;display:flex;gap:10px}.footer .btn{flex:1}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;margin-bottom:10px;display:flex;gap:10px;align-items:center;cursor:pointer;width:100%;text-align:right}
.card .main{flex:1;min-width:0}
.card h4{margin:0;font-size:16px}
.card p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--mint);color:var(--forest-2);font-weight:600}
.tag.draft{background:var(--gold-soft);color:#7a6634}
.empty{text-align:center;padding:36px 20px;color:var(--muted)}
.filters{display:grid;gap:8px;margin-bottom:12px}

.audit{list-style:none;margin:0;padding:0}
.audit>li{border-bottom:1px solid var(--line);padding:10px 0}
.audit>li:last-child{border-bottom:0}
.audit .ah{display:flex;align-items:center;gap:10px;font-weight:600}
.audit .ok{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--mint);color:var(--forest-2);flex:none;font-size:14px}
.audit .no{background:var(--danger);color:#fff}
.audit ul{list-style:none;margin:6px 36px 0 0;padding:0}
.audit ul button{border:0;background:transparent;color:var(--danger);text-align:right;padding:5px 0;cursor:pointer;font-size:14px;text-decoration:underline}

.sigwrap{margin-top:12px}
.sigwrap .lbl{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);margin-bottom:4px}
canvas.sig{width:100%;height:160px;background:#fff;border:1px solid var(--line);border-radius:var(--r-md);touch-action:none;display:block}
.sigwrap.err canvas{border-color:var(--danger);box-shadow:0 0 0 2px var(--danger-soft)}
.poison{background:#fff4f2;color:#8a2a22;border:1px solid #f0c9c3;border-radius:var(--r-md);padding:10px 12px;font-weight:600;margin-top:12px;text-align:center}

/* document */
.paper{background:#fff;color:#1a1a1a;border-radius:6px;box-shadow:0 2px 14px rgba(0,0,0,.12);padding:22px 20px;font-size:12.5px;line-height:1.55;direction:rtl}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:3px solid #1f5236;padding-bottom:10px}
.dh .co{font-size:18px;font-weight:800;color:#1f5236}
.dh .meta{font-size:11px;color:#555}
.dh .mk2{width:44px;height:44px;border-radius:12px;background:#b39c6a;color:#1f5236;display:grid;place-items:center;font-weight:800;font-size:23px;flex:none}
.dtitle{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0 4px;gap:8px;flex-wrap:wrap}
.dtitle h2{margin:0;font-size:18px;color:#1f5236}
.dtitle span{color:#7a6634;font-weight:700}
.paper h3{font-size:13.5px;margin:14px 0 5px;color:#fff;background:#1f5236;padding:3px 8px;border-radius:3px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:1px 14px}
.kv div{display:flex;gap:5px;padding:2px 0;border-bottom:1px dotted #e1e6e2}
.kv b{color:#555;font-weight:500;flex:none}
.kv .full{grid-column:1/-1}
.tbl{width:100%;border-collapse:collapse;font-size:11px}
.tbl th{background:#e9f2ec;color:#1f5236;font-weight:600;text-align:right;padding:4px 5px;border:1px solid #d3e0d7}
.tbl td{padding:4px 5px;border:1px solid #e0e6e2;vertical-align:top}
.tblwrap{overflow-x:auto}
.pre{white-space:pre-wrap;margin:0}
.dsigs{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
.dsigs div{border-top:1px solid #999;padding-top:3px;font-size:11.5px;color:#444;text-align:center}
.dsigs img{height:64px;display:block;margin:0 auto 3px}
.dpoison{margin-top:14px;border:2px solid #c8433a;color:#8a2a22;padding:6px 10px;text-align:center;font-weight:700;border-radius:4px}
.dfoot{margin-top:10px;font-size:10px;color:#777;display:flex;justify-content:space-between}
.avoid{break-inside:avoid;page-break-inside:avoid}

.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--surface);width:100%;max-width:600px;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:86vh;overflow:auto}
.sheet h3{margin:0 0 4px;font-size:18px}
.pick{display:flex;gap:10px;align-items:center;width:100%;text-align:right;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:12px;margin-top:8px;cursor:pointer}
.pick .main{flex:1;min-width:0}.pick b{display:block}.pick small{color:var(--muted);display:block}
.pick .plusb{width:34px;height:34px;border-radius:50%;background:var(--leaf);color:#fff;display:grid;place-items:center;flex:none}
.pvbar{background:var(--gold-soft);border-radius:var(--r-md);padding:10px 12px;margin-bottom:12px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.paper.draftmark{position:relative;overflow:hidden}
.paper.draftmark::before{content:"טיוטה – תצוגה מקדימה";position:absolute;top:40%;left:50%;transform:translate(-50%,-50%) rotate(-28deg);font-size:54px;font-weight:800;color:rgba(200,67,58,.09);white-space:nowrap;pointer-events:none}
.deliver{background:var(--surface);border:2px solid var(--gold);border-radius:var(--r-lg);padding:14px;margin-bottom:14px}
.deliver h3{margin:0 0 4px;font-size:17px}
.deliver .status{font-size:14px;color:var(--muted);margin:0 0 12px}
.deliver .status.bad{color:var(--danger)}
.stack{display:grid;gap:8px}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--forest-2);border-radius:50%;display:inline-block;vertical-align:-3px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.crash{position:fixed;bottom:0;left:0;right:0;background:var(--danger);color:#fff;padding:10px 14px;font-size:13px;z-index:70;max-height:40vh;overflow:auto}
.crash button{background:#fff;color:var(--danger);border:0;border-radius:8px;padding:6px 10px;margin-top:6px;font-weight:600}
.phgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.phgrid figure{margin:0;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:var(--surface)}
.phgrid img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.phgrid input{width:100%;border:0;border-top:1px solid var(--line);padding:8px;background:transparent;font-size:13px}
.phgrid .rowb{display:flex;justify-content:space-between;align-items:center;padding:0 6px 4px}
.cam{display:flex;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--line);border-radius:var(--r-md);padding:18px;color:var(--forest-2);cursor:pointer;text-align:center;margin-top:10px;font-weight:600}
:root[data-theme="dark"] .cam{color:var(--leaf)}
.cam input{display:none}
.dph{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.dph figure{margin:0}
.dph img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:3px;display:block;border:1px solid #ddd}
.dph figcaption{font-size:10px;color:#444;padding-top:2px}
.strow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.strow:last-child{border-bottom:0}
.stno{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none;font-size:15px}
.strow .mid{flex:1;min-width:0}
.strow .mid b{display:block;font-size:15px}
.strow .mid small{color:var(--muted);font-size:12px}
.strow select{border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);max-width:46%}
.stdone{opacity:.65}
.ac{position:relative}
.aclist{position:absolute;top:100%;right:0;left:0;z-index:40;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:0 10px 30px rgba(0,0,0,.18);max-height:280px;overflow:auto;margin-top:4px}
.aclist:empty{display:none}
.acitem{display:flex;gap:10px;align-items:center;width:100%;text-align:right;border:0;border-bottom:1px solid var(--line);background:transparent;padding:12px;cursor:pointer;min-height:56px}
.acitem:last-child{border-bottom:0}
.acitem b{display:block;font-size:15px}
.acitem small{display:block;color:var(--muted);font-size:12.5px}
.acitem .ico{width:34px;height:34px;border-radius:50%;background:var(--mint);color:var(--forest-2);display:grid;place-items:center;flex:none}
.acitem mark{background:var(--gold-soft);color:inherit;border-radius:3px;padding:0 1px}
.achead{padding:8px 12px;font-size:12px;color:var(--muted);background:var(--mint-2)}
.toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--forest);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;z-index:50;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  body{background:#fff}
  .top,.footer,.toast,.noprint{display:none!important}
  #app{max-width:none;padding:0}.page{padding:0}
  .paper{box-shadow:none;padding:0}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
/* =========================================================
   1. CONSTANTS (from the requirements text)
   ========================================================= */
const LICENSE_TYPES=['בדירות','במבנים ובשטח פתוח','באיוד','צבאי','במבנים ובשטח פתוח מוגבל למכרסמים בלבד','במבנים ובשטח פתוח מוגבל לחרקים בלבד'];
const OP_KINDS=['הדברה רגילה','איוד','ערפול'];
const ROLES=['בעל בית','שוכר הדירה','ועד הבית','מנהל המבנה','מנהל אחזקה','אחר'];
const BUILDING_TYPES=['מוסד חינוכי','חדר אשפה','מפעל','בית מלון','מבנה אחר'];
const SITE_TYPES=['נחל','שדה','בור מים','שטח ציבורי','אחר'];
const LEVELS=['נמוכה','בינונית','גבוהה'];

function parseGeo(t){
  t=String(t||'').trim();if(!t)return null;
  let m=t.match(/[?&]q=(-?\d{1,3}\.\d+)[,\s]+(-?\d{1,3}\.\d+)/)||t.match(/[@\/](-?\d{1,3}\.\d+),(-?\d{1,3}\.\d+)/)||t.match(/ll=(-?\d{1,3}\.\d+),(-?\d{1,3}\.\d+)/)||t.match(/^\s*(-?\d{1,3}\.\d+)\s*[,\s]\s*(-?\d{1,3}\.\d+)\s*$/);
  if(!m)return null;const lat=+m[1],lng=+m[2];
  if(Math.abs(lat)>90||Math.abs(lng)>180)return null;
  return {lat,lng,acc:0,at:Date.now(),manual:true};
}

function validate(j){
  const E=[];const add=(g,path,msg)=>E.push({g,step:GROUPS[g].step,path,msg});
  const req=(g,path,msg)=>{if(blankStr(getP(j,path)))add(g,path,msg)};
  // 0 tech (+ date/time, operator when exists)
  req(0,'date','תאריך ביצוע ההדברה');req(0,'time','שעת ביצוע ההדברה');
  [['name','שם מלא של המדביר'],['license','מספר רישיון'],['phone','טלפון נייד'],['email','דוא"ל'],['address','כתובת'],['licenseType','סוג רישיון']].forEach(([k,m])=>req(0,'tech.'+k,m));
  if(j.hasOperator)[['name','שם המפעיל'],['phone','טלפון המפעיל'],['email','דוא"ל המפעיל'],['address','כתובת המפעיל']].forEach(([k,m])=>req(0,'operator.'+k,m));
  // 1 client
  req(1,'client.name','שם מלא של המזמין');req(1,'client.role','תפקיד המזמין');
  if(j.client.role==='אחר')req(1,'client.roleOther','פירוט תפקיד המזמין');
  req(1,'client.phone','טלפון המזמין');
  // 2 place
  const p=j.place;
  if(!p.kind)add(2,'place.kind','בחירת סוג מקום ההדברה');
  else if(p.kind==='home'){req(2,'place.city','עיר');req(2,'place.street','רחוב');req(2,'place.houseNo','מספר בית');req(2,'place.aptNo','מספר דירה')}
  else if(p.kind==='building'){req(2,'place.buildingType','סוג המבנה');if(p.buildingType==='מבנה אחר')req(2,'place.buildingTypeOther','פירוט סוג המבנה');req(2,'place.city','עיר');req(2,'place.street','רחוב');req(2,'place.houseApt','מספר בית/דירה')}
  else if(p.kind==='open'){req(2,'place.authority','שם הרשות המקומית');req(2,'place.siteType','שם/סוג האתר');if(p.siteType==='אחר')req(2,'place.siteTypeOther','פירוט האתר');req(2,'place.siteDesc','תיאור האתר');req(2,'place.coords','נ"צ')}
  // 3 findings
  if(!j.findings.length)add(3,'findings','יש להוסיף לפחות מזיק אחד');
  j.findings.forEach((f,i)=>{const n=`מזיק ${i+1}: `;
    req(3,`findings.${i}.pest`,n+'שם המזיק');
    const ax=annexFor(f.pest);if(ax&&!ax.opt)req(3,`findings.${i}.subtype`,n+ax.label);
    req(3,`findings.${i}.identification`,n+'פעולות הזיהוי שבוצעו');
    req(3,`findings.${i}.signs`,n+'סימני הנגיעות');
    req(3,`findings.${i}.location`,n+'מיקום הנגיעות');
    req(3,`findings.${i}.level`,n+'רמת הנגיעות');});
  // 4 prevention
  req(4,'prevention','פעולות מניעה ו/או טיפול שבוצעו או הומלצו');
  req(4,'circumstances','הנסיבות שבהן הוחלט לנקוט בהדברה');
  // 5 warn before
  [['nature','טיב ההדברה'],['product','שם התכשיר'],['active','החומר הפעיל'],['riskHuman','סיכונים לאדם'],['riskAnimals','סיכונים לבעלי חיים'],['reentry','זמן כניסה לאחר ההדברה']].forEach(([k,m])=>req(5,'warnBefore.'+k,'לפני ההדברה: '+m));
  // 6 applications + special conditions
  if(!j.apps.length)add(6,'apps','יש להוסיף לפחות תכשיר אחד');
  j.apps.forEach((a,i)=>{const n=`תכשיר ${i+1}: `;
    [['pest','שם המזיק'],['product','השם המסחרי'],['active','שם החומר הפעיל'],['conc','ריכוז החומר הפעיל בתכשיר'],['batch','מספר אצווה'],['dose','מינון'],['unit','יחידת מידה']].forEach(([k,m])=>req(6,`apps.${i}.${k}`,n+m));
    if(a.unit==='אחר')req(6,`apps.${i}.unitOther`,n+'פירוט יחידת המידה');
    if(!a.rtu)req(6,`apps.${i}.useConc`,n+'ריכוז בתכשיר המוכן לשימוש');
    req(6,`apps.${i}.method`,n+'שיטת היישום');
    if(a.method==='אחר')req(6,`apps.${i}.methodOther`,n+'פירוט שיטת היישום');});
  if(j.opKind==='איוד')req(6,'sealing','פעולות איטום שנעשו לפני ההדברה');
  if(j.opKind==='ערפול')req(6,'publicNotice','האם בוצעה התראה מראש לציבור');
  // 7 warn after
  req(7,'warnAfter','אזהרות ומידע ללקוח במהלך ההדברה ובסיומה');
  // 8 handover & signatures
  if(!j.handover.delivered)add(8,'handover.delivered','אישור שהיומן הושאר/נמסר אצל המזמין');
  req(8,'handover.receiverName','שם מקבל היומן');req(8,'handover.receiverSig','חתימת מקבל היומן');req(8,'techSig','חתימת המדביר');
  if(j.hasAssistants){
    if(!j.assistants.length)add(8,'assistants','יש להוסיף מדביר מסייע או לבטל את הסעיף');
    j.assistants.forEach((a,i)=>{const n=`מסייע ${i+1}: `;
      [['name','שם מלא'],['license','מספר רישיון'],['licenseType','סוג רישיון'],['phone','טלפון נייד'],['email','דוא"ל'],['sig','חתימה']].forEach(([k,m])=>req(8,`assistants.${i}.${k}`,n+m));});
  }
  return E;
}

    try{const pr=await DB.collection('data/users/me').doc('pest_profile').get();if(pr.exists&&pr.data()){const r=pr.data();if(!S.profile.name||r.name)S.profile=Object.assign({...PROFILE_DEFAULT},clone(r))}else if(S.profile.name)pushProfile()}catch(e){}
    try{const m=await DB.doc('pest_meta/counter').get();if(m.exists)S.counter=Math.max(S.counter,+m.data().last||0)}catch(e){}
    for(const id in S.journals){const l=S.journals[id];if(!snap.docs.find(d=>d.id===id))S.pending[id]=1}
    saveLocal();await flushPending();setSync(Object.keys(S.pending).length?'offline':'ok');

function learnTemplates(j){
  const pairs=[['findTpl',j.findings.map(f=>f.signs)],['circTpl',[j.circumstances]],['prevTpl',[j.prevention]],
    ['natureTpl',[j.warnBefore.nature]],['natureAfterTpl',[j.natureAfter]],['warnTpl',[j.warnAfter]],['warTpl',[(j.warranty||{}).note]]];
  const seeds={findTpl:FIND_LIB,circTpl:CIRC_LIB,prevTpl:PREV_LIB,natureTpl:NATURE_LIB,natureAfterTpl:NATURE_AFTER_LIB,warnTpl:WARN_LIB,warTpl:WARRANTY_LIB};
  let added=0;
  pairs.forEach(([store,texts])=>texts.filter(Boolean).forEach(txt=>{
    String(txt).split('\n').map(x=>x.trim()).filter(x=>x.length>3).forEach(x=>{
      if(!seeds[store].includes(x)&&!S[store].includes(x)){S[store].unshift(x);added++}});
    if(S[store].length>120)S[store]=S[store].slice(0,120);
  }));
  if(added){saveLocal();pushTpl()}
  return added;
}

function addStation(site,label,type,loc){
  const no=Math.max(0,...stationsOf(site).map(x=>x.no))+1;
  const st={id:uid(),site,label:label||'',no,type:type||'bp',loc:loc||'',at:Date.now()};
  S.stations[st.id]=st;saveLocal();pushStation(st);return st;
}

function compressImg(file,max=1000,q=.55){return new Promise((res,rej)=>{
  const fr=new FileReader();
  fr.onload=()=>{const im=new Image();
    im.onload=()=>{const sc=Math.min(1,max/Math.max(im.width,im.height));
      const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
      const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(im,0,0,c.width,c.height);
      let out=c.toDataURL('image/jpeg',q);
      if(out.length>180000)out=c.toDataURL('image/jpeg',.4);
      res(out)};
    im.onerror=()=>rej(new Error('לא ניתן לקרוא את התמונה'));im.src=fr.result};
  fr.onerror=()=>rej(new Error('קריאת הקובץ נכשלה'));fr.readAsDataURL(file)})}

function splitActive(a){ // "x 5.00%, y 10.00%" -> names / concentrations, as stored in the registry
  const parts=String(a||'').split(/,\s*(?=[^,]*\d[\d.]*\s*%)/);const names=[],concs=[];
  parts.forEach(s=>{const m=s.trim().match(/^(.*?)\s*([\d.]+\s*%)\s*$/);if(m){names.push(m[1].trim());concs.push(m[2].replace(/\s/g,''))}else if(s.trim())names.push(s.trim())});
  return {active:names.join(', '),conc:concs.join(', ')};
}

function recentApps(){

    j.apps.forEach(a=>{if(!a.product)return;const k=norm(a.product)+'|'+norm(a.batch);if(seen.has(k))return;seen.add(k);out.push({a,j})});

  ${j.opKind==='ערפול'?`<p style="margin-top:6px"><b>האם בוצעה התראה מראש לציבור:</b> ${esc(j.publicNotice)||'—'}</p>`:''}

    return `<h3>תחנות האכלה וניטור</h3><div class="tblwrap"><table class="tbl"><tr><th>מס׳</th><th>סוג</th><th>מיקום</th><th>מצב</th></tr>

   <div class="pvbar">${errs.length?`<span>חסרים ${errs.length} פרטים לפני סיום</span><button class="link" data-a="pvToAudit">להשלמה</button>`:`<span>${ic('check',16)} היומן מלא ומוכן לסיום</span>`}</div>

function deliverHTML(j){
  const c=PDF[j.id]||{state:'idle'};
  const st=c.state==='busy'?'<span class="spin"></span> מכין את קובץ ה-PDF...':c.state==='ready'?'✓ קובץ ה-PDF מוכן לשליחה':c.state==='error'?`הפקת ה-PDF נכשלה: ${esc(c.err)}`:'';
  const canShareFile=c.state==='ready'&&navigator.canShare&&(()=>{try{return navigator.canShare({files:[c.file]})}catch(e){return false}})();
  return `<div class="deliver noprint" id="deliver"><h3>שליחת היומן ללקוח</h3><p class="status ${c.state==='error'?'bad':''}" role="status">${st}</p>
   <div class="stack">
    ${j.client.phone?`<a class="btn gold" href="${esc(smsHref(j))}" data-a-link="sms">${ic('sms',20)} SMS ללקוח (${esc(j.client.phone)})</a>`:'<p class="hint">לא הוזן טלפון למזמין.</p>'}
    ${canShareFile?`<button class="btn" data-a="shareFile" data-p="${j.id}">${ic('share',20)} שליחת קובץ ה-PDF (הודעות / וואטסאפ)</button>`:''}
    ${c.state==='ready'?`<button class="btn" data-a="savePdf" data-p="${j.id}">${ic('pdf',20)} שמירת ה-PDF במכשיר</button>`:''}
    ${c.state==='ready'?`<a class="btn ghost" href="${c.url}" download="${esc(pdfName(j))}" target="_blank" rel="noopener">${ic('eye',18)} פתיחת ה-PDF לצפייה</a>`:''}
    ${c.state==='error'||c.state==='idle'?`<button class="btn ghost" data-a="makePdf" data-p="${j.id}">${ic('pdf',18)} ${c.state==='error'?'נסו שוב להפיק PDF':'הפקת PDF'}</button>`:''}
    <button class="btn ghost" data-a="print">${ic('print',18)} הדפסה / שמירה כ-PDF</button>
    <button class="link" data-a="diag" data-p="${j.id}">לא עובד? בדיקת מערכת</button>
   </div>
   <p class="hint">ה-SMS נפתח באפליקציית ההודעות עם מספר הלקוח וסיכום היומן. לחיצה על "שליחה" שולחת אותו.</p>
  </div>`;
}
function refreshDeliver(id){if(view==='journal'&&param===id){const el=document.getElementById('deliver');const j=S.journals[id];if(el&&j)el.outerHTML=deliverHTML(j)}}

  return `${topbar('יומן הדברה #'+j.no,'archive')}
  <main class="page">
   ${deliverHTML(j)}
   <div class="noprint" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><button class="link" data-a="dup" data-p="${j.id}">יומן חדש לאותו לקוח ומקום</button><button class="del" data-a="delJ" data-p="${j.id}">מחיקה</button></div>

const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function smsText(j){
  const ap=j.apps.filter(a=>a.product);
  return [`שלום ${j.client.name},`,`יומן ביצוע הדברה מס׳ ${j.no} – ${j.company.name}`,
    `תאריך: ${fmtD(j.date)} ${j.time}`,`מקום: ${placeText(j.place)}`,j.geo?`מיקום מדויק: ${mapLink(j.geo)}`:'',
    `מזיקים: ${j.findings.map(f=>f.pest).filter(Boolean).join(', ')}`,
    `תכשירים: ${ap.map(a=>`${a.product} (${a.active} ${a.conc})`).join('; ')}`,
    `זמן כניסה לאחר ההדברה: ${j.warnBefore.reentry}`,
    j.warnAfter?`הנחיות: ${j.warnAfter}`:'',
    `מדביר: ${j.tech.name}, רישיון ${j.tech.license}, ${j.tech.phone}`,
    POISON].filter(Boolean).join('\n');
}
const smsHref=j=>`sms:${String(j.client.phone||'').replace(/[^\d+]/g,'')}${isIOS?'&':'?'}body=${encodeURIComponent(smsText(j))}`;
const intlPhone=p=>{let d=String(p).replace(/\D/g,'');if(d.startsWith('0'))d='972'+d.slice(1);return d};

function vArchive(){
  if(param==='draft'&&!flt._init){flt={q:'',from:'',to:'',status:'draft',_init:1}}
  const q=norm(flt.q);
  const list=journals().filter(j=>{
    if(flt.status&&j.status!==flt.status)return false;
    if(flt.from&&j.date<flt.from)return false;if(flt.to&&j.date>flt.to)return false;
    if(!q)return true;
    const hay=norm([j.no,j.date,fmtD(j.date),j.client.name,j.client.phone,j.place.city,placeText(j.place),j.place.street,j.tech.name,...j.findings.map(f=>f.pest),...j.apps.map(a=>a.product),...j.assistants.map(a=>a.name)].join(' '));
    return hay.includes(q);
  });
  return `${topbar('יומני הדברה','home')}
  <main class="page">
   <div class="filters">
    <input class="inp" type="search" data-flt="q" value="${esc(flt.q)}" placeholder="חיפוש: מספר, לקוח, טלפון, עיר, מזיק, תכשיר, מדביר" aria-label="חיפוש">
    <div class="two"><label class="field" style="margin:0"><span>מתאריך</span><input type="date" data-flt="from" value="${flt.from}"></label><label class="field" style="margin:0"><span>עד תאריך</span><input type="date" data-flt="to" value="${flt.to}"></label></div>
    <div class="seg" role="radiogroup" aria-label="סטטוס">${[['','הכול'],['done','הושלם'],['draft','טיוטה']].map(([k,l])=>`<button type="button" class="${flt.status===k?'on':''}" data-a="fltStatus" data-val="${k}">${l}</button>`).join('')}</div>
   </div>
   <p class="hint" style="margin:0 0 10px">${list.length} יומנים</p>
   ${list.map(jCard).join('')||'<div class="empty">לא נמצאו יומנים</div>'}
   <p class="hint">יומנים שהושלמו נשמרים בענן ולא ניתנים למחיקה לפני ${RETENTION_YEARS} שנים.</p>
  </main>`;
}

      <div class="acts">${c.phone?`<a class="round" href="tel:${esc(c.phone)}" aria-label="חיוג">${ic('phone',18)}</a>`:''}${pl?`<a class="round" target="_blank" rel="noopener" href="https://waze.com/ul?q=${encodeURIComponent(pl)}" aria-label="ניווט">${ic('nav',18)}</a>`:''}</div>

  </main>`;
}

function initSigs(){
  document.querySelectorAll('canvas[data-sig]').forEach(cv=>{
    const path=cv.dataset.sig,dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
    cv.width=w*dpr;cv.height=h*dpr;const ctx=cv.getContext('2d');if(!ctx)return;ctx.scale(dpr,dpr);
    ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#14281c';
    const v=getP(cur,path);if(v){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,w,h);im.src=v}
    let dr=false,last,moved=false;const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
    cv.onpointerdown=e=>{dr=true;moved=false;last=pos(e);cv.setPointerCapture(e.pointerId);e.preventDefault()};
    cv.onpointermove=e=>{if(!dr)return;const p=pos(e);ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();last=p;moved=true};
    const end=()=>{if(!dr)return;dr=false;if(!moved)return;
      const o=document.createElement('canvas');o.width=Math.min(600,w*dpr);o.height=Math.round(o.width*h/w);o.getContext('2d').drawImage(cv,0,0,o.width,o.height);
      setP(cur,path,o.toDataURL('image/png'));touch();cv.closest('.sigwrap')?.classList.remove('err')};
    cv.onpointerup=end;cv.onpointercancel=end;
  });
}

const PDF={};/* id -> {state:'idle'|'busy'|'ready'|'error', blob, url, err, ver} */
async function pdfBlob(j){
  if(typeof html2canvas==='undefined'||!window.jspdf)throw new Error('ספריית ה-PDF לא נטענה (בדקו חיבור לאינטרנט)');
  const {jsPDF}=window.jspdf;
  const host=document.createElement('div');
  host.setAttribute('aria-hidden','true');
  host.style.cssText='position:fixed;top:0;left:0;width:760px;background:#fff;z-index:-1;opacity:0;pointer-events:none';
  host.innerHTML=docHTML(j);document.body.appendChild(host);
  const paper=host.firstElementChild;paper.style.boxShadow='none';paper.style.borderRadius='0';paper.classList.remove('draftmark');
  host.querySelectorAll('.tblwrap').forEach(t=>t.style.overflow='visible');
  try{
    if(document.fonts&&document.fonts.ready)await Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]);
    const imgs=[...host.querySelectorAll('img')];await Promise.all(imgs.map(im=>im.complete?0:new Promise(r=>{im.onload=im.onerror=r})));
    const pdf=new jsPDF({unit:'mm',format:'a4',orientation:'portrait',compress:true});
    const PW=210,PH=297,M=10,CW=PW-2*M,BOTTOM=PH-M;let y=M;
    const pxToMm=CW/paper.clientWidth;
    const blocks=[...paper.children];
    const padL=parseFloat(getComputedStyle(paper).paddingLeft)||0;
    for(const el of blocks){
      const canvas=await html2canvas(el,{scale:2,backgroundColor:'#ffffff',logging:false,useCORS:true,windowWidth:760});
      const wMm=el.offsetWidth*pxToMm, hMm=el.offsetHeight*pxToMm;
      const x=M+(padL*pxToMm)*0; // blocks already sit inside padded paper; center horizontally
      const xx=M+(CW-wMm)/2;
      if(hMm<=BOTTOM-y){pdf.addImage(canvas.toDataURL('image/jpeg',.92),'JPEG',xx,y,wMm,hMm);y+=hMm+1.2;continue}
      if(hMm<=BOTTOM-M){pdf.addPage();y=M;pdf.addImage(canvas.toDataURL('image/jpeg',.92),'JPEG',xx,y,wMm,hMm);y+=hMm+1.2;continue}
      // taller than a page: slice
      const pxPerMm=canvas.height/hMm;let offMm=0;
      while(offMm<hMm){
        let avail=BOTTOM-y;if(avail<20){pdf.addPage();y=M;avail=BOTTOM-M}
        const sliceMm=Math.min(avail,hMm-offMm);
        const c=document.createElement('canvas');c.width=canvas.width;c.height=Math.ceil(sliceMm*pxPerMm);
        c.getContext('2d').drawImage(canvas,0,Math.floor(offMm*pxPerMm),canvas.width,c.height,0,0,canvas.width,c.height);
        pdf.addImage(c.toDataURL('image/jpeg',.92),'JPEG',xx,y,wMm,sliceMm);
        offMm+=sliceMm;y+=sliceMm;if(offMm<hMm){pdf.addPage();y=M}
      }
      y+=1.2;
    }
    const n=pdf.getNumberOfPages();
    for(let i=1;i<=n;i++){pdf.setPage(i);pdf.setFontSize(8);pdf.setTextColor(120);pdf.text(`${i}/${n}  #${j.no}`,PW/2,PH-4,{align:'center'})}
    return pdf.output('blob');
  }finally{host.remove()}
}
async function ensurePdf(j){
  const ver=j.updatedAt;const c=PDF[j.id];
  if(c&&c.ver===ver&&(c.state==='ready'||c.state==='busy'))return c.promise;
  const entry={state:'busy',ver};PDF[j.id]=entry;refreshDeliver(j.id);
  entry.promise=pdfBlob(j).then(blob=>{entry.blob=blob;entry.file=new File([blob],pdfName(j),{type:'application/pdf'});if(entry.url)URL.revokeObjectURL(entry.url);entry.url=URL.createObjectURL(blob);entry.state='ready';refreshDeliver(j.id);return blob})
    .catch(e=>{entry.state='error';entry.err=(e&&e.message)||String(e);refreshDeliver(j.id);throw e});
  return entry.promise;
}

    sheet(`<h3>טעינה מיומנים אחרונים</h3><p class="hint" style="margin:0">בוחרים תכשיר ואצווה. מזיק ומינון מזינים מחדש לכל טיפול.</p>
      ${last?`<button class="btn w" style="margin-top:12px" data-a="loadLastAll" data-p="${last.id}">${ic('copy',18)} כל התכשירים מיומן #${last.no} (${last.apps.filter(a=>a.product).length})</button>`:''}
      ${rows.map((r,i)=>`<button class="pick" data-a="pickRecent" data-i="${i}"><div class="main"><b>${esc(r.a.product)}</b><small>אצווה: ${esc(r.a.batch)||'—'} · ${esc(r.a.active)} ${esc(r.a.conc)}</small><small>${esc(r.a.method==='אחר'?r.a.methodOther:r.a.method)}${r.a.unit?' · '+esc(r.a.unit==='אחר'?r.a.unitOther:r.a.unit):''} · יומן #${r.j.no}, ${fmtD(r.j.date)}</small></div><span class="plusb" aria-hidden="true">${ic('plus',18)}</span></button>`).join('')}
      <button class="btn ghost w" style="margin-top:12px" data-a="closeSheet">סגירה</button>`);
    A._recent=rows;
  },
  pickRecent:d=>{const r=A._recent[+d.i];addFromRecent(r.a);touch();closeSheet();render();toast(`${r.a.product} נוסף – השלימו מזיק ומינון`)},
  loadLastAll:d=>{const j=S.journals[d.p];j.apps.filter(a=>a.product).forEach(addFromRecent);touch();closeSheet();render();toast(`נטענו התכשירים מיומן #${j.no} – השלימו מזיק ומינון`)},
  closeSheet:()=>closeSheet(),
  complete:async()=>{
    const errs=validate(cur);
    if(errs.length){showErr=true;cur.step=5;view='wizard';render();setTimeout(()=>document.getElementById('audit')?.scrollIntoView({behavior:'smooth'}),60);info(`חסרים ${errs.length} פרטים. הרשימה מופיעה ב"בדיקת תקינות היומן" – לחיצה על פריט מעבירה לשדה.`,'לא ניתן לסיים עדיין');return}
    if(!await ask('לאחר הסיום לא ניתן לערוך את היומן. ה-PDF יופק מיד.',{title:`סיום יומן #${cur.no}`,ok:'סיום והפקה'}))return;
    cur.status='done';cur.completedAt=Date.now();delete cur.step;
    cur.apps.forEach(a=>{if(a.product&&!prodIdx.has(norm(a.product))){S.mine.push({n:a.product,a:[a.active,a.conc].filter(Boolean).join(' ')})}});buildIdx();
    const learned=learnTemplates(cur);upsertClient(cur);touch();pushJournal(cur);const id=cur.id;cur=null;showErr=false;go('journal',id);
    if(learned)setTimeout(()=>toast(`${learned} ניסוחים נשמרו לתבניות שלך`),2600);
    ensurePdf(S.journals[id]).then(()=>{if(view==='journal'&&param===id)toast('ה-PDF מוכן')}).catch(e=>{});
    info(`היומן נשמר בארכיון. קובץ ה-PDF מופק כעת ויופיע במסך למעלה.`,`יומן #${S.journals[id].no} הושלם`)},
  makePdf:d=>{const j=S.journals[d.p];delete PDF[j.id];ensurePdf(j).catch(()=>{})},
  pdf:d=>A.makePdf(d),
  savePdf:async d=>{const j=S.journals[d.p],c=PDF[j.id];if(!c||c.state!=='ready')return toast('הקובץ עדיין מוכן');
    let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){dl=null}
    if(dl){try{await dl.save({filename:pdfName(j),data:c.blob});toast('ה-PDF נשמר במכשיר');return}catch(e){if(e&&e.code==='declined')return;info('השמירה נכשלה: '+((e&&e.message)||e))}}
    const a=document.createElement('a');a.href=c.url;a.download=pdfName(j);a.rel='noopener';document.body.appendChild(a);a.click();a.remove();
    if(!dl)toast('אם הקובץ לא נשמר – נסו "פתיחת ה-PDF לצפייה" או "הדפסה"')},
  diag:async d=>{const j=S.journals[d.p],c=PDF[j.id]||{};let dl='לא';try{dl=(window.claude&&window.claude.use&&await window.claude.use('downloads'))?'כן':'לא'}catch(e){dl='שגיאה'}
    let share='לא';try{share=(navigator.canShare&&c.file&&navigator.canShare({files:[c.file]}))?'כן':(navigator.share?'טקסט בלבד':'לא')}catch(e){share='לא'}
    info(['ספריית תמונה: '+(typeof html2canvas!=='undefined'?'נטענה':'לא נטענה'),
      'ספריית PDF: '+(window.jspdf?'נטענה':'לא נטענה'),
      'מצב הקובץ: '+(c.state||'לא התחיל')+(c.err?' – '+c.err:''),
      'שמירה למכשיר: '+dl,'שיתוף קבצים: '+share,
      'ענן: '+(DB?'מחובר':'לא מחובר'),'גרסה: 2.3'].join('\n'),'בדיקת מערכת')},
  shareFile:d=>{const j=S.journals[d.p],c=PDF[j.id];if(!c||c.state!=='ready')return;
    // call share synchronously inside the tap (iOS requires a user gesture)
    navigator.share({files:[c.file],title:`יומן הדברה #${j.no}`,text:`יומן ביצוע הדברה מס׳ ${j.no} – ${j.company.name}`}).catch(e=>{if(e&&e.name!=='AbortError')info('השיתוף נכשל: '+(e.message||e.name))})},
  print:()=>{try{window.print()}catch(e){toast('ההדפסה אינה זמינה כאן')}},
  dup:async d=>{const s=S.journals[d.p];const no=await nextNo();cur=blankJournal(no,S.profile);
    cur.client=clone(s.client);cur.place=clone(s.place);cur.opKind=s.opKind;cur.hasOperator=s.hasOperator;cur.operator=clone(s.operator);
    S.journals[cur.id]=cur;touch();toast('פרטי לקוח ומקום הועתקו. שאר היומן ריק.');go('wizard')},
  delPhoto:async d=>{if(!await ask('למחוק את התמונה?',{ok:'מחיקה',danger:true}))return;await delPhoto(d.p);render()},
  delJ:async d=>{const j=S.journals[d.p];
    if(j.status==='done'){const until=new Date(j.completedAt);until.setFullYear(until.getFullYear()+RETENTION_YEARS);if(Date.now()<until){await info(`יומן שהושלם נשמר לפחות ${RETENTION_YEARS} שנים. ניתן למחוק אותו החל מ-${until.toLocaleDateString('he-IL')}.`,'לא ניתן למחוק');return}}
    if(!await ask(j.status==='draft'?'למחוק את הטיוטה?':'למחוק את היומן לצמיתות?',{ok:'מחיקה',danger:true}))return;if(cur&&cur.id===j.id)cur=null;delete S.journals[j.id];delete S.pending[j.id];saveLocal();if(DB){try{await DB.collection('pest_logs').doc(j.id).delete()}catch(e){}}go('archive')},
  fltStatus:d=>{flt.status=d.val;render()},
  pfLicense:d=>{S.profile.licenseType=d.val;A._pfErr=(A._pfErr||[]).filter(k=>k!=='licenseType');saveLocal();render()},
  saveProfile:async()=>{
    const labels={name:'שם מלא',license:'מספר רישיון',phone:'טלפון נייד',email:'דוא"ל',address:'כתובת',licenseType:'סוג רישיון',company:'שם החברה',vat:'ע.מ',companyPhone:'טלפון החברה',companyEmail:'דוא"ל החברה'};
    const miss=Object.keys(labels).filter(k=>blankStr(S.profile[k]));
    A._pfErr=miss;
    if(miss.length){render();toast('חסר: '+miss.map(k=>labels[k]).join(', '));const el=document.querySelector('.field.err input,.chips.err');el&&el.scrollIntoView({block:'center',behavior:'smooth'});return}
    if(!saveLocal())return;
    if(cur&&cur.status==='draft'){/* refresh tech details in the open draft only if empty */}
    if(DB){try{await DB.collection('data/users/me').doc('pest_profile').set(clone(S.profile));toast('הפרופיל נשמר בענן ובמכשיר')}catch(e){toast('הפרופיל נשמר במכשיר. יסונכרן לענן כשיהיה חיבור')}}
    else toast('הפרופיל נשמר');
    go('home')},
};

document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;if(el.tagName==='A')return;e.preventDefault();const f=A[el.dataset.a];f&&f(el.dataset,e,el)});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.sted){const st=S.stations[t.dataset.sted];if(st){st.loc=t.value;saveLocalSoon();clearTimeout(A._sl);A._sl=setTimeout(()=>pushStation(st),1000)}return}
  if(t.dataset.pcap){const ph=S.photos[t.dataset.pcap];if(ph){ph.caption=t.value;saveLocalSoon();clearTimeout(A._pc);A._pc=setTimeout(()=>pushPhoto(ph),1200)}return}
  if(t.dataset.flt!==undefined){flt[t.dataset.flt]=t.value;const k=t.dataset.flt,pos=t.selectionStart;render();const n=document.querySelector(`[data-flt="${k}"]`);if(n){n.focus();if(k==='q')try{n.setSelectionRange(pos,pos)}catch(_){}}return}
  if(t.dataset.cl){const c=S.clients[param];if(c){const k=t.dataset.cl,old=c.name;c[k]=t.value;c.updatedAt=Date.now();
    if(k==='name')journals().forEach(j=>{if(norm(j.client.name)===norm(old)){j.client.name=t.value;S.journals[j.id]=j;queuePush(j)}});
    saveLocalSoon();clearTimeout(A._clp);A._clp=setTimeout(()=>pushClient(c),1000)}return}
  if(t.dataset.pf){S.profile[t.dataset.pf]=t.value;if(A._pfErr){A._pfErr=A._pfErr.filter(k=>k!==t.dataset.pf);t.closest('.field')?.classList.remove('err')}saveLocalSoon();clearTimeout(A._pf);A._pf=setTimeout(pushProfile,1200);return}
  const f=t.dataset.f;if(!f||!cur)return;
  setP(cur,f,t.value);t.classList.remove('err');t.closest('.field')?.classList.remove('err');
  const m=f.match(/^apps\.(\d+)\.product$/);if(m)productPicked(+m[1]);
  if(f==='client.name'){acRender(t.value);touch();
    clearTimeout(A._cl);A._cl=setTimeout(()=>{
      const want=!!lastForClient(cur.client.name,cur.client.phone,cur.id),have=!!document.querySelector('[data-a="loadLastSheet"]');
      if(want===have)return;
      const el=document.querySelector('[data-f="client.name"]'),pos=el?el.selectionStart:0,open=!!document.querySelector('#acList .acitem');
      render();
      const n=document.querySelector('[data-f="client.name"]');
      if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}if(open)acRender(n.value)}
    },700);
    return}
  touch();
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset.photo&&cur){
    const files=[...t.files];t.value='';if(!files.length)return;
    toast(files.length>1?`מעבד ${files.length} תמונות...`:'מעבד תמונה...');
    for(const f of files){
      try{const src=await compressImg(f);const ph={id:uid(),jid:cur.id,kind:t.dataset.photo,caption:'',src,at:Date.now()};
        S.photos[ph.id]=ph;pushPhoto(ph);}
      catch(err){info((err&&err.message)||'התמונה לא נקראה','תמונה')}
    }
    if(!saveLocal())info('אין מספיק מקום במכשיר לתמונות נוספות. מחקו תמונות ישנות.','אחסון');
    render();toast('התמונות נוספו');return;
  }
  if(t.dataset.st&&cur){const id=t.dataset.st;const st=S.stations[id];
    cur.stationChecks[id]=Object.assign(cur.stationChecks[id]||{},{status:t.value,no:st?st.no:0,type:st?st.type:'',loc:st?st.loc:''});touch();render();return}
  if(t.dataset.sted){const st=S.stations[t.dataset.sted];if(st){st.loc=t.value;saveLocalSoon();clearTimeout(A._sl);A._sl=setTimeout(()=>pushStation(st),1000)}return}
  if(t.dataset.pcap){const ph=S.photos[t.dataset.pcap];if(ph){ph.caption=t.value;saveLocalSoon();pushPhoto(ph)}return}
  if(t.dataset.c&&cur){setP(cur,t.dataset.c,t.checked);t.closest('.check')?.classList.remove('err');touch();return}
  if(t.tagName==='SELECT'&&t.dataset.f&&cur){setP(cur,t.dataset.f,t.value);touch();render()}
});
function productPicked(i){
  const a=cur.apps[i],p=prodIdx.get(norm(a.product));if(!p)return;
  const {active,conc}=splitActive(p.a);
  a.product=p.n;if(active)a.active=active;if(conc)a.conc=conc;a.fromDb=true;
  [['active',a.active],['conc',a.conc]].forEach(([k,v])=>{const el=document.querySelector(`[data-f="apps.${i}.${k}"]`);if(el)el.value=v});
  const n=document.getElementById('dbnote-'+i);if(n)n.innerHTML=dbNote(i);
}
window.addEventListener('beforeunload',()=>{clearTimeout(saveT);saveLocal()});

function crash(msg){
  let el=document.getElementById('crash');
  if(!el){el=document.createElement('div');el.id='crash';el.className='crash';document.body.appendChild(el);
    el.addEventListener('click',e=>{if(e.target.tagName==='BUTTON')el.remove()})}
  el.innerHTML=`<b>שגיאה באפליקציה:</b> ${esc(msg)}<br><button>סגירה</button>`;
}
window.addEventListener('error',e=>crash((e.message||'')+' · '+(e.filename||'').split('/').pop()+':'+e.lineno));
window.addEventListener('unhandledrejection',e=>crash('Promise: '+((e.reason&&(e.reason.message||e.reason.code))||e.reason)));
try{localStorage.setItem('yp-test','1');localStorage.removeItem('yp-test')}catch(e){setTimeout(()=>crash('אין גישה לאחסון המקומי במכשיר: '+e.message),500)}
document.addEventListener('focusin',e=>{if(e.target.dataset&&e.target.dataset.f==='client.name')acRender(e.target.value)});
document.addEventListener('focusout',e=>{if(e.target.dataset&&e.target.dataset.f==='client.name')setTimeout(()=>{const b=document.getElementById('acList');if(b&&!b.contains(document.activeElement))b.innerHTML=''},250)});
render();
initCloud();
</script>
</body>
