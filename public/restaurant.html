<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>ניהול מסעדה · דשבורד</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👨‍🍳</text></svg>">
<style>
/* ═══════════════════════════════════════════════════════════════
   Design tokens — semantic palette, fluid type, 8pt grid
   ═══════════════════════════════════════════════════════════════ */
:root {
  --color-bg:        #FAF7F2;
  --color-surface:   #FFFFFF;
  --color-surface-2: #F3EEE6;
  --color-primary:   #9A3412;
  --color-primary-hover: #7C2D12;
  --color-on-primary:#FFFFFF;
  --color-accent:    #B45309;
  --color-text:      #1C1917;
  --color-text-2:    #57534E;
  --color-border:    #E7E0D4;
  --color-success:   #15803D;
  --color-success-bg:#DCFCE7;
  --color-error:     #B91C1C;
  --color-error-bg:  #FEE2E2;
  --color-warning:   #A16207;
  --color-warning-bg:#FEF9C3;
  --color-info:      #1D4ED8;
  --color-info-bg:   #DBEAFE;
  --color-overlay:   rgba(28,25,23,.55);

  --shadow-1: 0 1px 3px rgba(28,25,23,.08), 0 1px 2px rgba(28,25,23,.04);
  --shadow-2: 0 8px 24px rgba(28,25,23,.12);

  --radius-s: 8px; --radius-m: 12px; --radius-l: 20px; --radius-full: 999px;

  --sp-1: 8px; --sp-2: 16px; --sp-3: 24px; --sp-4: 32px; --sp-5: 40px; --sp-6: 48px;

  --fs-caption: clamp(.75rem, .72rem + .15vw, .8125rem);
  --fs-body:    clamp(.9375rem, .9rem + .2vw, 1rem);
  --fs-h4:      clamp(1.0625rem, 1rem + .3vw, 1.1875rem);
  --fs-h3:      clamp(1.1875rem, 1.1rem + .5vw, 1.375rem);
  --fs-h2:      clamp(1.375rem, 1.25rem + .7vw, 1.75rem);
  --fs-h1:      clamp(1.625rem, 1.4rem + 1vw, 2.125rem);

  --transition: 200ms ease-in-out;
}
[data-theme="dark"] {
  --color-bg:        #141110;
  --color-surface:   #1E1A18;
  --color-surface-2: #29231F;
  --color-primary:   #F97316;
  --color-primary-hover: #FB923C;
  --color-on-primary:#1C1917;
  --color-accent:    #FBBF24;
  --color-text:      #F5F0EA;
  --color-text-2:    #A8A29E;
  --color-border:    #38302B;
  --color-success:   #4ADE80;
  --color-success-bg:rgba(74,222,128,.14);
  --color-error:     #F87171;
  --color-error-bg:  rgba(248,113,113,.14);
  --color-warning:   #FACC15;
  --color-warning-bg:rgba(250,204,21,.14);
  --color-info:      #93C5FD;
  --color-info-bg:   rgba(147,197,253,.14);
  --color-overlay:   rgba(0,0,0,.65);
  --shadow-1: 0 1px 3px rgba(0,0,0,.4);
  --shadow-2: 0 8px 24px rgba(0,0,0,.5);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Heebo", "Segoe UI", "Assistant", -apple-system, sans-serif;
  background: var(--color-bg); color: var(--color-text);
  font-size: var(--fs-body); line-height: 1.6; min-height: 100dvh;
  transition: background var(--transition), color var(--transition);
}
button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--color-primary); outline-offset: 2px; border-radius: 4px; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ═══ Header ═══ */
.site-header {
  position: sticky; top: 0; z-index: 40;
  background: var(--color-surface);
  border-bottom: 1px solid var(--color-border);
  box-shadow: var(--shadow-1);
}
.site-header__inner {
  max-width: 1200px; margin-inline: auto;
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--sp-2); padding: var(--sp-2) var(--sp-3);
}
.brand { display: flex; align-items: center; gap: var(--sp-1); }
.brand__logo { font-size: 1.5rem; line-height: 1; }
.brand__name { font-size: var(--fs-h4); font-weight: 700; }
.brand__badge {
  font-size: var(--fs-caption); font-weight: 600;
  background: var(--color-primary); color: var(--color-on-primary);
  border-radius: var(--radius-full); padding: 2px 10px;
}
.header-actions { display: flex; align-items: center; gap: var(--sp-1); }
.live-dot {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: var(--fs-caption); font-weight: 600; color: var(--color-text-2);
}
.live-dot::before {
  content: ""; width: 8px; height: 8px; border-radius: var(--radius-full);
  background: var(--color-success);
  animation: blink 2s ease-in-out infinite;
}
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
.theme-toggle {
  width: 40px; height: 40px; border-radius: var(--radius-full);
  display: grid; place-items: center; font-size: 1.125rem;
  background: var(--color-surface-2); border: 1px solid var(--color-border);
  transition: transform var(--transition);
}
.theme-toggle:hover { transform: rotate(15deg) scale(1.05); }

/* ═══ Layout ═══ */
.page { max-width: 1200px; margin-inline: auto; padding: var(--sp-3); display: grid; gap: var(--sp-3); }

/* ═══ Stats ═══ */
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--sp-2); }
@media (min-width: 768px) { .stats { grid-template-columns: repeat(4, 1fr); } }
.stat {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-m);
  padding: var(--sp-2) var(--sp-3);
  box-shadow: var(--shadow-1);
  display: grid; gap: 2px;
  border-inline-start: 4px solid var(--stat-color, var(--color-primary));
  transition: transform var(--transition), box-shadow var(--transition);
}
.stat:hover { transform: translateY(-2px); box-shadow: var(--shadow-2); }
.stat__value { font-size: var(--fs-h1); font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat__label { font-size: var(--fs-caption); font-weight: 600; color: var(--color-text-2); }
.stat--new       { --stat-color: var(--color-info); }
.stat--preparing { --stat-color: var(--color-warning); }
.stat--ready     { --stat-color: var(--color-success); }
.stat--tables    { --stat-color: var(--color-accent); }

/* ═══ Tabs ═══ */
.tabs {
  display: flex; gap: var(--sp-1);
  background: var(--color-surface-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-m); padding: 4px;
  width: fit-content; max-width: 100%;
  overflow-x: auto;
}
.tab {
  padding: var(--sp-1) var(--sp-3);
  border-radius: var(--radius-s);
  font-weight: 600; white-space: nowrap;
  color: var(--color-text-2);
  transition: all var(--transition);
}
.tab:hover { color: var(--color-text); }
.tab[aria-selected="true"] {
  background: var(--color-surface); color: var(--color-primary);
  box-shadow: var(--shadow-1);
}
.tab__count {
  display: inline-grid; place-items: center;
  min-width: 22px; height: 22px; padding-inline: 6px;
  margin-inline-start: 6px;
  background: var(--color-primary); color: var(--color-on-primary);
  border-radius: var(--radius-full); font-size: .75rem;
}

/* ═══ Orders board ═══ */
.orders-grid { display: grid; gap: var(--sp-2); grid-template-columns: 1fr; }
@media (min-width: 700px)  { .orders-grid { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1024px) { .orders-grid { grid-template-columns: repeat(3, 1fr); } }

.order-card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-m);
  box-shadow: var(--shadow-1);
  display: flex; flex-direction: column;
  overflow: hidden;
  animation: card-in 300ms ease-out both;
  transition: box-shadow var(--transition);
}
.order-card:hover { box-shadow: var(--shadow-2); }
@keyframes card-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.order-card--new { border-inline-start: 4px solid var(--color-info); }
.order-card--seen, .order-card--preparing { border-inline-start: 4px solid var(--color-warning); }
.order-card--ready { border-inline-start: 4px solid var(--color-success); }

.order-card__head {
  display: flex; align-items: center; justify-content: space-between;
  padding: var(--sp-2); gap: var(--sp-1);
  border-bottom: 1px dashed var(--color-border);
}
.order-card__table { font-size: var(--fs-h4); font-weight: 800; }
.order-card__meta { font-size: var(--fs-caption); color: var(--color-text-2); font-variant-numeric: tabular-nums; }
.status-pill {
  font-size: var(--fs-caption); font-weight: 700;
  border-radius: var(--radius-full); padding: 4px 12px; white-space: nowrap;
}
.status-pill--new       { background: var(--color-info-bg);    color: var(--color-info); }
.status-pill--seen      { background: var(--color-warning-bg); color: var(--color-warning); }
.status-pill--preparing { background: var(--color-warning-bg); color: var(--color-warning); }
.status-pill--ready     { background: var(--color-success-bg); color: var(--color-success); }

.order-card__items { padding: var(--sp-2); display: grid; gap: var(--sp-1); flex: 1; }
.order-line { display: flex; justify-content: space-between; gap: var(--sp-1); }
.order-line__qty {
  flex: 0 0 auto; font-weight: 700; color: var(--color-primary);
  font-variant-numeric: tabular-nums; min-width: 32px;
}
.order-line__name { flex: 1; font-weight: 500; }
.order-line__req {
  display: block; font-size: var(--fs-caption); color: var(--color-warning);
  font-weight: 600;
}
.order-card__notes {
  margin: 0 var(--sp-2) var(--sp-2);
  background: var(--color-warning-bg); color: var(--color-warning);
  font-size: var(--fs-caption); font-weight: 600;
  border-radius: var(--radius-s); padding: var(--sp-1) var(--sp-2);
}
.order-card__actions {
  display: flex; gap: var(--sp-1);
  padding: var(--sp-2);
  border-top: 1px solid var(--color-border);
  background: var(--color-surface-2);
}

/* ═══ Buttons ═══ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px var(--sp-2); border-radius: var(--radius-s);
  font-weight: 600; font-size: var(--fs-body);
  transition: all var(--transition); min-height: 44px;
}
.btn--primary { background: var(--color-primary); color: var(--color-on-primary); flex: 1; }
.btn--primary:hover { background: var(--color-primary-hover); transform: translateY(-1px); box-shadow: var(--shadow-1); }
.btn--primary:disabled { opacity: .55; cursor: not-allowed; transform: none; }
.btn--ghost { background: var(--color-surface); border: 1px solid var(--color-border); }
.btn--ghost:hover { border-color: var(--color-primary); color: var(--color-primary); }
.btn--danger-ghost { background: transparent; color: var(--color-error); border: 1px solid transparent; }
.btn--danger-ghost:hover { background: var(--color-error-bg); }
.btn--sm { min-height: 36px; padding: 6px 12px; font-size: var(--fs-caption); }
.btn--icon { width: 40px; min-height: 40px; padding: 0; border-radius: var(--radius-s); }

/* ═══ Menu admin ═══ */
.panel-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--sp-2); flex-wrap: wrap;
}
.panel-head h2 { font-size: var(--fs-h3); font-weight: 700; }
.menu-admin-list { display: grid; gap: var(--sp-3); }
.menu-cat h3 {
  font-size: var(--fs-h4); font-weight: 700; margin-bottom: var(--sp-1);
  display: flex; align-items: center; gap: var(--sp-1);
}
.menu-cat h3::after { content: ""; flex: 1; height: 1px; background: var(--color-border); }
.menu-rows { display: grid; gap: var(--sp-1); }
.menu-row {
  display: flex; align-items: center; gap: var(--sp-2);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-m);
  padding: var(--sp-1) var(--sp-2);
  box-shadow: var(--shadow-1);
  transition: opacity var(--transition), border-color var(--transition);
}
.menu-row:hover { border-color: var(--color-accent); }
.menu-row--off { opacity: .55; }
.menu-row__info { flex: 1; min-width: 0; }
.menu-row__name { font-weight: 700; }
.menu-row__desc {
  font-size: var(--fs-caption); color: var(--color-text-2);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.menu-row__price { font-weight: 700; color: var(--color-primary); white-space: nowrap; font-variant-numeric: tabular-nums; }
.menu-row__actions { display: flex; gap: 4px; align-items: center; }

/* Switch */
.switch {
  position: relative; width: 44px; height: 26px; flex: 0 0 44px;
  border-radius: var(--radius-full);
  background: var(--color-border);
  transition: background var(--transition);
}
.switch[aria-checked="true"] { background: var(--color-success); }
.switch__knob {
  position: absolute; top: 3px; inset-inline-start: 3px;
  width: 20px; height: 20px; border-radius: var(--radius-full);
  background: #fff; box-shadow: var(--shadow-1);
  transition: transform var(--transition);
}
.switch[aria-checked="true"] .switch__knob { transform: translateX(-18px); }

/* ═══ History ═══ */
.history-list { display: grid; gap: var(--sp-1); }
.history-row {
  display: flex; align-items: center; gap: var(--sp-2);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-m);
  padding: var(--sp-1) var(--sp-2);
  font-size: var(--fs-caption);
}
.history-row__id { font-weight: 700; color: var(--color-text-2); flex: 0 0 56px; font-variant-numeric: tabular-nums; }
.history-row__table { font-weight: 700; flex: 0 0 auto; }
.history-row__items { flex: 1; color: var(--color-text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.history-row__time { color: var(--color-text-2); white-space: nowrap; font-variant-numeric: tabular-nums; }

/* ═══ Dialog ═══ */
dialog {
  border: none; border-radius: var(--radius-l);
  background: var(--color-surface); color: var(--color-text);
  box-shadow: var(--shadow-2);
  padding: 0; width: min(92vw, 480px);
  margin: auto;
}
dialog::backdrop { background: var(--color-overlay); }
dialog[open] { animation: dialog-in 250ms ease-out; }
@keyframes dialog-in { from { opacity: 0; transform: translateY(12px) scale(.97); } to { opacity: 1; transform: none; } }
.dialog__header {
  display: flex; align-items: center; justify-content: space-between;
  padding: var(--sp-3) var(--sp-3) 0;
}
.dialog__title { font-size: var(--fs-h3); font-weight: 700; }
.dialog__close {
  width: 36px; height: 36px; border-radius: var(--radius-full);
  display: grid; place-items: center;
  background: var(--color-surface-2);
  transition: transform var(--transition);
}
.dialog__close:hover { transform: rotate(90deg); }
.dialog__body { padding: var(--sp-3); display: grid; gap: var(--sp-2); }
.dialog__footer { display: flex; gap: var(--sp-1); justify-content: flex-end; padding: 0 var(--sp-3) var(--sp-3); }

/* ═══ Forms & validation ═══ */
.field { display: grid; gap: 6px; }
.field__label { font-size: var(--fs-caption); font-weight: 600; color: var(--color-text-2); }
.field__label .req { color: var(--color-error); }
.field__input {
  width: 100%; padding: 10px var(--sp-2);
  background: var(--color-surface-2);
  border: 1.5px solid var(--color-border);
  border-radius: var(--radius-s);
  transition: border-color var(--transition), background var(--transition);
}
.field__input:focus { outline: none; border-color: var(--color-primary); background: var(--color-surface); }
.field.is-error .field__input { border-color: var(--color-error); }
.field.is-success .field__input { border-color: var(--color-success); }
.field__msg { font-size: var(--fs-caption); font-weight: 600; min-height: 1.2em; }
.field.is-error .field__msg { color: var(--color-error); }
.field.is-success .field__msg { color: var(--color-success); }
.field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-2); }
@media (max-width: 480px) { .field-grid { grid-template-columns: 1fr; } }

/* ═══ Empty state, skeleton, toast ═══ */
.empty-state {
  text-align: center; padding: var(--sp-6) var(--sp-2);
  color: var(--color-text-2);
  display: grid; gap: var(--sp-1); justify-items: center;
  grid-column: 1 / -1;
}
.empty-state__icon { font-size: 2.5rem; }
.skeleton {
  border-radius: var(--radius-m); height: 180px;
  background: linear-gradient(100deg, var(--color-surface-2) 40%, var(--color-border) 50%, var(--color-surface-2) 60%);
  background-size: 200% 100%;
  animation: shimmer 1.4s linear infinite;
}
@keyframes shimmer { to { background-position: -200% 0; } }

.toast-region {
  position: fixed; top: var(--sp-2); inset-inline: 0; z-index: 100;
  display: grid; justify-items: center; gap: var(--sp-1);
  pointer-events: none; padding-inline: var(--sp-2);
}
.toast {
  background: var(--color-text); color: var(--color-bg);
  padding: var(--sp-1) var(--sp-3); border-radius: var(--radius-full);
  font-size: var(--fs-caption); font-weight: 600;
  box-shadow: var(--shadow-2);
  animation: toast-in 250ms ease-out both;
}
.toast--success { background: var(--color-success); color: #fff; }
.toast--error { background: var(--color-error); color: #fff; }
.toast.is-leaving { animation: toast-out 250ms ease-in both; }
@keyframes toast-in { from { opacity: 0; transform: translateY(-12px) scale(.96); } to { opacity: 1; transform: none; } }
@keyframes toast-out { from { opacity: 1; } to { opacity: 0; transform: translateY(-12px) scale(.96); } }

/* New-order attention flash */
@keyframes flash-border {
  0%, 100% { border-color: var(--color-border); }
  50% { border-color: var(--color-info); }
}
.order-card--new { animation: card-in 300ms ease-out both, flash-border 1.6s ease-in-out 2; }
</style>
</head>
<body>

<header class="site-header">
  <div class="site-header__inner">
    <div class="brand">
      <span class="brand__logo" aria-hidden="true">🍽️</span>
      <span class="brand__name">המסעדה</span>
      <span class="brand__badge">ניהול</span>
    </div>
    <div class="header-actions">
      <span class="live-dot" id="liveDot">מתעדכן חי</span>
      <button class="theme-toggle" id="themeToggle" aria-label="החלף מצב תצוגה בהיר/כהה" aria-pressed="false">🌙</button>
    </div>
  </div>
</header>

<main class="page">
  <h1 class="visually-hidden">דשבורד ניהול מסעדה</h1>

  <!-- Stats -->
  <section class="stats" aria-label="נתונים חיים">
    <div class="stat stat--new"><span class="stat__value" id="statNew">–</span><span class="stat__label">הזמנות חדשות</span></div>
    <div class="stat stat--preparing"><span class="stat__value" id="statPreparing">–</span><span class="stat__label">בהכנה</span></div>
    <div class="stat stat--ready"><span class="stat__value" id="statReady">–</span><span class="stat__label">מוכנות להגשה</span></div>
    <div class="stat stat--tables"><span class="stat__value" id="statTables">–</span><span class="stat__label">שולחנות פעילים</span></div>
  </section>

  <!-- Tabs -->
  <div class="tabs" role="tablist" aria-label="אזורי ניהול">
    <button class="tab" role="tab" id="tab-orders" aria-selected="true" aria-controls="panel-orders">
      הזמנות פעילות<span class="tab__count" id="ordersCount" hidden>0</span>
    </button>
    <button class="tab" role="tab" id="tab-menu" aria-selected="false" aria-controls="panel-menu">ניהול תפריט</button>
    <button class="tab" role="tab" id="tab-history" aria-selected="false" aria-controls="panel-history">היסטוריה</button>
  </div>

  <!-- Orders panel -->
  <section id="panel-orders" role="tabpanel" aria-labelledby="tab-orders">
    <div class="orders-grid" id="ordersGrid" aria-live="polite">
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    </div>
  </section>

  <!-- Menu panel -->
  <section id="panel-menu" role="tabpanel" aria-labelledby="tab-menu" hidden>
    <div style="display:grid;gap:var(--sp-3)">
      <div class="panel-head">
        <h2>פריטי התפריט</h2>
        <button class="btn btn--primary" id="addItemBtn" type="button" style="flex:0 0 auto">➕ פריט חדש</button>
      </div>
      <div class="menu-admin-list" id="menuList"></div>
    </div>
  </section>

  <!-- History panel -->
  <section id="panel-history" role="tabpanel" aria-labelledby="tab-history" hidden>
    <div style="display:grid;gap:var(--sp-3)">
      <div class="panel-head"><h2>הזמנות שהוגשו (50 אחרונות)</h2></div>
      <div class="history-list" id="historyList"></div>
    </div>
  </section>
</main>

<!-- Item dialog -->
<dialog id="itemDialog" aria-labelledby="itemDialogTitle">
  <form id="itemForm" method="dialog" novalidate>
    <div class="dialog__header">
      <h2 class="dialog__title" id="itemDialogTitle">פריט חדש</h2>
      <button class="dialog__close" type="button" id="itemDialogClose" aria-label="סגור">✕</button>
    </div>
    <div class="dialog__body">
      <div class="field" id="fName">
        <label class="field__label" for="inpName">שם המנה <span class="req" aria-hidden="true">*</span></label>
        <input class="field__input" id="inpName" name="name" type="text" required maxlength="80" autocomplete="off">
        <span class="field__msg" id="msgName" aria-live="polite"></span>
      </div>
      <div class="field-grid">
        <div class="field" id="fPrice">
          <label class="field__label" for="inpPrice">מחיר (₪) <span class="req" aria-hidden="true">*</span></label>
          <input class="field__input" id="inpPrice" name="price" type="number" min="0" step="0.5" required inputmode="decimal">
          <span class="field__msg" id="msgPrice" aria-live="polite"></span>
        </div>
        <div class="field" id="fCategory">
          <label class="field__label" for="inpCategory">קטגוריה <span class="req" aria-hidden="true">*</span></label>
          <input class="field__input" id="inpCategory" name="category" type="text" required maxlength="40" list="catOptions" autocomplete="off">
          <datalist id="catOptions"></datalist>
          <span class="field__msg" id="msgCategory" aria-live="polite"></span>
        </div>
      </div>
      <div class="field">
        <label class="field__label" for="inpDesc">תיאור</label>
        <textarea class="field__input" id="inpDesc" name="description" rows="2" maxlength="200"></textarea>
        <span class="field__msg"></span>
      </div>
    </div>
    <div class="dialog__footer">
      <button class="btn btn--ghost" type="button" id="itemCancelBtn">ביטול</button>
      <button class="btn btn--primary" type="submit" id="itemSaveBtn" style="flex:0 0 auto">שמירה</button>
    </div>
  </form>
</dialog>

<!-- Confirm dialog -->
<dialog id="confirmDialog" aria-labelledby="confirmTitle">
  <div class="dialog__header">
    <h2 class="dialog__title" id="confirmTitle">אישור פעולה</h2>
    <button class="dialog__close" type="button" id="confirmClose" aria-label="סגור">✕</button>
  </div>
  <div class="dialog__body"><p id="confirmText"></p></div>
  <div class="dialog__footer">
    <button class="btn btn--ghost" type="button" id="confirmCancelBtn">ביטול</button>
    <button class="btn btn--primary" type="button" id="confirmOkBtn" style="flex:0 0 auto">אישור</button>
  </div>
</dialog>

<div class="toast-region" id="toastRegion" role="status" aria-live="polite"></div>

<script>
'use strict';
(function () {
  const $ = id => document.getElementById(id);
  const fmt = n => '₪' + (Math.round(n * 100) / 100).toLocaleString('he-IL');
  const POLL_MS = 4000;

  /* ─── Theme ─── */
  const themeBtn = $('themeToggle');
  function applyTheme(mode) {
    document.documentElement.dataset.theme = mode;
    themeBtn.textContent = mode === 'dark' ? '☀️' : '🌙';
    themeBtn.setAttribute('aria-pressed', String(mode === 'dark'));
    localStorage.setItem('theme', mode);
  }
  applyTheme(localStorage.getItem('theme') ||
    (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  themeBtn.addEventListener('click', () =>
    applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));

  /* ─── Toast ─── */
  function toast(msg, type) {
    const el = document.createElement('div');
    el.className = 'toast' + (type ? ' toast--' + type : '');
    el.textContent = msg;
    $('toastRegion').appendChild(el);
    setTimeout(() => {
      el.classList.add('is-leaving');
      el.addEventListener('animationend', () => el.remove(), { once: true });
    }, 2600);
  }

  /* ─── Tabs ─── */
  const tabs = ['orders', 'menu', 'history'];
  tabs.forEach(name => {
    $('tab-' + name).addEventListener('click', () => selectTab(name));
  });
  function selectTab(name) {
    tabs.forEach(t => {
      $('tab-' + t).setAttribute('aria-selected', String(t === name));
      $('panel-' + t).hidden = t !== name;
    });
    if (name === 'menu') loadMenu();
    if (name === 'history') loadHistory();
  }

  /* ─── Stats ─── */
  async function loadStats() {
    try {
      const s = await (await fetch('/api/stats')).json();
      $('statNew').textContent = s.new;
      $('statPreparing').textContent = s.preparing;
      $('statReady').textContent = s.ready;
      $('statTables').textContent = s.active_tables;
    } catch { /* transient */ }
  }

  /* ─── Orders ─── */
  const STATUS_LABEL = { new: 'חדשה', seen: 'התקבלה', preparing: 'בהכנה', ready: 'מוכנה' };
  const NEXT_ACTION = {
    new:       { status: 'seen',      label: '👀 אישור קבלה' },
    seen:      { status: 'preparing', label: '👨‍🍳 התחלת הכנה' },
    preparing: { status: 'ready',     label: '🛎️ מוכנה להגשה' },
    ready:     { status: 'served',    label: '✅ הוגשה' },
  };
  let lastOrderIds = new Set();
  let firstOrdersLoad = true;

  function elapsed(createdAt) {
    // SQLite datetime('now') is UTC
    const then = new Date(createdAt.replace(' ', 'T') + 'Z');
    const mins = Math.max(0, Math.floor((Date.now() - then) / 60000));
    if (mins < 1) return 'עכשיו';
    if (mins < 60) return 'לפני ' + mins + ' דק׳';
    return 'לפני ' + Math.floor(mins / 60) + ':' + String(mins % 60).padStart(2, '0') + ' שע׳';
  }

  async function loadOrders() {
    let orders;
    try {
      orders = await (await fetch('/api/orders')).json();
    } catch { return; }

    // Notify on brand-new orders (skip first load)
    const ids = new Set(orders.map(o => o.id));
    if (!firstOrdersLoad) {
      orders.forEach(o => {
        if (!lastOrderIds.has(o.id)) toast('🔔 הזמנה חדשה משולחן ' + o.table_number, 'success');
      });
    }
    lastOrderIds = ids;
    firstOrdersLoad = false;

    const n = orders.length;
    $('ordersCount').hidden = n === 0;
    $('ordersCount').textContent = n;

    const grid = $('ordersGrid');
    grid.innerHTML = '';
    if (!n) {
      grid.innerHTML = '<div class="empty-state"><span class="empty-state__icon">🌤️</span>' +
        '<p><strong>אין הזמנות פעילות</strong></p><p>הזמנות חדשות יופיעו כאן אוטומטית</p></div>';
      return;
    }
    orders.forEach(o => grid.appendChild(orderCard(o)));
  }

  function orderCard(o) {
    const card = document.createElement('article');
    card.className = 'order-card order-card--' + o.status;
    card.setAttribute('aria-label', 'הזמנה ' + o.id + ' משולחן ' + o.table_number);

    const head = document.createElement('div');
    head.className = 'order-card__head';
    head.innerHTML =
      '<div><div class="order-card__table">שולחן ' + o.table_number + '</div>' +
      '<div class="order-card__meta">#' + o.id + ' · ' + elapsed(o.created_at) + '</div></div>' +
      '<span class="status-pill status-pill--' + o.status + '">' + (STATUS_LABEL[o.status] || o.status) + '</span>';
    card.appendChild(head);

    const items = document.createElement('div');
    items.className = 'order-card__items';
    o.items.forEach(it => {
      const line = document.createElement('div');
      line.className = 'order-line';
      const qty = document.createElement('span');
      qty.className = 'order-line__qty';
      qty.textContent = '×' + it.quantity;
      const name = document.createElement('span');
      name.className = 'order-line__name';
      name.textContent = it.name;
      if (it.special_request) {
        const req = document.createElement('span');
        req.className = 'order-line__req';
        req.textContent = '⚠️ ' + it.special_request;
        name.appendChild(req);
      }
      line.append(qty, name);
      items.appendChild(line);
    });
    card.appendChild(items);

    if (o.notes) {
      const notes = document.createElement('div');
      notes.className = 'order-card__notes';
      notes.textContent = '📝 ' + o.notes;
      card.appendChild(notes);
    }

    const actions = document.createElement('div');
    actions.className = 'order-card__actions';
    const next = NEXT_ACTION[o.status];
    if (next) {
      const advance = document.createElement('button');
      advance.className = 'btn btn--primary';
      advance.type = 'button';
      advance.textContent = next.label;
      advance.addEventListener('click', () => updateStatus(o.id, next.status, advance));
      actions.appendChild(advance);
    }
    const cancel = document.createElement('button');
    cancel.className = 'btn btn--danger-ghost btn--sm';
    cancel.type = 'button';
    cancel.textContent = 'ביטול';
    cancel.setAttribute('aria-label', 'בטל הזמנה ' + o.id);
    cancel.addEventListener('click', () => {
      confirmAction('לבטל את הזמנה #' + o.id + ' משולחן ' + o.table_number + '?',
        () => updateStatus(o.id, 'cancelled'));
    });
    actions.appendChild(cancel);
    card.appendChild(actions);

    return card;
  }

  async function updateStatus(orderId, status, btn) {
    if (btn) btn.disabled = true;
    try {
      const res = await fetch('/api/orders/' + orderId + '/status', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status }),
      });
      if (!res.ok) throw new Error();
      await Promise.all([loadOrders(), loadStats()]);
      if (status === 'served') toast('הזמנה #' + orderId + ' הוגשה ✅', 'success');
      if (status === 'cancelled') toast('הזמנה #' + orderId + ' בוטלה');
    } catch {
      toast('עדכון הסטטוס נכשל — נסו שוב', 'error');
      if (btn) btn.disabled = false;
    }
  }

  /* ─── Menu admin ─── */
  let menuItems = [];
  async function loadMenu() {
    try {
      menuItems = await (await fetch('/api/menu/all')).json();
    } catch {
      toast('טעינת התפריט נכשלה', 'error');
      return;
    }
    // Datalist of existing categories
    $('catOptions').innerHTML = '';
    [...new Set(menuItems.map(m => m.category))].forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      $('catOptions').appendChild(opt);
    });

    const list = $('menuList');
    list.innerHTML = '';
    if (!menuItems.length) {
      list.innerHTML = '<div class="empty-state"><span class="empty-state__icon">🍽️</span>' +
        '<p><strong>התפריט ריק</strong></p><p>הוסיפו את הפריט הראשון</p></div>';
      return;
    }
    const byCat = {};
    menuItems.forEach(m => (byCat[m.category] = byCat[m.category] || []).push(m));
    Object.keys(byCat).forEach(cat => {
      const section = document.createElement('section');
      section.className = 'menu-cat';
      const h = document.createElement('h3');
      h.textContent = cat;
      section.appendChild(h);
      const rows = document.createElement('div');
      rows.className = 'menu-rows';
      byCat[cat].forEach(m => rows.appendChild(menuRow(m)));
      section.appendChild(rows);
      list.appendChild(section);
    });
  }

  function menuRow(m) {
    const row = document.createElement('div');
    row.className = 'menu-row' + (m.available ? '' : ' menu-row--off');

    const sw = document.createElement('button');
    sw.className = 'switch';
    sw.type = 'button';
    sw.setAttribute('role', 'switch');
    sw.setAttribute('aria-checked', String(!!m.available));
    sw.setAttribute('aria-label', (m.available ? 'הסתר' : 'הצג') + ' את ' + m.name + ' בתפריט');
    sw.innerHTML = '<span class="switch__knob"></span>';
    sw.addEventListener('click', async () => {
      try {
        const res = await fetch('/api/menu/' + m.id + '/available', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ available: !m.available }),
        });
        if (!res.ok) throw new Error();
        loadMenu();
        toast(m.name + (m.available ? ' הוסתר מהתפריט' : ' הוחזר לתפריט'), 'success');
      } catch { toast('הפעולה נכשלה', 'error'); }
    });

    const info = document.createElement('div');
    info.className = 'menu-row__info';
    const name = document.createElement('div');
    name.className = 'menu-row__name';
    name.textContent = m.name;
    const desc = document.createElement('div');
    desc.className = 'menu-row__desc';
    desc.textContent = m.description || '';
    info.append(name, desc);

    const price = document.createElement('span');
    price.className = 'menu-row__price';
    price.textContent = fmt(m.price);

    const actions = document.createElement('div');
    actions.className = 'menu-row__actions';
    const edit = document.createElement('button');
    edit.className = 'btn btn--ghost btn--icon';
    edit.type = 'button';
    edit.textContent = '✏️';
    edit.setAttribute('aria-label', 'עריכת ' + m.name);
    edit.addEventListener('click', () => openItemDialog(m));
    const del = document.createElement('button');
    del.className = 'btn btn--danger-ghost btn--icon';
    del.type = 'button';
    del.textContent = '🗑️';
    del.setAttribute('aria-label', 'מחיקת ' + m.name);
    del.addEventListener('click', () => {
      confirmAction('למחוק את "' + m.name + '" מהתפריט לצמיתות?', async () => {
        try {
          const res = await fetch('/api/menu/' + m.id, { method: 'DELETE' });
          if (!res.ok) throw new Error();
          loadMenu();
          toast(m.name + ' נמחק', 'success');
        } catch { toast('המחיקה נכשלה', 'error'); }
      });
    });
    actions.append(edit, del);

    row.append(sw, info, price, actions);
    return row;
  }

  /* ─── Item dialog with real-time validation ─── */
  const itemDialog = $('itemDialog');
  let editingId = null;

  const validators = {
    Name:     v => v.trim() ? '' : 'נדרש שם למנה',
    Price:    v => (v !== '' && parseFloat(v) >= 0) ? '' : 'נדרש מחיר תקין (0 ומעלה)',
    Category: v => v.trim() ? '' : 'נדרשת קטגוריה',
  };
  function validateField(key, showSuccess) {
    const input = $('inp' + key);
    const field = $('f' + key);
    const msg = $('msg' + key);
    const err = validators[key](input.value);
    field.classList.toggle('is-error', !!err);
    field.classList.toggle('is-success', !err && !!showSuccess);
    msg.textContent = err || (showSuccess ? '✓ נראה טוב' : '');
    input.setAttribute('aria-invalid', String(!!err));
    return !err;
  }
  ['Name', 'Price', 'Category'].forEach(key => {
    $('inp' + key).addEventListener('input', () => validateField(key, true));
  });

  function openItemDialog(item) {
    editingId = item ? item.id : null;
    $('itemDialogTitle').textContent = item ? 'עריכת פריט' : 'פריט חדש';
    $('inpName').value = item ? item.name : '';
    $('inpPrice').value = item ? item.price : '';
    $('inpCategory').value = item ? item.category : '';
    $('inpDesc').value = item ? (item.description || '') : '';
    ['Name', 'Price', 'Category'].forEach(key => {
      $('f' + key).classList.remove('is-error', 'is-success');
      $('msg' + key).textContent = '';
    });
    itemDialog.showModal();
    $('inpName').focus();
  }
  $('addItemBtn').addEventListener('click', () => openItemDialog(null));
  $('itemDialogClose').addEventListener('click', () => itemDialog.close());
  $('itemCancelBtn').addEventListener('click', () => itemDialog.close());

  $('itemForm').addEventListener('submit', async e => {
    e.preventDefault();
    const ok = ['Name', 'Price', 'Category'].map(k => validateField(k)).every(Boolean);
    if (!ok) { $('inpName').focus(); return; }
    const body = {
      name: $('inpName').value.trim(),
      price: parseFloat($('inpPrice').value),
      category: $('inpCategory').value.trim(),
      description: $('inpDesc').value.trim(),
    };
    const saveBtn = $('itemSaveBtn');
    saveBtn.disabled = true;
    try {
      const res = await fetch(editingId ? '/api/menu/' + editingId : '/api/menu', {
        method: editingId ? 'PUT' : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (!res.ok) throw new Error();
      itemDialog.close();
      loadMenu();
      toast(editingId ? 'הפריט עודכן ✓' : 'הפריט נוסף לתפריט ✓', 'success');
    } catch {
      toast('השמירה נכשלה — נסו שוב', 'error');
    } finally {
      saveBtn.disabled = false;
    }
  });

  /* ─── Confirm dialog ─── */
  const confirmDialog = $('confirmDialog');
  let confirmCb = null;
  function confirmAction(text, cb) {
    $('confirmText').textContent = text;
    confirmCb = cb;
    confirmDialog.showModal();
    $('confirmOkBtn').focus();
  }
  $('confirmOkBtn').addEventListener('click', () => { confirmDialog.close(); if (confirmCb) confirmCb(); });
  $('confirmCancelBtn').addEventListener('click', () => confirmDialog.close());
  $('confirmClose').addEventListener('click', () => confirmDialog.close());

  /* ─── History ─── */
  async function loadHistory() {
    let rows;
    try {
      rows = await (await fetch('/api/orders/history')).json();
    } catch { return; }
    const list = $('historyList');
    list.innerHTML = '';
    if (!rows.length) {
      list.innerHTML = '<div class="empty-state"><span class="empty-state__icon">📭</span><p>עוד לא הוגשו הזמנות היום</p></div>';
      return;
    }
    rows.forEach(r => {
      const row = document.createElement('div');
      row.className = 'history-row';
      const time = new Date(r.updated_at.replace(' ', 'T') + 'Z')
        .toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
      row.innerHTML =
        '<span class="history-row__id">#' + r.id + '</span>' +
        '<span class="history-row__table">שולחן ' + r.table_number + '</span>' +
        '<span class="history-row__items"></span>' +
        '<span class="history-row__time">' + time + '</span>';
      row.querySelector('.history-row__items').textContent = r.items_summary || '';
      list.appendChild(row);
    });
  }

  /* ─── Polling ─── */
  loadStats();
  loadOrders();
  setInterval(() => {
    loadStats();
    if (!$('panel-orders').hidden) loadOrders();
  }, POLL_MS);
})();
</script>
</body>
</html>
