<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>יומן ביצוע הדברה – יצחק אחזקות והדברות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --forest:#1f5236;--forest-2:#2c6b47;--leaf:#3f9d5a;--mint:#e3f1e7;--mint-2:#f1f8f3;
  --gold:#b39c6a;--gold-soft:#f3ecdc;
  --bg:#f4f7f4;--surface:#fff;--ink:#15271c;--muted:#5d6f63;--line:#d5e3d9;--danger:#c8433a;--danger-soft:#fbe9e7;
  --r-lg:20px;--r-md:14px;--r-sm:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1712;--surface:#16231b;--ink:#e7efe9;--muted:#9fb3a6;--line:#2a3d31;--mint:#1e3326;--mint-2:#18291f;--gold-soft:#2c2718;--danger-soft:#3a1d1a}}
:root[data-theme="dark"]{--bg:#0e1712;--surface:#16231b;--ink:#e7efe9;--muted:#9fb3a6;--line:#2a3d31;--mint:#1e3326;--mint-2:#18291f;--gold-soft:#2c2718;--danger-soft:#3a1d1a}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Rubik,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:600px;margin:0 auto;min-height:100vh;padding-bottom:110px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.hero{background:var(--forest);color:#fff;padding:22px 20px 64px;border-radius:0 0 32px 32px}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:48px;height:48px;border-radius:14px;background:var(--gold);color:var(--forest);display:grid;place-items:center;font-weight:800;font-size:26px;flex:none}
.bname{font-weight:700;font-size:18px;line-height:1.2}
.bsub{font-size:13px;color:#cfe3d5}
.sync{font-size:12px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.14);white-space:nowrap}
.hello{margin:22px 0 0;font-size:23px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px;margin-top:-40px}
.tile{border:0;background:var(--surface);border-radius:var(--r-lg);box-shadow:0 6px 18px rgba(20,50,30,.12);padding:18px 14px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;cursor:pointer;position:relative;color:var(--leaf);text-align:right;min-height:104px}
.tile b{color:var(--ink);font-size:16px}
.tile small{color:var(--muted);font-size:12px}
.tile.primary{background:var(--gold);color:var(--forest)}.tile.primary b,.tile.primary small{color:var(--forest)}
.badge{position:absolute;top:10px;left:10px;background:var(--danger);color:#fff;min-width:22px;height:22px;border-radius:11px;font-size:12px;display:grid;place-items:center;padding:0 6px}
.block{padding:22px 16px 0}
.block h2{font-size:17px;margin:0 0 10px}

.top{position:sticky;top:0;z-index:20;background:var(--forest);color:#fff;padding:10px 12px}
.toprow{display:flex;align-items:center;gap:8px;min-height:40px}
.top h1{flex:1;margin:0;font-size:18px;font-weight:700;text-align:center}
.top .sub{text-align:center;font-size:13px;color:#cfe3d5;margin-top:-2px}
.iconbtn{width:42px;height:42px;border-radius:50%;border:0;background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.progress{height:4px;background:rgba(255,255,255,.2);border-radius:2px;margin-top:8px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--gold);transition:width .3s}
.stepper{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line);scrollbar-width:none}
.stepper::-webkit-scrollbar{display:none}
.st{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px 6px 8px;font-size:13px;display:flex;gap:6px;align-items:center;cursor:pointer;color:var(--muted)}
.st b{width:22px;height:22px;border-radius:50%;background:var(--mint);color:var(--forest-2);display:grid;place-items:center;font-size:12px}
.st.on{border-color:var(--forest-2);color:var(--ink);font-weight:600}.st.on b{background:var(--forest-2);color:#fff}
.st.bad b{background:var(--danger);color:#fff}
.page{padding:16px}

.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:14px;overflow:hidden}
.sech{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;background:var(--mint-2);border-bottom:1px solid var(--line)}
.sech h3{margin:0;font-size:16px}
.secb{padding:2px 14px 14px}
details.sec>summary{list-style:none;cursor:pointer}
details.sec>summary::-webkit-details-marker{display:none}
.field{display:block;margin-top:12px}
.field>span,.flabel{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
.req::after{content:" *";color:var(--danger)}
.opt{font-size:12px;color:var(--muted);font-weight:400}
.inp,.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:var(--r-sm);padding:11px 12px;min-height:46px}
textarea{min-height:96px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err .inp,.err input,.err select,.err textarea,input.err,textarea.err,select.err{border-color:var(--danger)!important;background:var(--danger-soft)!important}
.errtxt{color:var(--danger);font-size:13px;margin-top:4px}
.flash{animation:flash 1.4s ease}
@keyframes flash{0%,60%{box-shadow:0 0 0 4px var(--gold)}100%{box-shadow:0 0 0 0 transparent}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;font-size:14px;cursor:pointer;min-height:40px}
.chip.on{background:var(--forest-2);border-color:var(--forest-2);color:#fff}
.chips.err .chip{border-color:var(--danger)}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.seg button{flex:1;border:0;background:var(--surface);padding:11px 4px;font-size:15px;cursor:pointer;min-height:46px}
.seg button+button{border-right:1px solid var(--line)}
.seg button.on{background:var(--forest-2);color:#fff}
.seg.err{border-color:var(--danger)}
.bigseg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bigseg button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:14px 6px;cursor:pointer;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--leaf)}
.bigseg button span{color:var(--ink);font-size:14px}
.bigseg button.on{border-color:var(--forest-2);background:var(--mint);box-shadow:inset 0 0 0 1px var(--forest-2)}
.bigseg.err button{border-color:var(--danger)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.toggle span{font-weight:500}
.sw{width:52px;height:30px;border-radius:15px;background:var(--line);border:0;position:relative;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:right .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw[aria-checked="true"]{background:var(--leaf)}.sw[aria-checked="true"]::after{right:25px}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;cursor:pointer}
.check input{width:24px;height:24px;accent-color:var(--forest-2);flex:none;margin:0}
.check.err{color:var(--danger)}
.item{border:1px solid var(--line);border-radius:var(--r-md);padding:4px 12px 14px;margin-top:12px}
.itemh{display:flex;justify-content:space-between;align-items:center;padding-top:8px;gap:8px}
.itemh strong{font-size:15px}
.btn{border:0;border-radius:var(--r-md);padding:13px 18px;font-weight:600;cursor:pointer;background:var(--forest-2);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;text-decoration:none}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.gold{background:var(--gold);color:var(--forest)}
.btn.sm{padding:8px 12px;font-size:14px;min-height:40px;border-radius:var(--r-sm)}
.btn.w{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{border:0;background:transparent;color:var(--forest-2);font-weight:600;cursor:pointer;padding:6px 4px;font-size:14px}
:root[data-theme="dark"] .link{color:var(--leaf)}
.del{border:0;background:transparent;color:var(--danger);font-size:14px;cursor:pointer;padding:8px}
.hint{font-size:13px;color:var(--muted);margin:8px 0 0}
.note{background:var(--gold-soft);border-radius:var(--r-md);padding:10px 12px;font-size:14px;margin-top:12px}
ul.ul{margin:6px 0 0;padding-inline-start:20px;font-size:13.5px;color:var(--muted);line-height:1.8}
/* ---- מסך הבית: כפתורים עגולים ---- */
.newj{margin:-40px 16px 0;width:calc(100% - 32px);border:0;border-radius:var(--r-lg);background:var(--forest);color:#fff;box-shadow:0 10px 24px rgba(20,50,30,.22);padding:16px;display:flex;align-items:center;gap:12px;cursor:pointer;text-align:right}
.newj b{display:block;font-size:17px}
.newj small{opacity:.85;font-size:13px}
.dial{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 6px;padding:18px 12px 0}
@media(max-width:360px){.dial{grid-template-columns:repeat(3,1fr)}}
.dbtn{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;color:var(--leaf);padding:0}
.dcirc{width:58px;height:58px;border-radius:50%;background:var(--surface);box-shadow:0 5px 14px rgba(20,50,30,.13);display:grid;place-items:center;color:var(--forest-2);position:relative}
:root[data-theme="dark"] .dcirc{color:var(--leaf)}
.dbtn b{font-size:13px;font-weight:600;line-height:1.2;text-align:center}
.dbtn small{font-size:11px;color:var(--muted);line-height:1.2;text-align:center}
.dcirc .badge{position:absolute;top:-2px;inset-inline-end:-2px}
/* ---- מסלול עבודה ---- */
.rnav{display:flex;align-items:center;gap:8px}
.rhead{display:flex;align-items:center;gap:8px}
.rhead h3{flex:1;margin:0}
.grip{border:0;background:transparent;color:var(--muted);cursor:grab;touch-action:none;padding:2px;display:grid;place-items:center;flex:none}
.rstop.dragging{opacity:.75;box-shadow:0 10px 26px rgba(20,50,30,.28)}
.rmeta{display:flex;flex-wrap:wrap;gap:10px;font-size:13.5px;color:var(--muted)}
.rmeta span{display:inline-flex;align-items:center;gap:4px}
.racts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.rstop.st-3{opacity:.72}
.rstop.st-4{opacity:.6}
/* ---- משימות ולוח שנה ---- */
.doneRow h4{text-decoration:line-through;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.cdow{text-align:center;font-size:11px;color:var(--muted)}
.cday{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:inherit;padding:2px}
.cday b{font-size:13px;font-weight:600}
.cday i{display:flex;gap:2px;min-height:6px}
.cday.today{border-color:var(--gold)}
.cday.on{background:var(--gold-soft);border-color:var(--gold)}
em.dj,em.ds,em.dt{width:5px;height:5px;border-radius:50%;display:inline-block}
em.dj{background:var(--forest-2)}em.ds{background:var(--gold)}em.dt{background:#c2410c}
.dbtag{display:inline-block;font-size:12px;background:var(--gold-soft);color:#7a6634;border-radius:6px;padding:2px 8px;margin-top:6px}
.footer{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:30}
.footer .in{max-width:568px;margin:0 auto;display:flex;gap:10px}.footer .btn{flex:1}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;margin-bottom:10px;display:flex;gap:10px;align-items:center;cursor:pointer;width:100%;text-align:right}
.card .main{flex:1;min-width:0}
.card h4{margin:0;font-size:16px}
.card p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.acts{display:flex;gap:8px;flex:none}
.round{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--forest-2);display:grid;place-items:center;cursor:pointer;flex:none;text-decoration:none}
:root[data-theme="dark"] .round{color:var(--leaf)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--mint);color:var(--forest-2);font-weight:600}
.tag.draft{background:var(--gold-soft);color:#7a6634}
.tag.gold{background:var(--gold);color:var(--forest)}
.empty{text-align:center;padding:36px 20px;color:var(--muted)}
.filters{display:grid;gap:8px;margin-bottom:12px}

/* טעינה מיומן אחרון */
.prevcard{background:var(--surface);border:2px solid var(--gold);border-radius:var(--r-lg);padding:14px;margin:14px 0}
.prevcard .ph{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.prevcard .ph b{font-size:16px;color:var(--forest-2)}
:root[data-theme="dark"] .prevcard .ph b{color:var(--leaf)}
.pkv{display:grid;gap:2px;margin-top:10px;font-size:14px}
.pkv div{display:flex;gap:6px;padding:3px 0;border-bottom:1px dotted var(--line)}
.pkv div:last-child{border-bottom:0}
.pkv b{color:var(--muted);font-weight:500;flex:none}
.pkv span{min-width:0;overflow-wrap:anywhere}
.pflags{background:var(--gold-soft);border-radius:var(--r-md);padding:8px 12px;margin-top:10px;font-size:14px;color:#7a6634}
.pflags ul{margin:4px 18px 0 0;padding:0}
.clonebar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--gold-soft);color:#7a6634;padding:8px 14px;font-size:13px;flex-wrap:wrap}
.clonebar.done{background:var(--mint);color:var(--forest-2)}
.clonestale{background:var(--danger-soft);color:var(--danger);padding:8px 14px;font-size:13px}
.vwarn{background:var(--gold-soft);border:1px solid var(--gold);border-radius:var(--r-md);padding:10px 12px;margin-top:8px;font-size:14px;color:#7a6634}
.vwarn b{display:block;margin-bottom:2px}
.vwarn p{margin:0 0 8px;font-size:13px}
.vok{background:var(--mint);color:var(--forest-2);border-radius:var(--r-md);padding:7px 12px;margin-top:8px;font-size:13px}
.vfield.vpend input,.vfield.vpend textarea,.vfield.vpend select{border-color:var(--gold);background:var(--gold-soft)}
.vbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:10px 0 6px}
.vbar i{display:block;height:100%;background:var(--leaf);transition:width .3s}
.cmp{width:100%;border-collapse:collapse;font-size:13px}
.cmp th{background:var(--mint-2);text-align:right;padding:6px;border:1px solid var(--line);font-weight:600}
.cmp td{padding:6px;border:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
.cmp tr.changed td,.cmp tr.new td,.cmp tr.removed td{background:var(--gold-soft)}
.cmp tr.hot td{box-shadow:inset 2px 0 0 var(--danger)}

/* מאגר תכשירים ותבניות */
.pgrid{display:grid;gap:10px;margin-top:12px}
.pcard{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:right;border:1px solid var(--line);
  background:var(--surface);border-radius:var(--r-lg);padding:14px;cursor:pointer;transition:transform .12s,box-shadow .12s}
.pcard:active{transform:scale(.985)}
.pcard.ok{border-color:var(--leaf)}
.pcard.choice{border-color:var(--gold)}
.pcard.blocked{background:var(--bg);border-color:var(--line);opacity:.72;cursor:not-allowed}
.picon{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--mint);color:var(--forest-2)}
.pcard.choice .picon{background:var(--gold-soft);color:#7a6634}
.pcard.blocked .picon{background:var(--line);color:var(--muted)}
.pmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pmain b{font-size:16px}
.pmain small{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.pok{color:var(--forest-2)}
:root[data-theme="dark"] .pok{color:var(--leaf)}
.pblock{color:var(--danger)}
.preview{color:#7a6634;font-weight:600}
/* תגי מידע: כתום למידע חלקי, אדום לאזהרת תוקף. אף אחד אינו משבית לחיצה */
.pinfo{color:#7a6634;font-weight:600}
:root[data-theme="dark"] .pinfo{color:var(--gold)}
.pwarn{color:var(--danger);font-weight:600}
.mtags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0}
.mtag{display:inline-block;background:var(--gold-soft);color:#7a6634;border-radius:6px;
  padding:2px 8px;font-size:11.5px;font-weight:600}
.mwarn{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--danger);
  font-weight:600;margin:6px 0 0}
.lmini{margin:8px 0 0;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.selchip.info{border-color:var(--gold)}
.sugitem.info .sicon{background:var(--gold-soft);color:#7a6634}
.pcard.info{border-color:var(--gold)}
.pcard.info .picon{background:var(--gold-soft);color:#7a6634}
.tcard.info{border-color:var(--gold)}
.tcard.info .ticon{background:var(--gold-soft);color:#7a6634}
.tcard.info .tstate{color:#7a6634}
/* הסקשן לא יחתוך את רשימת ההצעות */
.sec.openflow{overflow:visible}
.msearch{position:relative}
.minp{width:100%;border:2px solid var(--line);background:var(--surface);border-radius:999px;
  padding:14px 20px;min-height:54px;font-size:16px}
.minp:focus{border-color:var(--forest-2);outline:none}
.sugbox{position:absolute;top:calc(100% + 6px);right:0;left:0;z-index:45;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-md);box-shadow:0 10px 30px rgba(0,0,0,.18);
  overflow:hidden;animation:sugIn .16s ease}
@keyframes sugIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.sugbox ul{list-style:none;margin:0;padding:0;max-height:52vh;overflow:auto}
.sugbox.empty{padding:14px;text-align:center}
.sugbox.empty p{margin:0 0 10px;font-size:14px;color:var(--muted)}
.sugitem{display:flex;gap:10px;align-items:flex-start;padding:12px;border-bottom:1px solid var(--line);
  cursor:pointer;transition:transform .1s,background .1s}
.sugitem:last-child{border-bottom:0}
.sugitem:active{transform:scale(.98)}
.sugitem.active,.sugitem:hover{background:var(--mint-2)}
.sugitem.blocked{opacity:.66;cursor:not-allowed;background:var(--bg)}
.sugitem.blocked:hover{background:var(--bg)}
.sicon{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:var(--mint);color:var(--forest-2)}
.sugitem.blocked .sicon{background:var(--line);color:var(--muted)}
.smain{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.smain b{font-size:15.5px}
.smain small{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
mark.hl{background:transparent;color:var(--leaf);font-weight:800}
.sugmore{margin:0;padding:8px 12px;font-size:12.5px;color:var(--muted);background:var(--mint-2)}
.sugerr{margin:0;padding:8px 12px;font-size:13px;color:var(--danger);background:var(--danger-soft)}
.sugbox.busy{padding:14px;text-align:center;color:var(--muted);font-size:14px}
.sugrow{list-style:none}
.sugitem{width:100%;text-align:right;border:0;border-bottom:1px solid var(--line);background:transparent;font:inherit;color:inherit}
.sugitem:disabled{cursor:not-allowed}
.selchip .ok{color:var(--leaf)}
.selchip{display:flex;gap:10px;align-items:center;border:2px solid var(--leaf);background:var(--surface);
  border-radius:var(--r-lg);padding:12px 14px}

function parseGeo(t){
  t=String(t||'').trim();if(!t)return null;
  let m=t.match(/[?&]q=(-?\d{1,3}\.\d+)[,\s]+(-?\d{1,3}\.\d+)/)||t.match(/[@\/](-?\d{1,3}\.\d+),(-?\d{1,3}\.\d+)/)||t.match(/ll=(-?\d{1,3}\.\d+),(-?\d{1,3}\.\d+)/)||t.match(/^\s*(-?\d{1,3}\.\d+)\s*[,\s]\s*(-?\d{1,3}\.\d+)\s*$/);
  if(!m)return null;const lat=+m[1],lng=+m[2];
  if(Math.abs(lat)>90||Math.abs(lng)>180)return null;
  return {lat,lng,acc:0,at:Date.now(),manual:true};
}

function validate(j){
  const E=[];const add=(g,path,msg,step)=>E.push({g,step:step==null?GROUPS[g].step:step,path,msg});
  const req=(g,path,msg)=>{if(blankStr(getP(j,path)))add(g,path,msg)};
  // 0 tech (+ date/time, operator when exists)
  req(0,'date','תאריך ביצוע ההדברה');req(0,'time','שעת ביצוע ההדברה');
  [['name','שם מלא של המדביר'],['license','מספר רישיון'],['phone','טלפון נייד'],['email','דוא"ל'],['address','כתובת'],['licenseType','סוג רישיון']].forEach(([k,m])=>req(0,'tech.'+k,m));
  if(j.hasOperator)[['name','שם המפעיל'],['phone','טלפון המפעיל'],['email','דוא"ל המפעיל'],['address','כתובת המפעיל']].forEach(([k,m])=>req(0,'operator.'+k,m));
  // 1 client
  req(1,'client.name','שם מלא של המזמין');req(1,'client.role','תפקיד המזמין');
  if(j.client.role==='אחר')req(1,'client.roleOther','פירוט תפקיד המזמין');
  req(1,'client.phone','טלפון המזמין');
  // 2 place
  const p=j.place;
  if(!p.kind)add(2,'place.kind','בחירת סוג מקום ההדברה');
  else if(p.kind==='home'){req(2,'place.city','עיר');req(2,'place.street','רחוב');req(2,'place.houseNo','מספר בית');req(2,'place.aptNo','מספר דירה')}
  else if(p.kind==='building'){req(2,'place.buildingType','סוג המבנה');if(p.buildingType==='מבנה אחר')req(2,'place.buildingTypeOther','פירוט סוג המבנה');req(2,'place.city','עיר');req(2,'place.street','רחוב');req(2,'place.houseApt','מספר בית/דירה')}
  else if(p.kind==='open'){req(2,'place.authority','שם הרשות המקומית');req(2,'place.siteType','שם/סוג האתר');if(p.siteType==='אחר')req(2,'place.siteTypeOther','פירוט האתר');req(2,'place.siteDesc','תיאור האתר');req(2,'place.coords','נ"צ')}
  // 3 findings
  if(!j.findings.length)add(3,'findings','יש להוסיף לפחות מזיק אחד');
  j.findings.forEach((f,i)=>{const n=`מזיק ${i+1}: `;
    req(3,`findings.${i}.pest`,n+'שם המזיק');
    const ax=annexFor(f.pest);if(ax)req(3,`findings.${i}.subtype`,n+ax.label);
    req(3,`findings.${i}.identification`,n+'פעולות הזיהוי שבוצעו');
    req(3,`findings.${i}.signs`,n+'סימני הנגיעות');
    req(3,`findings.${i}.location`,n+'מיקום הנגיעות');
    req(3,`findings.${i}.level`,n+'רמת הנגיעות');});
  // 4 prevention
  req(4,'prevention','פעולות מניעה ו/או טיפול שבוצעו או הומלצו');
  req(4,'circumstances','הנסיבות שבהן הוחלט לנקוט בהדברה');
  // 5 warn before
  /* האזהרות מגיעות מהתווית כשהיא במערכת, ואחרת מהשדות שהמדביר מילא
     ליד החומר עצמו. בשני המקרים אין צורך בשדות האזהרה הכלליים. */
  const labelWarn=j.apps.length&&j.apps.every(a=>!!labelOf(a));
  (labelWarn?[['nature','טיב ההדברה']]
   :[['nature','טיב ההדברה'],['product','שם התכשיר'],['active','החומר הפעיל'],['riskHuman','סיכונים לאדם'],['riskAnimals','סיכונים לבעלי חיים'],['reentry','זמן כניסה לאחר ההדברה']])
   .forEach(([k,m])=>req(5,'warnBefore.'+k,'לפני ההדברה: '+m));
  // 6 applications + special conditions
  if(!j.apps.length)add(6,'apps','יש להוסיף לפחות תכשיר אחד');
  j.apps.forEach((a,i)=>{const n=`תכשיר ${i+1}: `;
    const lp=labelOf(a);
    /* חסימת שמירה כשלא נבחר חומר מתוך תוצאות החיפוש.
       הבדיקה היא על המזהה, לא על טקסט שהוקלד בשדה */
    if(!a.selectedMaterialId&&!(a.materialDetails&&a.materialDetails.id)&&!a.product)
      add(6,`apps.${i}.selectedMaterialId`,n+'יש לבחור חומר מתוך תוצאות החיפוש');
    if(lp){
      /* תכשיר מהמאגר המאומת: התווית מספקת את הנתונים הרשמיים,
         והמדביר מזין רק את נתוני הביצוע של הטיפול הזה */
      /* לחומר שאין לו נתוני תווית במערכת – האזהרות וזמן הכניסה
         נדרשים מהשדות שהמדביר מילא ליד החומר */
      if(!hasLabelData(lp)){
        req(6,`apps.${i}.manualLabel.warnings`,n+'אזהרות והנחיות ללקוח');
        req(6,`apps.${i}.manualLabel.reentry`,n+'זמן כניסה מחדש');
      }
      req(6,`apps.${i}.pest`,n+'המזיק שטופל');
      /* מגבילים למזיקי התווית רק כשהוזנו כאלה. אחרת המזיק מוזן ידנית. */
      if(a.pest&&(lp.targetPests||[]).length&&!lp.targetPests.includes(a.pest))
        add(6,`apps.${i}.pest`,n+`המזיק ${a.pest} אינו מופיע בתווית של ${lp.nameHe}`);
      pendingConditionals(lp,a).forEach(c=>
        add(6,`apps.${i}.${c.questionKey}`,n+c.question,4));
      [['batch','מספר אצווה שעל האריזה'],['pkgExpiry','תאריך תפוגה שעל האריזה'],
       ['amountUsed','כמות החומר שבה השתמשת'],['areas','אזורי הטיפול']]
        .forEach(([k,m])=>req(6,`apps.${i}.${k}`,n+m));
      const st=lp.stationTracking||(lp.dosages||[]).some(d=>d.method==='bait_station');
      if(st){
        if(!(a.stations||[]).length)add(6,`apps.${i}.stations`,n+'יש לתעד לפחות תיבת האכלה אחת');
        (a.stations||[]).forEach((x,k)=>{
          if(blankStr(x.serial))add(6,`apps.${i}.stations`,n+`תיבה ${k+1}: מספר סידורי`);
          if(blankStr(x.amount))add(6,`apps.${i}.stations`,n+`תיבה ${k+1}: כמות פיתיון`);
          if(blankStr(x.loc))add(6,`apps.${i}.stations`,n+`תיבה ${k+1}: מיקום`);
        });
        req(6,`apps.${i}.nextCheck`,n+'מועד ביקורת הבא');
      }else req(6,`apps.${i}.waterAmount`,n+'כמות המים');
    }else{
      [['pest','שם המזיק'],['product','השם המסחרי'],['active','שם החומר הפעיל'],['conc','ריכוז החומר הפעיל בתכשיר'],['batch','מספר אצווה'],['dose','מינון'],['unit','יחידת מידה']].forEach(([k,m])=>req(6,`apps.${i}.${k}`,n+m));
      if(a.unit==='אחר')req(6,`apps.${i}.unitOther`,n+'פירוט יחידת המידה');
      if(!a.rtu)req(6,`apps.${i}.useConc`,n+'ריכוז בתכשיר המוכן לשימוש');
      req(6,`apps.${i}.method`,n+'שיטת היישום');
      if(a.method==='אחר')req(6,`apps.${i}.methodOther`,n+'פירוט שיטת היישום');
    }});
  const fromLabel=j.apps.length&&j.apps.every(a=>!!labelOf(a));
  if(j.opKind==='איוד')req(6,'sealing','פעולות איטום שנעשו לפני ההדברה');
  if(j.opKind==='ערפול')req(6,'publicNotice','האם בוצעה התראה מראש לציבור');
  // 7 warn after
  if(!fromLabel)req(7,'warnAfter','אזהרות ומידע ללקוח במהלך ההדברה ובסיומה');
  // 8 handover & signatures
  if(!j.handover.delivered)add(8,'handover.delivered','אישור שהיומן הושאר/נמסר אצל המזמין');
  req(8,'handover.receiverName','שם מקבל היומן');req(8,'handover.receiverSig','חתימת מקבל היומן');req(8,'techSig','חתימת המדביר');
  // 9 details copied from an earlier journal must be verified for THIS treatment
  Object.entries(j.verify||{}).forEach(([k,v])=>{
    if(v&&v.state==='pending')add(9,'verify:'+k,'טרם אומת: '+vLabel(k,j),vStep(k));
  });
  if(j.hasAssistants){
    if(!j.assistants.length)add(8,'assistants','יש להוסיף מדביר מסייע או לבטל את הסעיף');
    j.assistants.forEach((a,i)=>{const n=`מסייע ${i+1}: `;
      [['name','שם מלא'],['license','מספר רישיון'],['licenseType','סוג רישיון'],['phone','טלפון נייד'],['email','דוא"ל'],['sig','חתימה']].forEach(([k,m])=>req(8,`assistants.${i}.${k}`,n+m));});
  }
  return E;
}

function learnTemplates(j){

    ['natureTpl',[j.warnBefore.nature]],['natureAfterTpl',[j.natureAfter]],['warnTpl',[j.warnAfter]],['warTpl',[(j.warranty||{}).note]]];
  const seeds={findTpl:FIND_LIB,circTpl:CIRC_LIB,prevTpl:PREV_LIB,natureTpl:NATURE_LIB,natureAfterTpl:NATURE_AFTER_LIB,warnTpl:WARN_LIB,warTpl:WARRANTY_LIB};
  let added=0;
  pairs.forEach(([store,texts])=>texts.filter(Boolean).forEach(txt=>{
    String(txt).split('\n').map(x=>x.trim()).filter(x=>x.length>3).forEach(x=>{
      if(!seeds[store].includes(x)&&!S[store].includes(x)){S[store].unshift(x);added++}});

function compressImg(file,max=1000,q=.55){return new Promise((res,rej)=>{
  const fr=new FileReader();
  fr.onload=()=>{const im=new Image();
    im.onload=()=>{const sc=Math.min(1,max/Math.max(im.width,im.height));
      const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
      const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(im,0,0,c.width,c.height);
      let out=c.toDataURL('image/jpeg',q);
      if(out.length>180000)out=c.toDataURL('image/jpeg',.4);
      res(out)};
    im.onerror=()=>rej(new Error('לא ניתן לקרוא את התמונה'));im.src=fr.result};
  fr.onerror=()=>rej(new Error('קריאת הקובץ נכשלה'));fr.readAsDataURL(file)})}

function splitActive(a){ // "x 5.00%, y 10.00%" -> names / concentrations, as stored in the registry
  const parts=String(a||'').split(/,\s*(?=[^,]*\d[\d.]*\s*%)/);const names=[],concs=[];
  parts.forEach(s=>{const m=s.trim().match(/^(.*?)\s*([\d.]+\s*%)\s*$/);if(m){names.push(m[1].trim());concs.push(m[2].replace(/\s/g,''))}else if(s.trim())names.push(s.trim())});
  return {active:names.join(', '),conc:concs.join(', ')};
}

function loadFromJournal(src,mode){

    if(j.warranty&&j.warranty.kind&&j.warranty.kind!=='none'){j.warranty.until='';applyWarranty(j);vMark(j,'warranty')}
  }
  j.source_pest_log_id=src.id;j.cloned_from_no=src.no;j.cloned_from_date=src.date;
  j.cloned_at=Date.now();j.cloned_by=profileWho();j.geo=null;j.stationChecks={};
  j.copied_sections=mode==='all'?defaultSections():['product','active','batch','dose','useConc','method'];

  d.addEventListener('click',e=>{const b=e.target.closest('[data-dlg]');if(!b)return;const v=+((document.getElementById('numin')||{}).value||0);d.remove();res(b.dataset.dlg==='1'?v:0)});

function ask(msg,{ok='אישור',cancel='ביטול',danger=false,title=''}={}){
  return new Promise(res=>{
    closeSheet();const d=document.createElement('div');d.className='sheet';d.id='sheet';d.setAttribute('role','alertdialog');d.setAttribute('aria-modal','true');
    d.innerHTML=`<div class="in">${title?`<h3>${esc(title)}</h3>`:''}<p style="margin:6px 0 16px;font-size:16px">${esc(msg)}</p><div style="display:flex;gap:10px">${cancel?`<button class="btn ghost" style="flex:1" data-dlg="0">${esc(cancel)}</button>`:''}<button class="btn ${danger?'':'gold'}" style="flex:1;${danger?'background:var(--danger);color:#fff':''}" data-dlg="1">${esc(ok)}</button></div></div>`;
    const done=v=>{d.remove();res(v)};
    d.addEventListener('click',e=>{const b=e.target.closest('[data-dlg]');if(b){e.stopPropagation();done(b.dataset.dlg==='1')}else if(e.target===d)done(false)});
    document.body.appendChild(d);setTimeout(()=>d.querySelector('[data-dlg="1"]')?.focus(),30);
  });
}

   ${list.map((st,i)=>{
     const c=stopClient(st),prev=stopPrev(st);

function initRouteDrag(){

      const row=g.closest('.rstop');if(!row)return;
      row.classList.add('dragging');
      try{g.setPointerCapture(e.pointerId)}catch(_){}
      const move=ev=>{
        const el=document.elementFromPoint(ev.clientX,ev.clientY);
        const over=el&&el.closest?el.closest('.rstop'):null;

        row.classList.remove('dragging');
        reorderStops(routeDate(),[...list.querySelectorAll('.rstop')].map(x=>x.dataset.id));

function initSigs(){

    cv.width=w*dpr;cv.height=h*dpr;const ctx=cv.getContext('2d');if(!ctx)return;ctx.scale(dpr,dpr);

    let dr=false,last,moved=false;const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};

    cv.onpointermove=e=>{if(!dr)return;const p=pos(e);ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();last=p;moved=true};
    const end=()=>{if(!dr)return;dr=false;if(!moved)return;
      const o=document.createElement('canvas');o.width=Math.min(600,w*dpr);o.height=Math.round(o.width*h/w);o.getContext('2d').drawImage(cv,0,0,o.width,o.height);

const PDF={};/* id -> {state:'idle'|'busy'|'ready'|'error', blob, url, err, ver} */
async function pdfBlob(j){
  if(typeof html2canvas==='undefined'||!window.jspdf)throw new Error('ספריית ה-PDF לא נטענה (בדקו חיבור לאינטרנט)');
  const {jsPDF}=window.jspdf;
  const host=document.createElement('div');
  host.setAttribute('aria-hidden','true');
  host.style.cssText='position:fixed;top:0;left:0;width:760px;background:#fff;z-index:-1;opacity:0;pointer-events:none';
  host.innerHTML=docHTML(j);document.body.appendChild(host);
  const paper=host.firstElementChild;paper.style.boxShadow='none';paper.style.borderRadius='0';paper.classList.remove('draftmark');
  host.querySelectorAll('.tblwrap').forEach(t=>t.style.overflow='visible');
  try{
    if(document.fonts&&document.fonts.ready)await Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]);
    const imgs=[...host.querySelectorAll('img')];await Promise.all(imgs.map(im=>im.complete?0:new Promise(r=>{im.onload=im.onerror=r})));
    const pdf=new jsPDF({unit:'mm',format:'a4',orientation:'portrait',compress:true});
    const PW=210,PH=297,M=10,CW=PW-2*M,BOTTOM=PH-M;let y=M;
    const pxToMm=CW/paper.clientWidth;
    const blocks=[...paper.children];
    const padL=parseFloat(getComputedStyle(paper).paddingLeft)||0;
    for(const el of blocks){
      const canvas=await html2canvas(el,{scale:2,backgroundColor:'#ffffff',logging:false,useCORS:true,windowWidth:760});
      const wMm=el.offsetWidth*pxToMm, hMm=el.offsetHeight*pxToMm;
      const x=M+(padL*pxToMm)*0; // blocks already sit inside padded paper; center horizontally
      const xx=M+(CW-wMm)/2;
      if(hMm<=BOTTOM-y){pdf.addImage(canvas.toDataURL('image/jpeg',.92),'JPEG',xx,y,wMm,hMm);y+=hMm+1.2;continue}
      if(hMm<=BOTTOM-M){pdf.addPage();y=M;pdf.addImage(canvas.toDataURL('image/jpeg',.92),'JPEG',xx,y,wMm,hMm);y+=hMm+1.2;continue}
      // taller than a page: slice
      const pxPerMm=canvas.height/hMm;let offMm=0;
      while(offMm<hMm){
        let avail=BOTTOM-y;if(avail<20){pdf.addPage();y=M;avail=BOTTOM-M}
        const sliceMm=Math.min(avail,hMm-offMm);
        const c=document.createElement('canvas');c.width=canvas.width;c.height=Math.ceil(sliceMm*pxPerMm);
        c.getContext('2d').drawImage(canvas,0,Math.floor(offMm*pxPerMm),canvas.width,c.height,0,0,canvas.width,c.height);
        pdf.addImage(c.toDataURL('image/jpeg',.92),'JPEG',xx,y,wMm,sliceMm);
        offMm+=sliceMm;y+=sliceMm;if(offMm<hMm){pdf.addPage();y=M}
      }
      y+=1.2;
    }
    const n=pdf.getNumberOfPages();
    for(let i=1;i<=n;i++){pdf.setPage(i);pdf.setFontSize(8);pdf.setTextColor(120);pdf.text(`${i}/${n}  #${j.no}`,PW/2,PH-4,{align:'center'})}
    return pdf.output('blob');
  }finally{host.remove()}
}
async function ensurePdf(j){

  return entry.promise;

/* ---- audit trail ---- */
function audit(j,ev,info){
  if(!j)return;
  (j.audit_events=j.audit_events||[]).push({at:Date.now(),by:profileWho(),ev,info:info||''});
  if(j.audit_events.length>300)j.audit_events=j.audit_events.slice(-300);
  S.auditEvents=S.auditEvents||[];
  S.auditEvents.unshift({at:Date.now(),by:profileWho(),jid:j.id,no:j.no,ev,info:info||''});
  if(S.auditEvents.length>400)S.auditEvents=S.auditEvents.slice(0,400);
  saveLocalSoon();pushAuditSoon();
}

/* ---- previous journals for this client / site ---- */
function journalsForSite(name,place,exceptId,doneOnly){
  const key=siteKeyOf(name,place),n=norm(name),bySite=!!(place&&place.kind);
  return journals().filter(j=>j.id!==exceptId&&(!doneOnly||j.status==='done')&&
      (bySite?siteKey(j)===key:(n&&norm(j.client.name)===n)))
    .sort((a,b)=>(b.completedAt||b.updatedAt||0)-(a.completedAt||a.updatedAt||0));
}
const lastForSite=(name,place,exceptId)=>journalsForSite(name,place,exceptId,true)[0]||null;
function findPrev(j){
  if(!j||!norm(j.client.name))return null;
  const s=lastForSite(j.client.name,j.place,j.id);
  if(s)return {j:s,exact:true};
  const c=lastForClient(j.client.name,j.client.phone,j.id);
  return c?{j:c,exact:false}:null;
}
function openDraftForSite(name,place,exceptId){
  const key=siteKeyOf(name,place);
  return journals().find(j=>j.status==='draft'&&j.id!==exceptId&&siteKey(j)===key&&norm(j.client.name))||null;
}

/* ---- verification engine ----
   j.verify[key] = {state:'pending'|'ok', at, by, how:'kept'|'changed'}
   key = kind | kind:itemId                                                    */
const VK={
  product     :{step:4,n:'תכשיר ותווית',   bulk:1},
  batch       :{step:4,n:'מספר אצווה',     bulk:0,ok:'האצווה עדיין בשימוש'},
  dose        :{step:4,n:'מינון',          bulk:0,ok:'המינון מתאים לטיפול הזה'},
  finding     :{step:2,n:'ממצאי ניטור',    bulk:0,ok:'הממצא נבדק בטיפול הנוכחי'},
  prevention  :{step:3,n:'פעולות מניעה',   bulk:1},
  circumstances:{step:3,n:'נסיבות ההחלטה', bulk:1},
  warnBefore  :{step:5,n:'אזהרות וסיכונים לפני הטיפול',bulk:0,ok:'האזהרות נמסרו ללקוח'},
  reentry     :{step:5,n:'זמן כניסה מחדש', bulk:0,ok:'נבדק מול התווית ונמסר ללקוח'},
  warnAfter   :{step:5,n:'אזהרות בסיום',   bulk:0,ok:'האזהרות נמסרו ללקוח'},
  warranty    :{step:6,n:'אחריות',         bulk:1}
};
const vKind=k=>String(k).split(':')[0];
const vId=k=>String(k).split(':')[1]||'';
const vStep=k=>(VK[vKind(k)]||{step:LAST_STEP}).step;
const vOkLabel=k=>(VK[vKind(k)]||{}).ok||'אישור';
function vLabel(k,j){
  j=j||cur;const kind=vKind(k),id=vId(k),base=(VK[kind]||{n:k}).n;
  if(!j||!id)return base;
  if(kind==='finding'){const f=(j.findings||[]).find(x=>x.id===id);return base+(f&&f.pest?' – '+f.pest:'')}
  const a=(j.apps||[]).find(x=>x.id===id);
  return base+(a&&a.product?' – '+a.product:'');
}
/* a field may be approved together with others only when it is not one of the
   explicit-consent kinds, and – for a product – only when its label was found */
function vBulkOk(k,j){
  j=j||cur;const kind=vKind(k);
  if(!(VK[kind]||{}).bulk)return false;
  if(kind==='product'){const a=(j.apps||[]).find(x=>x.id===vId(k));return !!(a&&labelCheck(a.product).ok)}
  return true;
}
function vMark(j,key){
  j.verify=j.verify||{};
  if(!j.verify[key])j.verify[key]={state:'pending',at:null,by:'',how:''};
}
function vOkMark(j,key,how){
  j.verify=j.verify||{};
  if(!j.verify[key])return false;
  if(j.verify[key].state==='ok')return false;
  j.verify[key]={state:'ok',at:Date.now(),by:profileWho(),how:how||'kept'};
  audit(j,'verify',vLabel(key,j)+' · '+(how==='changed'?'עודכן בטיפול הנוכחי':'אומת'));
  vSync(j);return true;
}
const vPending=j=>Object.entries((j&&j.verify)||{}).filter(([,v])=>v&&v.state==='pending');
function vSync(j){
  const all=Object.entries(j.verify||{});
  if(!all.length){j.verification_status='none';return}
  const pend=all.filter(([,v])=>v.state==='pending');
  j.verification_status=pend.length?'pending':'verified';
  if(!pend.length){
    const last=all.map(([,v])=>v).sort((a,b)=>(b.at||0)-(a.at||0))[0];
    j.verified_at=last?last.at:Date.now();j.verified_by=last?last.by:profileWho();
  }else{j.verified_at=null;j.verified_by=''}
}
/* editing a copied value counts as verifying it – except for the warning
   fields, which need an explicit "נמסרו ללקוח" confirmation */
const V_AUTO=['product','batch','dose','finding','prevention','circumstances','warranty'];
function vKeyForPath(j,path){
  let m=path.match(/^apps\.(\d+)\.(\w+)$/);
  if(m){const a=j.apps[+m[1]];if(!a)return null;
    if(m[2]==='batch')return 'batch:'+a.id;
    if(m[2]==='dose'||m[2]==='unit'||m[2]==='unitOther')return 'dose:'+a.id;
    if(['product','active','conc','useConc','rtu'].includes(m[2]))return 'product:'+a.id;
    return null}
  m=path.match(/^findings\.(\d+)\./);
  if(m){const f=j.findings[+m[1]];return f?'finding:'+f.id:null}
  if(path==='warnBefore.reentry')return 'reentry';
  if(path.startsWith('warnBefore.'))return 'warnBefore';
  if(path==='warnAfter'||path==='natureAfter')return 'warnAfter';
  if(path.startsWith('warranty.'))return 'warranty';
  if(path==='prevention')return 'prevention';
  if(path==='circumstances')return 'circumstances';
  return null;
}
function vAuto(path){
  if(!cur||!cur.verify)return;
  const k=vKeyForPath(cur,path);
  if(!k||!cur.verify[k]||cur.verify[k].state!=='pending')return;
  if(!V_AUTO.includes(vKind(k)))return;
  vOkMark(cur,k,'changed');
}

/* ---- product / label check against the bundled registry ---- */
function labelCheck(name){
  const n=norm(name);
  if(!n)return {ok:false,why:'לא הוזן שם תכשיר'};
  if(REG.has(n))return {ok:true,src:'מאגר התכשירים המובנה',p:prodIdx.get(n)};
  if(prodIdx.has(n))return {ok:false,manual:true,why:'התכשיר הוזן ידנית ואינו מופיע במאגר הרשום',p:prodIdx.get(n)};
  return {ok:false,why:'התכשיר לא נמצא במאגר התכשירים הרשומים'};
}
/* does the registry still list this pest for the product?
   the registry names pests in the plural ("תיקנים") while the exterminator
   writes a species ("תיקן גרמני"), so compare word stems, not whole strings */
const HEB_FIN={'\u05da':'\u05db','\u05dd':'\u05de','\u05df':'\u05e0','\u05e3':'\u05e4','\u05e5':'\u05e6'};
const stem=w=>norm(w).replace(/[\u05da\u05dd\u05df\u05e3\u05e5]/g,c=>HEB_FIN[c]).replace(/(יות|ים|ות|ת|י)$/,'');
const pestWords=s=>String(s||'').split(/[,\s/]+/).map(stem).filter(w=>w.length>=3);
function labelFit(a){
  const c=labelCheck(a.product);
  if(!c.ok||!c.p||!a.pest)return null;
  const reg=pestWords(c.p.p),mine=pestWords(a.pest);
  if(!reg.length||!mine.length)return null;
  const hit=mine.some(m=>reg.some(r=>r.startsWith(m.slice(0,3))||m.startsWith(r.slice(0,3))));
  return hit?null:`הרישום של ${a.product} מתייחס ל: ${c.p.p}. יש לוודא מול התווית שהתכשיר מתאים ל${a.pest}, או לבחור תכשיר אחר.`;
}

function warEnd(kind,amount,start,until){
  if(['none','visit','free'].includes(kind))return '';
  if(kind==='until')return until||'';
  const d=new Date(String(start||'')+'T00:00:00');
  if(isNaN(d.getTime()))return '';
  const n=+amount||0;if(!n)return '';
  if(kind==='days')d.setDate(d.getDate()+n);
  else if(kind==='weeks')d.setDate(d.getDate()+n*7);
  else d.setMonth(d.getMonth()+n);
  d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
  return d.toISOString().slice(0,10);
}
/* the legacy quick chips keep working: turn their text into a kind + amount */
function parsePeriod(s){
  s=String(s||'');
  if(!s||s==='ללא אחריות')return {kind:'none',amount:0};
  if(s==='לפי הסכם')return {kind:'free',amount:0};
  const m=s.match(/(\d+)/);const n=m?+m[1]:0;
  if(/יום|ימים/.test(s))return {kind:'days',amount:n};
  if(/שבוע/.test(s))return {kind:'weeks',amount:n};
  if(/חודש/.test(s))return {kind:'months',amount:n};
  return {kind:'free',amount:0};
}
const periodText=w=>{
  if(!w)return '';
  const k=warKind(w.kind);
  if(w.kind==='until')return w.until?'עד '+fmtD(w.until):k.n;
  return k.unit?`${w.amount} ${k.unit}`:k.n;
};
/* recomputed from the CURRENT treatment date – a copied end date is never kept */
function applyWarranty(j){
  const w=j.warranty=j.warranty||{period:'',note:''};
  if(!w.tplId){const p=parsePeriod(w.period);w.kind=p.kind;w.amount=p.amount}
  if(!w.kind)w.kind='none';
  if(!w.period)w.period=periodText(w);
  w.start=j.date||today();
  w.end=warEnd(w.kind,w.amount,w.start,w.until);
  w.checkAt=w.check?warEnd('days',w.checkDays||0,w.start):'';
  return w;
}
function applyWarTpl(j,t){
  const w=j.warranty=j.warranty||{};
  w.tplId=t.id;w.tplName=t.name;w.kind=t.kind;w.amount=t.amount;w.until=t.until||'';
  w.note=t.text||'';w.cond=t.cond||'';w.check=!!t.check;w.checkDays=t.checkDays||0;
  w.period=periodText(w);
  applyWarranty(j);
  audit(j,'warranty','תבנית אחריות: '+t.name+(w.end?' · בתוקף עד '+fmtD(w.end):''));
}

  stations    :j=>{const n=stationsOf(siteKey(j)).length;return n?n+' תחנות האכלה':''},
  product     :j=>(j.apps||[]).map(a=>a.product).filter(Boolean).join(', '),
  active      :j=>(j.apps||[]).map(a=>[a.active,a.conc].filter(Boolean).join(' ')).filter(Boolean).join(', '),
  dose        :j=>(j.apps||[]).map(a=>[a.dose,a.unit==='אחר'?a.unitOther:a.unit].filter(Boolean).join(' ')).filter(Boolean).join(', '),
  useConc     :j=>(j.apps||[]).map(a=>a.rtu?'מוכן לשימוש':a.useConc).filter(Boolean).join(', '),
  method      :j=>(j.apps||[]).map(a=>a.method==='אחר'?a.methodOther:a.method).filter(Boolean).join(', '),
  riskHuman   :j=>(j.warnBefore||{}).riskHuman||'',
  riskAnimals :j=>(j.warnBefore||{}).riskAnimals||'',
  reentry     :j=>(j.warnBefore||{}).reentry||'',
  warnBefore  :j=>[(j.warnBefore||{}).nature,(j.warnBefore||{}).other].filter(Boolean).join(' · '),
  warnAfter   :j=>[j.warnAfter,j.natureAfter].filter(Boolean).join(' · '),
  warPeriod   :j=>(j.warranty||{}).period||'',
  warText     :j=>(j.warranty||{}).note||'',
  warCond     :j=>(j.warranty||{}).cond||'',
  supplementary:j=>j.needSupplementary?(j.supplementary||'נדרש'):''
};
const secVal=(k,j)=>{try{return String((SEC_VAL[k]?SEC_VAL[k](j):'')||'').trim()}catch(e){return ''}};
/* פרטים שלעולם אינם מועתקים – מוצגים למשתמש לפני הטעינה */
const NEVER_COPIED=['תאריך ושעת הטיפול','מספר היומן','נ"צ ומיקום GPS',
 'מספרי אצווה ותאריכי תפוגה','הכמות שנרקחה והכמות ששימשה בפועל',
 'חתימות המדביר והלקוח','אישור מסירת היומן','תמונות',
 'תוצאות מוקדי בדיקה ותחנות האכלה','תאריך סיום האחריות (מחושב מחדש למועד הטיפול)'];

function applyClone(j,src,keys){
  const K=new Set(keys||[]);
  /* client + place – constant data, no verification needed */
  if(K.has('client')){j.client.name=src.client.name||'';j.client.phone=src.client.phone||''}
  if(K.has('contact')){j.client.role=src.client.role||'';j.client.roleOther=src.client.roleOther||''}
  if(K.has('address')||K.has('placeKind')){
    const p=clone(src.place||{});
    if(!K.has('placeKind'))p.kind=j.place.kind;
    if(!K.has('address')){['city','street','houseNo','aptNo','houseApt','authority','siteDesc','coords','neighborhood'].forEach(k=>delete p[k])}
    j.place=Object.assign(j.place,p);
  }
  if(K.has('siteNotes')){j.siteNotes=src.siteNotes||'';j.access=src.access||''}
  j.geo=null; /* the previous treatment's GPS is never carried over */

  /* fixed inspection spots – names only, never the previous results */
  if(K.has('spots'))j.spots=(src.spots||[]).map(s=>({id:uid(),name:s.name,checked:false,note:''}));

  /* stations belong to the site; copy the definitions when the site key moved */
  if(K.has('stations')){
    const from=siteKey(src),to=siteKey(j);
    if(from&&to&&from!==to&&!stationsOf(to).length)
      stationsOf(from).forEach(st=>addStation(to,st.label,st.type,st.loc));
  }
  j.stationChecks={}; /* previous station results are never carried over */

  /* findings */
  if(K.has('pests')){
    const list=(src.findings||[]).filter(f=>f.pest);
    if(list.length){
      j.findings=list.map(f=>{const n=newFinding();
        n.pest=f.pest;n.subtype=f.subtype||'';n.location=f.location||'';
        if(K.has('findings')){n.identification=f.identification||'';n.stage=f.stage||'';n.signs=f.signs||'';n.level=f.level||''}
        return n});
      j.findings.forEach(f=>vMark(j,'finding:'+f.id));
    }
  }
  if(K.has('prevention')&&src.prevention){j.prevention=src.prevention;vMark(j,'prevention')}
  if(K.has('circumstances')&&src.circumstances){j.circumstances=src.circumstances;vMark(j,'circumstances')}

  /* products – always a suggestion, never an approved entry */
  if(K.has('product')){
    const list=(src.apps||[]).filter(a=>a.product);
    if(list.length){
      j.apps=list.map(a=>{const n=newApp();
        n.product=a.product;
        if(K.has('pests'))n.pest=a.pest||'';
        if(K.has('active')){n.active=a.active||'';n.conc=a.conc||''}
        /* התכשיר והמינון שבתווית עוברים כהצעה; האצווה והכמויות לא */
        n.selectedMaterialId=a.selectedMaterialId||'';n.selectedMaterialName=a.selectedMaterialName||'';
        n.registrationNumber=a.registrationNumber||'';
        n.materialDetails=a.materialDetails?clone(a.materialDetails):null;
        /* פרטי התווית שהוזנו ידנית נחשבים מידע על החומר, לא נתוני ביצוע */
        n.manualLabel=clone(manualOf(a));
        n.surface=a.surface||'';
        if(K.has('dose')){n.dosageId=a.dosageId||'';n.dose=a.dose||'';n.unit=a.unit||'';n.unitOther=a.unitOther||''}
        if(K.has('useConc')){n.rtu=!!a.rtu;n.useConc=a.rtu?'':(a.useConc||'')}
        if(K.has('method')){n.method=a.method||'';n.methodOther=a.methodOther||''}
        return n});
      /* נתוני ביצוע לעולם אינם מועתקים: אצווה, תפוגה, כמויות, אזורים ותיבות */
      j.apps.forEach(a=>{
        clearExecution(a);
        syncDose(a);/* מחזיר את נוסח המינון מהתווית, לא את הכמות שבוצעה */
        vMark(j,'product:'+a.id);
        if(a.dosageId)vMark(j,'dose:'+a.id);
      });
    }
  }

  /* warnings – each one keeps the products it came from */
  const wb=src.warnBefore||{};
  let wTouched=false;
  if(K.has('riskHuman')&&wb.riskHuman){j.warnBefore.riskHuman=wb.riskHuman;wTouched=true}
  if(K.has('riskAnimals')&&wb.riskAnimals){j.warnBefore.riskAnimals=wb.riskAnimals;wTouched=true}
  if(K.has('warnBefore')){
    if(wb.nature)j.warnBefore.nature=wb.nature;
    if(wb.other)j.warnBefore.other=wb.other;
    if(wb.product)j.warnBefore.product=wb.product;
    if(wb.active)j.warnBefore.active=wb.active;
    if(wb.nature||wb.other)wTouched=true;
  }
  if(wTouched){
    j.warnSrcProducts=(src.apps||[]).map(a=>a.product).filter(Boolean);
    vMark(j,'warnBefore');
  }
  if(K.has('reentry')&&wb.reentry){j.warnBefore.reentry=wb.reentry;vMark(j,'reentry')}
  if(K.has('warnAfter')&&(src.warnAfter||src.natureAfter)){
    j.warnAfter=src.warnAfter||'';j.natureAfter=src.natureAfter||'';
    vMark(j,'warnAfter');
  }
  if(K.has('supplementary')){j.needSupplementary=!!src.needSupplementary;j.supplementary=src.supplementary||''}

  /* warranty – the period is reused, the end date is always recomputed */
  const sw=src.warranty||{};
  if(K.has('warPeriod')||K.has('warText')||K.has('warCond')){
    const w=j.warranty=j.warranty||{};
    if(K.has('warPeriod')){
      w.kind=sw.kind||parsePeriod(sw.period).kind;
      w.amount=sw.amount!=null?sw.amount:parsePeriod(sw.period).amount;
      w.until='';                /* an absolute end date is never copied */
      w.tplId=sw.tplId||'';w.tplName=sw.tplName||'';
      w.check=!!sw.check;w.checkDays=sw.checkDays||0;
      if(w.kind==='until'){w.kind='months';w.amount=w.amount||3}
    }
    if(K.has('warText'))w.note=sw.note||'';
    if(K.has('warCond'))w.cond=sw.cond||'';
    w.period=periodText(w);
    applyWarranty(j);
    if(w.kind&&w.kind!=='none')vMark(j,'warranty');
  }

  j.source_pest_log_id=src.id;
  j.cloned_from_no=src.no;j.cloned_from_date=src.date;
  j.cloned_at=Date.now();j.cloned_by=profileWho();
  j.copied_sections=[...K];
  j.clone_stale=!DB||!!(S.pending&&S.pending[src.id]);
  vSync(j);
  audit(j,'clone',`שוכפל מיומן #${src.no} (${fmtD(src.date)}) · ${K.size} קבוצות מידע · ${vPending(j).length} פרטים לאימות`);
  return j;
}
function clearClone(j){
  j.verify={};j.source_pest_log_id=null;j.cloned_at=null;j.cloned_by='';
  j.copied_sections=[];j.cloned_from_no=null;j.cloned_from_date=null;j.clone_stale=false;
  j.verification_status='none';j.verified_at=null;j.verified_by='';
}

const CMP=[
 ['מזיקים'            ,j=>(j.findings||[]).map(f=>f.pest).filter(Boolean).join(', '),1],
 ['רמת הנגיעות'       ,j=>(j.findings||[]).map(f=>f.level).filter(Boolean).join(', '),1],
 ['ממצאי ניטור'       ,j=>(j.findings||[]).map(f=>f.signs).filter(Boolean).join(' | '),0],
 ['תכשירים'           ,j=>(j.apps||[]).map(a=>a.product).filter(Boolean).join(', '),1],
 ['מספרי אצווה'       ,j=>(j.apps||[]).map(a=>a.batch).filter(Boolean).join(', '),1],
 ['מינונים'           ,j=>(j.apps||[]).map(a=>[a.dose,a.unit==='אחר'?a.unitOther:a.unit].filter(Boolean).join(' ')).filter(Boolean).join(', '),1],
 ['שיטות יישום'       ,j=>(j.apps||[]).map(a=>a.method==='אחר'?a.methodOther:a.method).filter(Boolean).join(', '),0],
 ['זמן כניסה מחדש'    ,j=>(j.warnBefore||{}).reentry,1],
 ['סיכונים לאדם'      ,j=>(j.warnBefore||{}).riskHuman,1],
 ['סיכונים לבעלי חיים',j=>(j.warnBefore||{}).riskAnimals,1],
 ['אזהרות בסיום'      ,j=>j.warnAfter,1],
 ['טיפול משלים'       ,j=>j.needSupplementary?(j.supplementary||'נדרש'):'לא נדרש',0],
 ['אחריות'            ,j=>[(j.warranty||{}).period,(j.warranty||{}).end&&('עד '+fmtD(j.warranty.end))].filter(Boolean).join(' · '),1],
 ['פעולות מניעה'      ,j=>j.prevention,0],
 ['נסיבות ההחלטה'     ,j=>j.circumstances,0]
];
function compareSheet(){
  const src=S.journals[cur.source_pest_log_id];
  if(!src)return info('היומן שממנו הועתקו הפרטים אינו זמין במכשיר.','השוואה');
  const rows=CMP.map(([n,f,hot])=>{
    const a=String(f(src)||'').trim(),b=String(f(cur)||'').trim();
    let state='same';
    if(a&&!b)state='removed';else if(!a&&b)state='new';else if(a!==b)state='changed';
    return {n,a,b,state,hot};
  });
  const ch=rows.filter(r=>r.state!=='same').length;
  const pend=vPending(cur).length;
  sheet(`<h3>השוואה ליומן #${src.no}</h3>
   <p class="hint" style="margin:0">${fmtD(src.date)} · ${ch} שדות שונים${pend?` · ${pend} פרטים עוד לא אומתו`:' · כל הפרטים אומתו'}</p>
   <div style="max-height:56vh;overflow:auto;margin-top:10px"><table class="cmp">
    <tr><th>שדה</th><th>יומן #${src.no}</th><th>היומן הנוכחי</th></tr>
    ${rows.map(r=>`<tr class="${r.state}${r.hot&&r.state!=='same'?' hot':''}">
      <td>${esc(r.n)}${r.hot&&r.state!=='same'?' ★':''}</td>
      <td>${esc(r.a)||'—'}</td>
      <td>${esc(r.b)||'—'}${r.state==='changed'?'<br><small class="opt">שונה</small>':r.state==='new'?'<br><small class="opt">חדש</small>':r.state==='removed'?'<br><small class="opt">הוסר</small>':''}</td></tr>`).join('')}
   </table></div>
   ${pend?`<div class="note">${pend} פרטים עדיין מסומנים "נדרש אימות" ואינם נחשבים כאילו תועדו בטיפול הנוכחי.</div>`:''}
   <button class="btn ghost w" style="margin-top:12px" data-a="closeSheet">סגירה</button>`);
}

});

/* picking a quick period chip drops the template binding so the end date is
   recomputed from the chip, not from a template that no longer applies */
const _setv=A.setv;
A.setv=d=>{if(d.f==='warranty.period'&&cur&&cur.warranty){cur.warranty.tplId='';cur.warranty.tplName=''}return _setv(d)};
/* before completing, re-check every product against the registry */
const _complete=A.complete;
A.complete=async()=>{
  if(cur){
    const bad=[];
    (cur.apps||[]).forEach(a=>{if(!a.product)return;
      const c=labelCheck(a.product);if(!c.ok)bad.push(`${a.product} – ${c.why}`);
      const fit=labelFit(a);if(fit)bad.push(fit)});
    if(bad.length&&!A._labelOk){
      A._labelOk=true;
      await info(bad.join('\n')+'\n\nיש לוודא את הפרטים מול התווית העדכנית לפני סיום היומן.','בדיקת תכשירים ותוויות');
      return;
    }
    if(cur.source_pest_log_id||Object.keys(cur.verify||{}).length){
      cur.warnSnapshot={at:Date.now(),by:profileWho(),
        warnBefore:clone(cur.warnBefore),warnAfter:cur.warnAfter||'',
        products:(cur.apps||[]).map(a=>a.product).filter(Boolean)};
      audit(cur,'complete','היומן הושלם · '+Object.keys(cur.verify||{}).length+' פרטים שהועתקו אומתו');
    }
  }
  A._labelOk=false;
  return _complete();
};
/* a new journal never reuses an open draft for the same site by accident */
const _newJ=A.newJ;
A.newJ=async()=>{
  if(A._creating)return;A._creating=true;
  try{await _newJ()}finally{A._creating=false}
};

    if(d.conditionType==='surface'){

const EXEC_FIELDS=['batch','pkgExpiry','amountUsed','waterAmount','areas','nextCheck'];
function clearExecution(a){
  EXEC_FIELDS.forEach(k=>a[k]='');
  a.stations=[];
  a.dose='';a.useConc='';
  return a;
}
/* בחירת חומר – עדכון אטומי אחד של מצב היומן.
   זו הפונקציה היחידה שכותבת את שדות החומר, ולכן אין מקור נתונים מקביל. */
function selectMaterial(material,{index=0,pest=null,dosageId=null,journal=null}={}){
  const j=journal||cur;
  if(!j)return {ok:false,reason:'אין יומן פתוח'};
  if(!material)return {ok:false,reason:'החומר אינו קיים במאגר'};
  const a=j.apps[index]||(j.apps[index]=newApp());
  clearMaterial(a,j);
  applyProduct(a,material,{pest,dosageId});
  a.selectedMaterialName=material.nameHe;
  vMark(j,'product:'+a.id);vOkMark(j,'product:'+a.id,'changed');
  audit(j,'material','נבחר חומר: '+material.nameHe+
    (material.registrationNumber?' · רישום '+material.registrationNumber:''));
  j.updatedAt=Date.now();
  S.journals[j.id]=j;
  vSync(j);
  saveLocal();          /* כתיבה מיידית למכשיר */
  queuePush(j,0);       /* ודחיפה לענן, לא רק למצב המסך */
  return {ok:true,material};
}
/* ניקוי מלא של החומר הקודם, כדי שלא יתערבבו אזהרות, מינונים או מזיקים */
function clearMaterial(a,j){
  const old=labelOf(a);
  ['selectedMaterialId','selectedMaterialName','product','active','conc',
   'registrationNumber','surface','dosageId','pest'].forEach(k=>a[k]='');
  (old&&old.conditionalInstructions||[]).forEach(c=>{if(c.questionKey)delete a[c.questionKey]});
  a.materialDetails=null;
  clearExecution(a);
  if(j&&j.verify){delete j.verify['product:'+a.id];delete j.verify['dose:'+a.id];vSync(j)}
  return a;
}
function applyProduct(a,p,{pest=null,dosageId=null}={}){
  a.selectedMaterialId=p.id;
  a.selectedMaterialName=p.nameHe;
  a.product=p.nameHe;
  a.active=ingNames(p);
  a.conc=ingPct(p);
  a.registrationNumber=p.registrationNumber;
  a.materialDetails=materialDetailsOf(p);
  a.rtu=false;
  a.method=(p.dosages||[]).some(d=>d.method==='bait_station')?'תחנות האכלה':'ריסוס';
  a.methodOther='';
  a.surface='';a.dosageId='';
  (p.conditionalInstructions||[]).forEach(c=>{if(c.questionKey)a[c.questionKey]=null});
  a.pest=pest&&(p.targetPests||[]).includes(pest)?pest:'';
  if(dosageId&&(p.dosages||[]).some(d=>d.id===dosageId))a.dosageId=dosageId;
  clearExecution(a);
  return a;
}
function syncDose(a){
  const p=labelOf(a),d=(p&&(p.dosages||[]).find(x=>x.id===a.dosageId))||null;
  if(!d){a.dose='';a.unit=a.unit||'';return}
  a.dose=d.text;a.unit=a.unit||'אחר';a.unitOther=a.unitOther||'לפי התווית';
}

function applyTreatment(j,t){
  if(!j||!t)return;
  const p=prodById(t.pid);if(!p)return;
  const a=j.apps[0]||newApp();
  applyProduct(a,p,{pest:t.pest||null});
  j.apps=[a];
  j.tplId=t.id;j.tplName=t.name;j.tplMethod=t.method||'';
  if(t.pest&&!(j.findings||[]).some(f=>f.pest===t.pest)){
    const f=j.findings[0]&&!j.findings[0].pest?j.findings[0]:newFinding();
    f.pest=t.pest;j.findings=[f];
  }
  audit(j,'template','נטען מתבנית: '+t.name+' · תכשיר '+p.nameHe);
  touch();
}
function applyClientTpl(j,c){
  const t=c.siteTemplate;if(!t)return;
  j.client.name=c.name;j.client.phone=c.phone||'';
  if(c.role){j.client.role=c.role;j.client.roleOther=c.roleOther||''}
  if((c.places||[])[0])j.place=Object.assign(j.place,clone(c.places[0]));
  j.access=t.entry||'';
  j.siteNotes=[t.notes,t.gear&&('ציוד/מפתח: '+t.gear),t.siteType&&('סוג האתר: '+t.siteType)].filter(Boolean).join('\n');
  j.clientTplId=c.id;
  if(t.checkPoints)j.spots=String(t.checkPoints).split(/[,\n]+/).map(x=>x.trim()).filter(Boolean)
    .map(n=>({id:uid(),name:n,checked:false,note:''}));
  if(t.pid){const p=prodById(t.pid);
    if(p){const a=j.apps[0]||newApp();applyProduct(a,p);j.apps=[a]}}
  (j.apps||[]).forEach(clearExecution);
  audit(j,'template','נטען מתבנית הלקוח: '+(t.name||c.name));
  touch();
}


/* ---- חיפוש חומר: נרמול, דירוג והדגשה ----
   הנרמול מנטרל גרשיים, מקפים, רווחים כפולים, אותיות סופיות ואותיות גדולות,
   ושומר מפת אינדקסים כדי להדגיס את האותיות שהוקלדו במקום הנכון בשם המקורי */
const SQ_FIN={'ך':'כ','ם':'מ','ן':'נ','ף':'פ','ץ':'צ'};
function sqMap(str,compact){
  const s=String(str==null?'':str);
  let out='',space=false;const map=[];
  for(let i=0;i<s.length;i++){
    const ch=s[i];
    /* גרש, מקף, קו תחתון ונקודה הם מפריד ולא נמחקים,
       כדי ש"דרקר-10.2" ו"דרקר 10.2" ייחשבו זהים */
    if(/['"׳״‘’“”\-_.\s]/.test(ch)){
      if(compact||space||!out)continue;
      out+=' ';map.push(i);space=true;continue;
    }
    space=false;
    const lc=ch.toLowerCase();
    out+=SQ_FIN[lc]||lc;map.push(i);
  }
  while(out.endsWith(' ')){out=out.slice(0,-1);map.pop()}
  return {q:out,map};
}
const sq=s=>sqMap(s).q;
/* צורה דחוסה, בלי מפרידים כלל */
const sqc=s=>sqMap(s,true).q;
/* שמות החיפוש של תכשיר: השם, שמות חלופיים שנשמרו, ושמות החומרים הפעילים */
function aliasesOf(p){
  return [p.nameHe,...(p.searchAliases||[]),...(p.activeIngredients||[]).map(x=>x.name)]
    .filter(Boolean);
}
/* 0 התאמה מלאה · 1 השם מתחיל · 2 שם חלופי מתחיל · 3 השם מכיל · 4 שם חלופי מכיל */
function matchRank(p,qn,qc){
  if(!qn)return -1;
  const al=aliasesOf(p),names=al.map(sq),comp=al.map(sqc);
  const nN=sq(p.nameHe),nC=sqc(p.nameHe);
  const any=f=>names.some(x=>f(x,qn))||comp.some(x=>f(x,qc));
  if(any((x,q)=>x===q))return 0;
  if(nN.startsWith(qn)||nC.startsWith(qc))return 1;
  if(any((x,q)=>x.startsWith(q)))return 2;
  if(nN.includes(qn)||nC.includes(qc))return 3;
  if(any((x,q)=>x.includes(q)))return 4;
  return -1;
}
function searchProducts(q){
  const qn=sq(q),qc=sqc(q);
  if(!qn)return [];
  return PRODUCTS()
    .map(p=>({p,r:matchRank(p,qn,qc)}))
    .filter(x=>x.r>=0)
    .sort((a,b)=>a.r-b.r
      /* חומר שהוזנו לו פרטי תווית מוצג ראשון. זהו סדר תצוגה בלבד –
         כל חומר ברשימה ניתן לבחירה. */
      ||(prodVerifiedFlag(a.p)?0:1)-(prodVerifiedFlag(b.p)?0:1)
      ||a.p.nameHe.localeCompare(b.p.nameHe,'he'))
    .map(x=>x.p);
}
function hiName(name,q){
  const qn=sq(q);
  if(!qn)return esc(name);
  let {q:n,map}=sqMap(name);
  let i=n.indexOf(qn),len=qn.length;
  if(i<0){const c=sqMap(name,true),qc=sqc(q),j=c.q.indexOf(qc);
    if(j<0)return esc(name);
    n=c.q;map=c.map;i=j;len=qc.length;}
  const a=map[i],b=(i+len<map.length?map[i+len]:String(name).length);
  return esc(String(name).slice(0,a))+'<mark class="hl">'+esc(String(name).slice(a,b))+'</mark>'+esc(String(name).slice(b));
}

/* ---- שדה בחירת חומר ההדברה: חיפוש עם השלמה אוטומטית ---- */
const SUG_MAX=8;
const sugState={q:'',list:[],active:-1,idx:0,timer:null,busy:false,error:''};
function sugItem(p,q,i,active){
  const st=prodState(p);
  /* כפתור אמיתי ופעיל לכל חומר, עם מזהה ייחודי לפי מזהה החומר */
  return `<li role="presentation" class="sugrow"><button type="button" id="sug-${i}"
    data-mid="${esc(p.id)}" role="option" aria-selected="${active?'true':'false'}"
    class="sugitem ${st}${active?' active':''}"
    data-a="pickProd" data-p="${esc(p.id)}">
    <span class="sicon">${ic(catIcon(p.category),20)}</span>
    <span class="smain">
      <b>${hiName(p.nameHe,q)}</b>
      <small>${esc([CAT_HE[p.category],p.formulation].filter(Boolean).join(' · '))}</small>
      <small>${esc(ingText(p))||'—'}</small>
      ${prodVerifiedFlag(p)
        ? `<small class="pok">${ic('check',12)} ${esc(p.statusLabel||'')} · רישום ${esc(p.registrationNumber)} · בתוקף עד ${esc(p.registrationExpiry)}</small>`
        : `<small class="pinfo">${esc(materialTag(p))}</small>`}
      ${regExpired(p)?`<small class="pwarn">${ic('warn',12)} ${esc(expiryWarning(p))}</small>`:''}
    </span></button></li>`;
}
function sugHTML(){
  const q=sugState.q;
  if(!sq(q))return '';
  const list=sugState.list,shown=list.slice(0,SUG_MAX);
  const err=sugState.error?`<p class="sugerr">${ic('warn',13)} ${esc(sugState.error)}</p>`:'';
  if(!list.length)return `<div class="sugbox empty">${err}<p>לא נמצא חומר מתאים. בדוק את האיות או פנה למנהל המערכת.</p>
    <button type="button" class="btn sm ghost" data-a="reqProd">בקשה להוספת חומר</button></div>`;
  return `<div class="sugbox">${err}<ul id="sugList" role="listbox" aria-label="תוצאות חיפוש חומר">
    ${shown.map((p,i)=>sugItem(p,q,i,i===sugState.active)).join('')}</ul>
    ${list.length>shown.length?`<p class="sugmore">נמצאו תוצאות נוספות – המשך להקליד</p>`:''}</div>`;
}
function placeSug(){
  const box=document.getElementById('sugWrap'),inp=document.getElementById('pq');
  const pane=box&&box.firstElementChild;
  if(!box||!inp||!pane)return;
  /* מיקום מול החלון ולא מול ההורה, כי ל-.sec יש overflow:hidden
     שחתך את הרשימה ובלע את הלחיצות על התוצאות שמתחת לגבול שלו */
  const r=inp.getBoundingClientRect();
  pane.style.position='fixed';
  pane.style.top=Math.round(r.bottom+6)+'px';
  pane.style.right=Math.round(window.innerWidth-r.right)+'px';
  pane.style.width=Math.round(r.width)+'px';
  pane.style.maxHeight=Math.max(160,Math.round(window.innerHeight-r.bottom-24))+'px';
}
function renderSug(){
  const box=document.getElementById('sugWrap');
  if(!box)return;
  box.innerHTML=sugHTML();
  placeSug();
  const inp=document.getElementById('pq');
  if(inp){
    inp.setAttribute('aria-expanded',String(!!sugState.list.length&&!!sq(sugState.q)));
    const a=sugState.active;
    if(a>=0)inp.setAttribute('aria-activedescendant','sug-'+a);
    else inp.removeAttribute('aria-activedescendant');
  }
}
/* השהיה קצרה כדי שהרשימה לא תקפוץ על כל תו */
function sugSearch(q,idx){
  sugState.q=q;sugState.idx=idx;
  clearTimeout(sugState.timer);
  sugState.timer=setTimeout(()=>{
    sugState.list=searchProducts(q);
    sugState.active=-1;
    renderSug();
  },200);
}
function closeSug(){
  clearTimeout(sugState.timer);
  sugState.q='';sugState.list=[];sugState.active=-1;sugState.error='';
  const box=document.getElementById('sugWrap');if(box)box.innerHTML='';
}
/* מעבר אוטומטי וגלילה עדינה לשדה בחירת המזיק */
function focusPestField(i){
  requestAnimationFrame(()=>{
    const el=document.querySelector(`[data-fw="apps.${i}.pest"]`);
    if(!el)return;
    const box=el.closest('.field')||el;
    box.scrollIntoView({block:'center',behavior:'smooth'});
    box.classList.add('flash');setTimeout(()=>box.classList.remove('flash'),1500);
  });
}
function materialField(a,i){
  const p=labelOf(a);
  if(p)return `<div class="field"><span class="flabel req">חומר הדברה</span>
    <div class="selchip ${prodState(p)}">
      <span class="sicon">${ic('check',20)}</span>
      <span class="smain"><b>${esc(p.nameHe)}</b>
        <small>${esc([CAT_HE[p.category],p.formulation,ingText(p)].filter(Boolean).join(' · '))}</small>
        ${prodVerifiedFlag(p)?'':`<small class="mtags"><span class="mtag">${esc(materialTag(p))}</span></small>`}</span>
      <button type="button" class="xbtn" data-a="clearProd" data-i="${i}" aria-label="הסרת החומר">✕</button>
    </div></div>`;
  return `<div class="field${ec(`apps.${i}.selectedMaterialId`)}"><span class="flabel req">חומר הדברה</span>
    <div class="msearch" id="sugWrap-outer">
      <input class="minp" id="pq" type="search" autocomplete="off" role="combobox"
        aria-expanded="false" aria-controls="sugList" aria-autocomplete="list"
        data-sugidx="${i}" placeholder="הקלד שם חומר…" aria-label="חיפוש חומר הדברה">
      <div id="sugWrap"></div>
    </div>
    <p class="hint">החיפוש עובד בעברית ובאנגלית, לפי שם החומר או החומר הפעיל.</p></div>`;
}

/* הבחירה מתבצעת ב-pointerdown עם preventDefault, כדי ש-blur של שדה
   החיפוש לא יבטל את הלחיצה לפני שהיא מגיעה ל-click. עובד גם במגע. */
document.addEventListener('pointerdown',e=>{
  const el=e.target.closest&&e.target.closest('.sugitem');
  if(!el)return;
  e.preventDefault();
  A.pickProd({p:el.dataset.mid,i:sugState.idx});
},true);
window.addEventListener('resize',()=>{if(sugState.list.length)placeSug()});
window.addEventListener('scroll',()=>{if(sugState.list.length)placeSug()},true);
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(!t||t.id!=='pq')return;
  const n=Math.min(sugState.list.length,SUG_MAX);
  if(e.key==='Escape'){closeSug();t.blur();e.preventDefault();return}
  if(!n)return;
  if(e.key==='ArrowDown'){sugState.active=(sugState.active+1)%n;renderSug();e.preventDefault();return}
  if(e.key==='ArrowUp'){sugState.active=(sugState.active-1+n)%n;renderSug();e.preventDefault();return}
  if(e.key==='Enter'){
    const p=sugState.list[sugState.active<0?0:sugState.active];
    if(p&&prodSelectable(p))A.pickProd({p:p.id,i:sugState.idx});
    e.preventDefault();return}
});
document.addEventListener('click',e=>{
  /* לחיצה מחוץ לשדה ומחוץ לרשימה סוגרת את ההצעות */
  if(sugState.list.length&&!e.target.closest('.msearch')&&!e.target.closest('.sugbox'))closeSug();
},true);
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;if(el.tagName==='A')return;e.preventDefault();const f=A[el.dataset.a];f&&f(el.dataset,e,el)});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='pq'){sugSearch(t.value,+t.dataset.sugidx||0);return}
  if(t.id==='mq'){A._mq=t.value;const pos=t.selectionStart;render();
    const n=document.getElementById('mq');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}return}
  if(t.id==='rDateInp'){A._rDate=t.value||todayStr();render();return}
  if(t.dataset.stx&&cur){const[i,k,f]=t.dataset.stx.split(':');
    const a=cur.apps[+i],st=a&&(a.stations||[])[+k];
    if(st){st[f]=f==='fixed'?t.checked:t.value;touch()}return}
  if(t.dataset.ctpl){const c=S.clients[param];if(c&&c.siteTemplate){c.siteTemplate[t.dataset.ctpl]=t.value;c.updatedAt=Date.now();saveLocalSoon();clearTimeout(A._ct);A._ct=setTimeout(()=>pushClient(c),900)}return}
  if(t.dataset.sted){const st=S.stations[t.dataset.sted];if(st){st.loc=t.value;saveLocalSoon();clearTimeout(A._sl);A._sl=setTimeout(()=>pushStation(st),1000)}return}
  if(t.dataset.pcap){const ph=S.photos[t.dataset.pcap];if(ph){ph.caption=t.value;saveLocalSoon();clearTimeout(A._pc);A._pc=setTimeout(()=>pushPhoto(ph),1200)}return}
  if(t.dataset.flt!==undefined){flt[t.dataset.flt]=t.value;const k=t.dataset.flt,pos=t.selectionStart;render();const n=document.querySelector(`[data-flt="${k}"]`);if(n){n.focus();if(k==='q')try{n.setSelectionRange(pos,pos)}catch(_){}}return}
  if(t.dataset.cl){const c=S.clients[param];if(c){const k=t.dataset.cl,old=c.name;c[k]=t.value;c.updatedAt=Date.now();
    if(k==='name')journals().forEach(j=>{if(norm(j.client.name)===norm(old)){j.client.name=t.value;S.journals[j.id]=j;queuePush(j)}});
    saveLocalSoon();clearTimeout(A._clp);A._clp=setTimeout(()=>pushClient(c),1000)}return}
  if(t.dataset.reg){const c=S.clients[param];if(c){c.regular=c.regular||{};c.regular[t.dataset.reg]=t.value;c.updatedAt=Date.now();saveLocalSoon();clearTimeout(A._rg);A._rg=setTimeout(()=>pushClient(c),900)}return}
  if(t.dataset.pf){S.profile[t.dataset.pf]=t.value;if(A._pfErr){A._pfErr=A._pfErr.filter(k=>k!==t.dataset.pf);t.closest('.field')?.classList.remove('err')}saveLocalSoon();clearTimeout(A._pf);A._pf=setTimeout(pushProfile,1200);return}
  const f=t.dataset.f;if(!f||!cur)return;
  setP(cur,f,t.value);t.classList.remove('err');t.closest('.field')?.classList.remove('err');
  vAuto(f);
  const m=f.match(/^apps\.(\d+)\.product$/);if(m)productPicked(+m[1]);
  if(f==='client.name'){acRender(t.value);touch();
    clearTimeout(A._cl);A._cl=setTimeout(()=>{
      const want=!!lastForClient(cur.client.name,cur.client.phone,cur.id),have=!!document.querySelector('[data-a="loadLastSheet"]');
      if(want===have)return;
      const el=document.querySelector('[data-f="client.name"]'),pos=el?el.selectionStart:0,open=!!document.querySelector('#acList .acitem');
      render();
      const n=document.querySelector('[data-f="client.name"]');
      if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}if(open)acRender(n.value)}
    },700);
    return}
  touch();
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset.photo&&cur){
    const files=[...t.files];t.value='';if(!files.length)return;
    toast(files.length>1?`מעבד ${files.length} תמונות...`:'מעבד תמונה...');
    for(const f of files){
      try{const src=await compressImg(f);const ph={id:uid(),jid:cur.id,kind:t.dataset.photo,caption:'',src,at:Date.now()};
        S.photos[ph.id]=ph;pushPhoto(ph);}
      catch(err){info((err&&err.message)||'התמונה לא נקראה','תמונה')}
    }
    if(!saveLocal())info('אין מספיק מקום במכשיר לתמונות נוספות. מחקו תמונות ישנות.','אחסון');
    render();toast('התמונות נוספו');return;
  }
  if(t.dataset.st&&cur){const id=t.dataset.st;const st=S.stations[id];
    cur.stationChecks[id]=Object.assign(cur.stationChecks[id]||{},{status:t.value,no:st?st.no:0,type:st?st.type:'',loc:st?st.loc:''});touch();render();return}
  if(t.dataset.sted){const st=S.stations[t.dataset.sted];if(st){st.loc=t.value;saveLocalSoon();clearTimeout(A._sl);A._sl=setTimeout(()=>pushStation(st),1000)}return}
  if(t.dataset.pcap){const ph=S.photos[t.dataset.pcap];if(ph){ph.caption=t.value;saveLocalSoon();pushPhoto(ph)}return}
  if(t.dataset.c&&cur){setP(cur,t.dataset.c,t.checked);t.closest('.check')?.classList.remove('err');touch();return}
  if(t.dataset.stx&&cur){const[i,k,f]=t.dataset.stx.split(':');
    const a=cur.apps[+i],st=a&&(a.stations||[])[+k];
    if(st){st[f]=f==='fixed'?t.checked:t.value;touch();if(f==='amount'||f==='fixed')render()}return}
  if(t.dataset.spot&&cur){const sp=(cur.spots||[]).find(x=>x.id===t.dataset.spot);if(sp){sp.checked=t.checked;touch()}return}
  if(t.dataset.sec){A._clSel[t.checked?'add':'delete'](t.dataset.sec);sectionSheet();return}
  if(t.dataset.reg){const c=S.clients[param];if(c){c.regular=c.regular||{};c.regular[t.dataset.reg]=t.value;c.updatedAt=Date.now();saveLocalSoon();clearTimeout(A._rg);A._rg=setTimeout(()=>pushClient(c),900)}return}
  if(t.tagName==='SELECT'&&t.dataset.f&&cur){setP(cur,t.dataset.f,t.value);vAuto(t.dataset.f);touch();render()}
});
function productPicked(i){
  const a=cur.apps[i],p=prodIdx.get(norm(a.product));if(!p)return;
  const {active,conc}=splitActive(p.a);
  a.product=p.n;if(active)a.active=active;if(conc)a.conc=conc;a.fromDb=true;
  [['active',a.active],['conc',a.conc]].forEach(([k,v])=>{const el=document.querySelector(`[data-f="apps.${i}.${k}"]`);if(el)el.value=v});
  const n=document.getElementById('dbnote-'+i);if(n)n.innerHTML=dbNote(i);
}
window.addEventListener('beforeunload',()=>{clearTimeout(saveT);saveLocal()});

function crash(msg){
  let el=document.getElementById('crash');
  if(!el){el=document.createElement('div');el.id='crash';el.className='crash';document.body.appendChild(el);
    el.addEventListener('click',e=>{if(e.target.tagName==='BUTTON')el.remove()})}
  el.innerHTML=`<b>שגיאה באפליקציה:</b> ${esc(msg)}<br><button>סגירה</button>`;
}
window.addEventListener('error',e=>crash((e.message||'')+' · '+(e.filename||'').split('/').pop()+':'+e.lineno));
window.addEventListener('unhandledrejection',e=>crash('Promise: '+((e.reason&&(e.reason.message||e.reason.code))||e.reason)));
try{localStorage.setItem('yp-test','1');localStorage.removeItem('yp-test')}catch(e){setTimeout(()=>crash('אין גישה לאחסון המקומי במכשיר: '+e.message),500)}
document.addEventListener('focusin',e=>{if(e.target.dataset&&e.target.dataset.f==='client.name')acRender(e.target.value)});
document.addEventListener('focusout',e=>{if(e.target.dataset&&e.target.dataset.f==='client.name')setTimeout(()=>{const b=document.getElementById('acList');if(b&&!b.contains(document.activeElement))b.innerHTML=''},250)});
render();
initCloud();
</script>
</body>
</html>
