<title>PRO NETWORK</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0B1B33">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Rubik:wght@500;600;700&display=swap">
<style>
/* Layout: app shell — navy top bar, role-specific views, bottom tab bar on phones that becomes a top tab strip on wide screens. */
:root{
  --bg:#F2F5F9; --surface:#FFFFFF; --surface-2:#E9EFF5; --ink:#0B1B33; --ink-2:#4B5D76; --ink-3:#7A8BA2; --line:#D6DFE9;
  --navy:#0B1B33; --navy-2:#132B4D; --on-navy:#F4F8FC; --on-navy-2:#A9BBD3;
  --teal:#11B5AD; --teal-ink:#07807A; --teal-soft:#D9F3F1; --on-teal:#04201E;
  --ok:#17875B; --ok-soft:#DDF3E9; --warn:#A86B00; --warn-soft:#FBEFD6; --bad:#C63B3B; --bad-soft:#FBE2E2; --info:#2F5FD0; --info-soft:#E1E9FB;
  --shadow:0 1px 2px rgba(11,27,51,.06),0 6px 20px rgba(11,27,51,.06);
  --f-display:"Rubik","Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-body:"Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --r:14px; --r-sm:10px; --tab-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#06111E; --surface:#0D1C30; --surface-2:#13263F; --ink:#E8F0F8; --ink-2:#A2B4CB; --ink-3:#71849D; --line:#1E3452;
  --navy:#081627; --navy-2:#11243F; --on-navy:#F4F8FC; --on-navy-2:#9FB2CB;
  --teal:#2CD3C8; --teal-ink:#5DE6DB; --teal-soft:#0E3A42; --on-teal:#03201E;
  --ok:#43C78F; --ok-soft:#0F3527; --warn:#E9B04B; --warn-soft:#3A2A0C; --bad:#F07575; --bad-soft:#3D1717; --info:#86A8F5; --info-soft:#17284D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#06111E; --surface:#0D1C30; --surface-2:#13263F; --ink:#E8F0F8; --ink-2:#A2B4CB; --ink-3:#71849D; --line:#1E3452;
  --navy:#081627; --navy-2:#11243F; --on-navy:#F4F8FC; --on-navy-2:#9FB2CB;
  --teal:#2CD3C8; --teal-ink:#5DE6DB; --teal-soft:#0E3A42; --on-teal:#03201E;
  --ok:#43C78F; --ok-soft:#0F3527; --warn:#E9B04B; --warn-soft:#3A2A0C; --bad:#F07575; --bad-soft:#3D1717; --info:#86A8F5; --info-soft:#17284D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--navy)}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:clamp(26px,6vw,40px);font-weight:700}
h2{font-size:20px;font-weight:600}
h3{font-size:16px;font-weight:600}
p{margin:0}
a{color:var(--teal-ink)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.xs{font-size:12px}
.label{font-size:12px;letter-spacing:.06em;font-weight:500;color:var(--ink-3)}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--navy);color:var(--on-navy);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;color:inherit}
.brand b{font-family:var(--f-display);font-weight:700;letter-spacing:.08em;font-size:16px;direction:ltr}
.brand small{display:block;font-size:11px;color:var(--on-navy-2);line-height:1.1}
.brand svg{flex:none}
.roles{margin-inline-start:auto;display:flex;background:var(--navy-2);border-radius:12px;padding:3px;gap:2px}
.roles button{border:0;background:transparent;color:var(--on-navy-2);padding:7px 12px;border-radius:9px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.roles button[aria-pressed="true"]{background:var(--teal);color:var(--on-teal)}
.demo-strip{background:var(--navy-2);color:var(--on-navy-2);font-size:12px;text-align:center;padding:4px 16px}
.demo-strip b{color:var(--teal)}

/* tabs */
.tabs{position:fixed;inset:auto 0 0 0;z-index:40;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.tabs button{flex:1;min-width:0;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;font-size:11px;color:var(--ink-3);cursor:pointer;position:relative}
.tabs button[aria-current="page"]{color:var(--teal-ink)}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;inset-inline:28%;height:3px;border-radius:0 0 3px 3px;background:var(--teal)}
.tabs .badge{position:absolute;top:5px;inset-inline-start:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:9px;font-size:10px;min-width:17px;height:17px;line-height:17px;padding:0 4px}
main{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(var(--tab-h) + 90px + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){
  .tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);inset:auto;border-top:0;border-bottom:1px solid var(--line);justify-content:center;gap:4px;padding:0 16px}
  .tabs button{flex:none;flex-direction:row;gap:8px;font-size:14px;padding:12px 16px}
  .tabs button[aria-current="page"]::before{top:auto;bottom:0;inset-inline:10px;border-radius:3px 3px 0 0}
  .tabs .badge{position:static}
  main{padding-block:24px 110px}
}

/* primitives */
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:700px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card.flat{box-shadow:none}
.card.pop{box-shadow:var(--shadow);border-color:transparent}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.kpi .v{font-family:var(--f-display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:4px;line-height:1.1}
.kpi .s{font-size:12px;color:var(--ink-2);margin-top:4px}
.section-h{display:flex;align-items:end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hr{height:1px;background:var(--line);border:0;margin:4px 0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;border:1px solid transparent;background:var(--teal);color:var(--on-teal);font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px;font-weight:500}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.navy{background:var(--navy);color:var(--on-navy)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.okb{background:var(--ok-soft);color:var(--ok)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{border:0;background:var(--surface-2);width:38px;height:38px;border-radius:10px;display:inline-grid;place-items:center;cursor:pointer;color:var(--ink)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.teal{background:var(--teal-soft);color:var(--teal-ink)}
.pill.plain::before{display:none}
.sim{font-size:10px;font-weight:700;letter-spacing:.05em;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:1px 6px;white-space:nowrap}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:13px;font-weight:500;color:var(--ink-2)}
.field>span i{color:var(--bad);font-style:normal}
.input,select.input,textarea.input{width:100%;min-height:48px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-size:16px;outline:none}
textarea.input{min-height:110px;resize:vertical}
.input:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.input.err{border-color:var(--bad)}
.ferr{color:var(--bad);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;cursor:pointer;font-size:14px;text-align:start;min-height:44px}
.chip[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft);color:var(--ink);font-weight:500}
.chip small{display:block;font-size:12px;color:var(--ink-2)}
.check{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border-radius:12px;padding:12px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--teal);flex:none;margin-top:1px}
.switch{position:relative;width:52px;height:30px;flex:none}
.switch input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:30px;transition:background .2s}
.switch span::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch input:checked+span{background:var(--teal)}
.switch input:checked+span::after{transform:translateX(-22px)}
.upload{border:1.5px dashed var(--line);border-radius:12px;padding:16px;text-align:center;cursor:pointer;display:block;color:var(--ink-2)}
.upload img{max-height:160px;border-radius:10px;margin:0 auto 8px;display:block}
.filters{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:800px){.filters{grid-template-columns:2fr repeat(5,minmax(0,1fr))}}
.filters .input{min-height:42px;font-size:14px;padding:8px 10px}

/* hero */
.hero{background:var(--navy);color:var(--on-navy);border-radius:20px;padding:24px 18px;position:relative;overflow:hidden}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.4;pointer-events:none}
.hero>*:not(canvas){position:relative}
.hero p{color:var(--on-navy-2);max-width:52ch;margin-top:8px}
.hero .search{margin-top:18px;display:grid;gap:8px;grid-template-columns:1fr}
@media (min-width:700px){.hero{padding:40px 36px}.hero .search{grid-template-columns:1.4fr 1fr auto}}
.hero .input{background:var(--surface);color:var(--ink);border-color:transparent}
.trust{display:flex;gap:16px;flex-wrap:wrap;margin-top:16px;font-size:13px;color:var(--on-navy-2)}
.trust span{display:flex;gap:6px;align-items:center}
.trust svg{color:var(--teal)}
.cats{display:grid;gap:10px;grid-template-columns:repeat(3,minmax(0,1fr))}
@media (min-width:700px){.cats{grid-template-columns:repeat(7,minmax(0,1fr))}}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;font-size:13px;font-weight:500;text-align:center;min-height:92px}
.cat .ic{width:40px;height:40px;border-radius:12px;background:var(--teal-soft);color:var(--teal-ink);display:grid;place-items:center}
.steps{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.step{display:flex;gap:12px;align-items:flex-start}
.step .n{width:30px;height:30px;border-radius:50%;background:var(--navy);color:var(--on-navy);font-family:var(--f-display);font-weight:600;display:grid;place-items:center;flex:none}

/* responsive table */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:start;font-weight:500;font-size:12px;color:var(--ink-3);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
@media (max-width:760px){
  table.tbl.cards thead{display:none}
  table.tbl.cards,table.tbl.cards tbody,table.tbl.cards tr,table.tbl.cards td{display:block;width:100%}
  table.tbl.cards tr{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 12px;margin-bottom:10px}
  table.tbl.cards td{border:0;padding:5px 0;display:flex;justify-content:space-between;gap:12px;align-items:center;text-align:end}
  table.tbl.cards td::before{content:attr(data-l);font-size:12px;color:var(--ink-3);text-align:start;flex:none}
  table.tbl.cards td[data-l=""]::before{display:none}
  .tbl-wrap.cards-wrap{overflow:visible}
}

/* list items */
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.avatar{width:42px;height:42px;border-radius:12px;background:var(--navy-2);color:var(--on-navy);display:grid;place-items:center;font-family:var(--f-display);font-weight:600;flex:none}
.stars{color:#E3A008;letter-spacing:1px;font-size:13px}
.bar{height:8px;border-radius:8px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);border-radius:8px}
.hbars{display:flex;flex-direction:column;gap:10px}
.hbar{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;font-size:13px}
.hbar .bar{height:12px}
.timeline{list-style:none;margin:0;padding:0;position:relative}
.timeline li{position:relative;padding:0 26px 14px 0}
.timeline li::before{content:"";position:absolute;right:6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--teal)}
.timeline li::after{content:"";position:absolute;right:10px;top:18px;bottom:0;width:2px;background:var(--line)}
.timeline li:last-child::after{display:none}
.progress{display:flex;gap:4px}
.progress i{flex:1;height:6px;border-radius:4px;background:var(--surface-2)}
.progress i.on{background:var(--teal)}
.score{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;font-size:12px}
.score .bar{height:6px}
.calc{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.calc .t{font-weight:700;border-top:1px solid var(--line);padding-top:6px}
.empty{text-align:center;padding:28px 12px;color:var(--ink-2)}
.empty svg{color:var(--ink-3);margin-bottom:8px}
.notice{border-radius:12px;padding:12px 14px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.notice.warn{background:var(--warn-soft);color:var(--ink)}
.notice.info{background:var(--info-soft);color:var(--ink)}
.notice.ok{background:var(--ok-soft);color:var(--ink)}
.notice.bad{background:var(--bad-soft);color:var(--ink)}
.notice svg{flex:none;margin-top:1px}
.menu-list{display:flex;flex-direction:column}
.menu-list button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:14px 4px;border-bottom:1px solid var(--line);text-align:start;cursor:pointer;font-size:15px}
.menu-list button:last-child{border-bottom:0}
.menu-list .ic{width:36px;height:36px;border-radius:10px;background:var(--teal-soft);color:var(--teal-ink);display:grid;place-items:center;flex:none}

/* sheet + toast */
.scrim{position:fixed;inset:0;background:rgba(4,12,24,.5);z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:90;inset:auto 0 0 0;max-height:88%;background:var(--bg);border-radius:20px 20px 0 0;transform:translateY(105%);transition:transform .25s ease;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.open{transform:none}
.sheet-h{display:flex;align-items:center;gap:10px;padding:14px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sheet-h h2{flex:1;min-width:0}
.sheet-b{overflow:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));-webkit-overflow-scrolling:touch}
@media (min-width:900px){.sheet{inset:0 auto 0 0;width:560px;max-height:none;border-radius:0;transform:translateX(-105%)}.sheet.open{transform:none}}
.toast{position:fixed;z-index:100;left:50%;bottom:calc(var(--tab-h) + 16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--navy);color:var(--on-navy);padding:12px 18px;border-radius:12px;font-size:14px;opacity:0;transition:all .25s;pointer-events:none;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--bad);color:#fff}
.fab{position:fixed;z-index:45;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(var(--tab-h) + 14px + env(safe-area-inset-bottom,0px));background:var(--navy);color:var(--on-navy);border:2px solid var(--teal);border-radius:999px;padding:10px 14px;display:flex;gap:8px;align-items:center;font-weight:700;font-size:13px;cursor:pointer;box-shadow:var(--shadow)}
.fab .prog{background:var(--teal);color:var(--on-teal);border-radius:999px;padding:0 7px;font-size:12px}
@media (max-width:599px){.fab .fab-t{display:none}.fab{padding:8px 10px}}
@media (min-width:900px){.fab{bottom:24px}.toast{bottom:24px}}
.guide-step{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.guide-step .dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:13px;font-weight:700;font-family:var(--f-display)}
.guide-step.done .dot{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.guide-step.next{background:var(--teal-soft);margin-inline:-10px;padding-inline:10px;border-radius:12px;border-bottom-color:transparent}
.spinner{width:18px;height:18px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div dir="rtl" lang="he" id="app">
  <header class="top">
    <div class="top-in">
      <button class="brand" data-act="home" aria-label="PRO NETWORK – דף הבית">
        <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="9" fill="#11B5AD"/><g stroke="#0B1B33" stroke-width="2.2" fill="none" stroke-linecap="round"><path d="M10 23 17 11l7 12z"/></g><g fill="#0B1B33"><circle cx="17" cy="11" r="3.2"/><circle cx="10" cy="23" r="3.2"/><circle cx="24" cy="23" r="3.2"/></g></svg>

  if (!lead.desc || lead.desc.trim().length < 8) m.push('תיאור העבודה');
  return m;
}

function evaluate(st, lead) {
  const region = CITY_REGION[lead.city];
  const cat = CAT[lead.cat];
  const rows = st.providers.map(p => {
    const fails = [];
    if (!p.cats.includes(lead.cat)) fails.push('לא בתחום');
    const inCity = p.cities.includes(lead.city), inRegion = p.regions.includes(region);
    if (!inCity && !inRegion) fails.push('מחוץ לאזור השירות');
    if (!p.approved) fails.push('טרם אושר');
    if (!p.active) fails.push('מושעה');
    if (cat && cat.license && !p.licenseVerified) fails.push('רישיון לא אומת');
    if (!p.available) fails.push('לא זמין');
    return { p, fails, inCity, inRegion };
  });
  const elig = rows.filter(r => !r.fails.length);
  const maxOff = Math.max(1, ...elig.map(r => r.p.offers30));
  const urgH = URGENCY[lead.urgency].hours;
  rows.forEach(r => {
    if (r.fails.length) { r.score = 0; r.parts = null; return; }
    const p = r.p;
    const parts = {
      geo: r.inCity ? 1 : 0.6,
      avail: p.nextSlotH <= urgH ? 1 : clamp(urgH / p.nextSlotH, 0.2, 1),
      quality: clamp((p.rating - 3) / 2),
      accept: clamp(p.acceptRate),
      fair: elig.length > 1 ? clamp(1 - p.offers30 / maxOff + 0.15) : 1
    };
    r.parts = parts;
    r.score = Object.keys(WEIGHTS).reduce((a, k) => a + WEIGHTS[k] * parts[k], 0);
  });
  rows.sort((a, b) => (b.score - a.score) || (a.fails.length - b.fails.length));
  return rows;
}

/** Runs a lead through validation → consent gate → matching. */
function intake(st, lead, silent, at) {
  const miss = missingFields(lead);
  if (miss.length) { lead.status = 'pending_info'; log(lead, 'הבקשה לא שובצה – חסרים: ' + miss.join(', '), at); return { ok: false, reason: 'missing', miss }; }
  if (!lead.consent) { lead.status = 'no_consent'; log(lead, 'הבקשה לא הועברה – אין הסכמת לקוח לשיתוף', at); return { ok: false, reason: 'consent' }; }
  return runMatch(st, lead, silent, at);
}
function runMatch(st, lead, silent, at) {
  const rows = evaluate(st, lead).filter(r => !r.fails.length && !lead.offers.find(o => o.pid === r.p.id && o.status === 'rejected'));
  const pick = rows.slice(0, MAX_OFFERS);
  if (!pick.length) { lead.status = 'unmatched'; log(lead, 'לא נמצא בעל מקצוע מתאים – הועבר לטיפול ידני', at); return { ok: false, reason: 'none' }; }
  pick.forEach(r => {
    if (lead.offers.find(o => o.pid === r.p.id)) return;
    lead.offers.push({ pid: r.p.id, status: 'pending', score: r.score, at: at || now() });
    r.p.offers30++;
  });
  lead.status = 'matched';
  log(lead, `נשלח ל־${pick.length} בעלי מקצוע מתאימים (התראה פנימית בלבד)`, at);
  return { ok: true, count: pick.length };
}
function log(lead, text, at) { lead.history.push({ at: at || now(), text }); }

/* ---------- job workflow ---------- */
function accept(st, lead, pid, at) {
  if (lead.assignedTo) return false;
  lead.offers.forEach(o => { o.status = o.pid === pid ? 'accepted' : (o.status === 'pending' ? 'closed' : o.status); });
  lead.assignedTo = pid; lead.status = 'accepted';
  const p = prov(st, pid); log(lead, `${p.business} קיבל את העבודה. פרטי הלקוח נחשפו לו`, at);
  return true;
}
function reject(st, lead, pid, reason) {
  const o = lead.offers.find(o => o.pid === pid); if (!o) return;
  o.status = 'rejected'; o.reason = reason;
  const p = prov(st, pid); p.acceptRate = clamp(p.acceptRate * 0.97);
  log(lead, `${p.business} דחה את הבקשה${reason ? ' (' + reason + ')' : ''}`);
  if (!lead.offers.some(o => o.status === 'pending') && !lead.assignedTo) runMatch(st, lead);
}
function manualAssign(st, lead, pid) {
  if (!lead.offers.find(o => o.pid === pid)) lead.offers.push({ pid, status: 'pending', score: 0, at: now(), manual: true });
  lead.assignedTo = null;
  accept(st, lead, pid);
  log(lead, 'השיבוץ בוצע ידנית על ידי מנהל');
}
function submitQuote(st, lead, amountExVat, note, at) {
  lead.quote = { amount: +amountExVat, note: note || '', at: at || now() };
  lead.status = 'quoted';
  log(lead, `הצעת מחיר: ${ils(amountExVat)} + מע״מ`, at);
}
function approveQuote(st, lead, at) { lead.status = 'approved'; log(lead, 'הלקוח אישר את הצעת המחיר', at); }
function setStatus(st, lead, s, at) {
  lead.status = s;
  log(lead, 'סטטוס עודכן: ' + STATUS[s].name, at);
  if (s === 'completed' || s === 'cancelled') syncCommission(lead);
}
function addPayment(st, lead, type, amountInclVat, method, at) {
  lead.payments.push({ id: uid('pay'), type, amount: +amountInclVat, method, at: at || now(), simulated: true });
  log(lead, `${type === 'refund' ? 'החזר' : 'תשלום'} מדומה נרשם: ${ils(amountInclVat)} כולל מע״מ (${method})`, at);
  syncCommission(lead);
  const pay = payInfo(lead);
  if (lead.status === 'completed' && pay.state === 'full') { lead.status = 'closed'; log(lead, 'העבודה שולמה במלואה ונסגרה', at); }
}

/* ---------- commission engine ---------- */
function payInfo(lead) {
  const paid = lead.payments.filter(p => p.type === 'payment').reduce((a, p) => a + p.amount, 0);
  const refunded = lead.payments.filter(p => p.type === 'refund').reduce((a, p) => a + p.amount, 0);
  const net = paid - refunded;
  const due = lead.quote ? lead.quote.amount * (1 + VAT) : 0;
  let state = 'none';
  if (refunded > 0 && net <= 0.5) state = 'refunded';
  else if (due && net >= due - 0.5) state = 'full';
  else if (net > 0) state = 'partial';
  return { paid, refunded, net, due, balance: Math.max(0, due - net), state };
}
const PAY_STATE = { none: ['לא שולם', 'plain'], partial: ['שולם חלקית', 'warn'], full: ['שולם במלואו', 'ok'], refunded: ['הוחזר', 'bad'] };

function rateFor(st, lead, baseExVat) {
  const p = prov(st, lead.assignedTo);
  const projectSize = lead.quote ? lead.quote.amount : baseExVat;
  if (projectSize >= LARGE_PROJECT_THRESHOLD) return { rate: st.largeRate, source: `פרויקט גדול (מעל ${ils(LARGE_PROJECT_THRESHOLD)})` };
  if (lead.commission.rateOverride != null) return { rate: lead.commission.rateOverride, source: 'תעריף שנקבע ביישוב מחלוקת' };
  if (p && p.agreementRate != null) return { rate: p.agreementRate, source: 'הסכם אישי עם בעל המקצוע' };
  return { rate: st.catRates[lead.cat], source: `תעריף קטגוריה · ${TIERS[CAT[lead.cat].tier].name}` };
}
/** Commission is computed on money actually received, net of refunds, excluding VAT. */
function commissionOf(st, lead) {
  const pay = payInfo(lead);
  const base = Math.max(0, pay.net) / (1 + VAT);
  const { rate, source } = rateFor(st, lead, base);
  const waived = lead.commission.status === 'waived';
  const amount = waived ? 0 : base * rate / 100;
  return { base, rate, source, amount, vatPart: Math.max(0, pay.net) - base, pay };
}
function syncCommission(lead) {
  const c = lead.commission;
  if (['collected', 'disputed', 'waived'].includes(c.status)) return;
  const pay = payInfo(lead);
  if (pay.net <= 0) c.status = lead.payments.length ? 'waived' : (lead.status === 'cancelled' ? 'waived' : 'none');
  else c.status = (lead.status === 'completed' || lead.status === 'closed' || lead.status === 'cancelled') ? 'due' : 'accruing';
}

  pts.forEach((a, i) => pts.forEach((b, j) => { if (j <= i) return; const d = Math.hypot(a[0] - b[0], a[1] - b[1]); if (d < H * 0.13) { g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); } }));
  pts.forEach(([x, y], i) => { g.fillStyle = i % 5 === 0 ? '#2CD3C8' : 'rgba(244,248,252,.75)'; g.beginPath(); g.arc(x, y, i % 5 === 0 ? 3.2 : 2.1, 0, 7); g.fill(); });
}

VIEWS.pro.home = () => {
  const p = me(), e = earningsOf(p.id);
  const pend = myOffers().filter(l => l.offers.find(o => o.pid === p.id).status === 'pending' && !l.assignedTo);
  const active = myJobs().filter(l => ['accepted','quoted','approved','in_progress','completed'].includes(l.status));
  return `<div class="stack">${proHeader()}
    <div class="card row between">
      <div class="grow"><h3>${p.available ? 'זמין לעבודות חדשות' : 'לא זמין כרגע'}</h3><p class="small muted">${p.available ? `תור פנוי הבא: בעוד ${p.nextSlotH < 24 ? p.nextSlotH + ' שעות' : Math.round(p.nextSlotH / 24) + ' ימים'}` : 'לא נשלח אליכם בקשות עד שתחזרו לזמינות.'}</p></div>
      <label class="switch" aria-label="זמינות"><input type="checkbox" id="avail-toggle"${p.available ? ' checked' : ''}><span></span></label>
    </div>
    <div class="kpis">
      ${kpi('בקשות חדשות', pend.length)}
      ${kpi('עבודות פעילות', active.length)}
      ${kpi('הכנסה נטו', ils(e.net), 'אחרי עמלה, לפני מע״מ')}
      ${kpi('דירוג', `${p.rating} <span class="small muted">/ 5</span>`, `${p.reviews.length} חוות דעת`)}
    </div>
    <div class="card stack"><div class="section-h"><h2>בקשות שמחכות לכם</h2><button class="btn ghost sm" data-act="tab" data-tab="requests">לכל הבקשות</button></div>
      ${pend.length ? pend.slice(0, 3).map(l => offerCard(l, true)).join('') : empty('inbox', 'אין בקשות חדשות', p.available ? 'בקשות מתאימות יופיעו כאן.' : 'הפעילו זמינות כדי לקבל בקשות.')}</div>
    <div class="card stack"><h2>ביצועים</h2>
      <div class="score"><span>שיעור היענות</span><div class="bar"><i style="width:${p.acceptRate * 100}%"></i></div><span class="num">${pct(p.acceptRate)}</span>
      <span>איכות שירות</span><div class="bar"><i style="width:${p.rating / 5 * 100}%"></i></div><span class="num">${p.rating}</span>
      <span>עבודות שהושלמו</span><div class="bar"><i style="width:${Math.min(100, e.jobs.filter(l => ['completed','closed'].includes(l.status)).length * 20)}%"></i></div><span class="num">${e.jobs.filter(l => ['completed','closed'].includes(l.status)).length}</span></div>
      <p class="xs muted">המדדים האלה משפיעים על הדירוג שלכם במנוע ההתאמה.</p></div>
  </div>`;
};

function offerCard(l, compact) {
  const o = l.offers.find(o => o.pid === S.proId);
  const row = evaluate(S, l).find(r => r.p.id === S.proId);
  const pending = o.status === 'pending' && !l.assignedTo;
  return `<div class="card stack" style="${compact ? 'padding:12px;background:var(--surface-2);border-color:transparent' : ''}">
    <div class="row between"><div class="row" style="gap:8px"><span class="ic" style="color:var(--teal-ink)">${icon(CAT[l.cat].icon, 20)}</span><h3>${CAT[l.cat].name} · ${esc(l.city)}</h3></div>
      ${pending ? pill(URGENCY[l.urgency].name, l.urgency === 'now' ? 'bad' : 'info') : pill({ accepted: 'קיבלתם', rejected: 'דחיתם', closed: 'נלקחה ע״י אחר' }[o.status] || o.status, o.status === 'accepted' ? 'ok' : 'plain')}</div>
    <p class="small">${esc(l.desc)}</p>
    ${l.image ? `<img src="${l.image}" alt="תמונה מהלקוח" style="border-radius:10px;max-height:140px;object-fit:cover;align-self:flex-start">` : ''}
    <div class="row xs muted"><span>${icon('user', 14)} ${esc(maskName(l.customer.name))} · <span class="ltr">${esc(maskPhone(l.customer.phone))}</span></span><span>${ago(l.created)}</span>${l.demo ? SIM : ''}</div>
    ${pending && row && row.parts ? `<details class="xs"><summary class="muted" style="cursor:pointer">למה קיבלתם את הבקשה? ציון התאמה <b class="num">${Math.round(row.score * 100)}</b></summary><div class="score" style="margin-top:8px">${Object.keys(WEIGHTS).map(k => `<span>${WEIGHT_NAMES[k]} · ${pct(WEIGHTS[k])}</span><div class="bar"><i style="width:${row.parts[k] * 100}%"></i></div><span class="num">${Math.round(row.parts[k] * 100)}</span>`).join('')}</div></details>` : ''}
    ${pending ? `<div class="notice info" style="padding:8px 10px">${icon('lock', 16)}<span class="xs">פרטי הלקוח המלאים ייחשפו אחרי שתקבלו את העבודה.</span></div>
      <div class="grid" style="grid-template-columns:2fr 1fr"><button class="btn" data-act="accept" data-id="${l.id}">${icon('check', 18)} קבלת העבודה</button><button class="btn ghost" data-act="reject" data-id="${l.id}">דחייה</button></div>` : ''}
  </div>`;
}

VIEWS.pro.requests = () => {
  const all = myOffers().sort((a, b) => b.created - a.created);
  const pend = all.filter(l => l.offers.find(o => o.pid === S.proId).status === 'pending' && !l.assignedTo);
  const past = all.filter(l => !pend.includes(l));
  return `<div class="stack">${proHeader()}
    <h2>בקשות חדשות <span class="muted num">(${pend.length})</span></h2>
    ${pend.length ? `<div class="grid g2">${pend.map(l => offerCard(l)).join('')}</div>` : `<div class="card">${empty('inbox', 'אין בקשות שממתינות לתשובה', 'כשלקוח באזור השירות שלכם יפתח בקשה בתחום שלכם, היא תופיע כאן.')}</div>`}
    ${past.length ? `<h2>בקשות קודמות</h2><div class="grid g2">${past.slice(0, 8).map(l => offerCard(l, false)).join('')}</div>` : ''}
  </div>`;
};

function jobCard(l) {
  const pay = payInfo(l), c = commissionOf(S, l);
  const qd = U.quoteDraft[l.id] ?? '';
  let act = '';
  switch (l.status) {
    case 'accepted':
      act = `<form class="stack" id="quote-form" data-id="${l.id}">
        <label class="field"><span>סכום הצעה לפני מע״מ (₪)</span><input class="input num" id="q-amt-${l.id}" data-quote="${l.id}" inputmode="decimal" value="${esc(qd)}" placeholder="לדוגמה 850"></label>
        <div class="small muted num" id="q-total-${l.id}">${qd ? `כולל מע״מ: ${ils2(+qd * (1 + VAT))}` : 'הלקוח יראה את הסכום כולל מע״מ'}</div>
        <label class="field"><span>פירוט (לא חובה)</span><input class="input" id="q-note-${l.id}" placeholder="מה כלול בהצעה"></label>
        <button class="btn" type="submit">שליחת הצעת מחיר</button></form>`; break;
    case 'quoted':
      act = `${notice('info', 'clock', `הצעה של ${ils(l.quote.amount)} + מע״מ ממתינה לאישור הלקוח.`)}<button class="btn ghost sm" data-act="as-customer" data-id="${l.id}">הדגמה: לעבור לממשק הלקוח ולאשר</button>`; break;
    case 'approved':
      act = `<button class="btn" data-act="status" data-s="in_progress" data-id="${l.id}">${icon('play', 18)} התחלת העבודה</button>`; break;
    case 'in_progress':
      act = `<button class="btn" data-act="status" data-s="completed" data-id="${l.id}">${icon('check', 18)} סימון העבודה כהושלמה</button>`; break;
    case 'completed':
      act = payForm(l); break;
  }
  const canCancel = ['accepted','quoted','approved'].includes(l.status);
  return `<div class="card stack">
    <div class="row between"><div><div class="label ltr num">${l.code}</div><h3>${CAT[l.cat].name} · ${esc(l.city)}</h3></div>${statusPill(l.status)}</div>
    <div class="small" style="background:var(--surface-2);border-radius:10px;padding:10px">
      <div><b>${esc(l.customer.name)}</b> ${l.demo ? SIM : ''}</div>
      <div class="ltr num">${esc(l.customer.phone)}</div>
      ${l.customer.address ? `<div>${esc(l.customer.address)}</div>` : ''}
    </div>
    <p class="small">${esc(l.desc)}</p>
    ${l.quote ? `<div class="calc small num"><span>הצעה (לפני מע״מ)</span><span>${ils2(l.quote.amount)}</span><span>שולם (כולל מע״מ)</span><span>${ils2(pay.net)} ${payPill(pay.state)}</span>${c.amount ? `<span>עמלת PRO NETWORK · ${c.rate}%</span><span>${ils2(c.amount)}</span>` : ''}</div>` : ''}
    ${act}
    <div class="row">${canCancel ? `<button class="btn danger sm" data-act="pro-cancel" data-id="${l.id}">ביטול העבודה</button>` : ''}
    ${['accruing','due'].includes(l.commission.status) ? `<button class="btn ghost sm" data-act="dispute" data-id="${l.id}">ערעור על העמלה</button>` : ''}</div>
  </div>`;
}
function payForm(l) {
  const pay = payInfo(l);
  const d = U.payDraft[l.id] ?? (pay.balance ? (Math.round(pay.balance * 100) / 100).toString() : '');
  return `<form class="stack" id="pay-form" data-id="${l.id}" style="border-top:1px solid var(--line);padding-top:12px">
    <div class="row between"><h3>רישום תשלום מהלקוח</h3>${SIM}</div>
    <div class="grid" style="grid-template-columns:1fr 1fr">
      <label class="field"><span>סכום כולל מע״מ</span><input class="input num" id="pay-amt-${l.id}" data-pay="${l.id}" inputmode="decimal" value="${esc(d)}"></label>
      <label class="field"><span>אמצעי</span><select class="input" id="pay-method-${l.id}">${['העברה בנקאית','ביט','כרטיס אשראי','מזומן','צ׳ק'].map(m => opt(m, m)).join('')}</select></label>
    </div>
    <div class="xs muted">יתרה לפי ההצעה: ${ils2(pay.balance)}. אפשר לרשום תשלום חלקי. התשלום מדומה ולא עובר כסף.</div>
    <button class="btn" type="submit">רישום תשלום מדומה</button></form>`;
}

VIEWS.pro.jobs = () => {
  const jobs = myJobs().sort((a, b) => b.created - a.created);
  const active = jobs.filter(l => !['closed','cancelled'].includes(l.status));
  const done = jobs.filter(l => ['closed','cancelled'].includes(l.status));
  return `<div class="stack">${proHeader()}
    <h2>עבודות פעילות <span class="muted num">(${active.length})</span></h2>
    ${active.length ? `<div class="grid g2">${active.map(jobCard).join('')}</div>` : `<div class="card">${empty('brief', 'אין עבודות פעילות', 'עבודות שתקבלו יופיעו כאן עם פרטי הלקוח המלאים.')}</div>`}
    ${done.length ? `<h2>הסתיימו</h2><div class="grid g2">${done.map(jobCard).join('')}</div>` : ''}
  </div>`;
};

VIEWS.pro.earnings = () => {
  const p = me(), e = earningsOf(p.id);
  const rows = e.jobs.filter(l => l.payments.length || l.commission.status !== 'none').sort((a, b) => b.created - a.created);
  return `<div class="stack">${proHeader()}
    <div class="kpis">
      ${kpi('התקבל מלקוחות', ils(e.gross), 'כולל מע״מ')}
      ${kpi('בסיס לעמלה', ils(e.ex), 'לפני מע״מ')}
      ${kpi('עמלות PRO NETWORK', ils(e.comm))}
      ${kpi('נטו לכם', ils(e.net), 'לפני מע״מ')}
    </div>
    ${notice('info', 'percent', `העמלה מחושבת רק על כסף שהתקבל בפועל, אחרי החזרים ובלי מע״מ. ${p.agreementRate != null ? `יש לכם הסכם אישי: <b>${p.agreementRate}%</b>.` : 'התעריף נקבע לפי תחום העבודה.'}`)}
    <div class="card"><h2>היסטוריית עמלות</h2>
    ${rows.length ? `<div class="tbl-wrap cards-wrap" style="margin-top:10px"><table class="tbl cards"><thead><tr><th>עבודה</th><th>תאריך</th><th>בסיס</th><th>שיעור</th><th>עמלה</th><th>סטטוס</th></tr></thead><tbody>
      ${rows.map(l => { const c = commissionOf(S, l); return `<tr><td data-l="עבודה"><span class="ltr num">${l.code}</span> · ${CAT[l.cat].name}</td><td data-l="תאריך" class="num">${fdate(l.created)}</td><td data-l="בסיס" class="num">${ils2(c.base)}</td><td data-l="שיעור" class="num">${c.rate}%</td><td data-l="עמלה" class="num"><b>${ils2(c.amount)}</b></td><td data-l="סטטוס">${commPill(l.commission.status)}</td></tr>`; }).join('')}
    </tbody></table></div>` : empty('wallet', 'עוד אין תשלומים', 'אחרי שתרשמו תשלום מלקוח, העמלה תופיע כאן.')}</div>
  </div>`;
};

        <label class="field"><span>שם העסק</span><input class="input" id="pf-business" data-pbind="business" value="${esc(p.business)}"></label>
        <label class="field"><span>טלפון</span><input class="input" id="pf-phone" data-pbind="phone" value="${esc(p.phone)}" dir="ltr" style="text-align:right"></label>
      </div>
      <div class="row small">${p.approved ? pill('מאושר', 'ok') : pill('ממתין לאישור', 'warn')} ${p.licenseVerified ? pill('רישיון אומת', 'ok') : pill('רישיון לא אומת', 'warn')} ${pill(p.agreementRate != null ? `הסכם אישי ${p.agreementRate}%` : 'תעריף לפי קטגוריה', 'plain')}</div>
    </div>
    <div class="card stack"><h2>תחומי שירות</h2><div class="chips">${CATS.map(c => `<button class="chip" data-act="pcat" data-cat="${c.id}" aria-pressed="${p.cats.includes(c.id)}">${c.name}${c.license ? '<small>דורש רישיון</small>' : ''}</button>`).join('')}</div></div>
    <div class="card stack"><h2>אזורי שירות</h2>
      <p class="small muted">אזור שלם מקבל ציון קרבה חלקי. עיר שבחרתם במפורש מקבלת ציון מלא.</p>
      <div class="label">אזורים שלמים</div>
      <div class="chips">${Object.entries(REGIONS).map(([k, n]) => `<button class="chip" data-act="preg" data-r="${k}" aria-pressed="${p.regions.includes(k)}">${n}</button>`).join('')}</div>
      <div class="label">ערים</div>
      <div class="chips">${p.cities.map(c => `<button class="chip" data-act="pcity-rm" data-city="${esc(c)}" aria-pressed="true">${esc(c)} ✕</button>`).join('')}</div>

  </div>`;

SHEETS.reject = (id) => ({ title: 'דחיית הבקשה', body: `<div class="stack"><p class="small muted">הבקשה תעבור לבעל המקצוע הבא בתור. דחיות תכופות מורידות את שיעור ההיענות שלכם.</p>
  <div class="menu-list">${['לא פנוי בזמן המבוקש','רחוק מדי','לא בתחום שלי','אחר'].map(r => `<button data-act="reject-yes" data-id="${id}" data-r="${r}">${esc(r)}</button>`).join('')}</div></div>` });
SHEETS.dispute = (id) => ({ title: 'ערעור על עמלה', body: `<form id="dispute-form" data-id="${id}" class="stack"><p class="small muted">העמלה תוקפא עד שמנהל יבדוק את הערעור.</p>
  <label class="field"><span>נימוק</span><textarea class="input" id="dp-text" required placeholder="לדוגמה: חלק מהסכום הוא החזר על חומרים שהלקוח רכש"></textarea></label><button class="btn" type="submit">שליחת ערעור</button></form>` });
/* ============================================================
   Admin views
   ============================================================ */
const within = (l, days) => !days || l.created >= now() - days * DAY;

VIEWS.admin.overview = () => {
  const L = S.leads;
  const comm = L.map(l => commissionOf(S, l));
  const turnover = comm.reduce((a, c) => a + c.pay.net, 0);
  const commTotal = comm.reduce((a, c) => a + c.amount, 0);
  const collected = L.reduce((a, l, i) => a + (l.commission.status === 'collected' ? comm[i].amount : 0), 0);
  const activeJobs = L.filter(l => ['accepted','quoted','approved','in_progress'].includes(l.status)).length;
  const provActive = S.providers.filter(p => p.approved && p.active).length;
  const attention = [
    ...L.filter(l => l.status === 'unmatched').map(l => ['bad', `ליד <span class="ltr num">${l.code}</span> ללא התאמה · ${CAT[l.cat].name}, ${esc(l.city)}`, 'lead', l.id]),
    ...L.filter(l => l.status === 'pending_info').map(l => ['warn', `ליד <span class="ltr num">${l.code}</span> חסר פרטים: ${esc(missingFields(l).join(', '))}`, 'lead', l.id]),
    ...L.filter(l => l.status === 'no_consent').map(l => ['warn', `ליד <span class="ltr num">${l.code}</span> ממתין להסכמת לקוח`, 'lead', l.id]),
    ...S.providers.filter(p => !p.approved).map(p => ['info', `${esc(p.business)} ממתין לאישור הצטרפות`, 'provider', p.id]),
    ...L.filter(l => l.commission.status === 'disputed').map(l => ['bad', `מחלוקת עמלה בעבודה <span class="ltr num">${l.code}</span>`, 'lead', l.id]),
    ...S.complaints.filter(c => c.status !== 'resolved').map(c => ['warn', `תלונה פתוחה: ${esc(c.type)} · <span class="ltr num">${lead(c.leadId).code}</span>`, 'complaint', c.id])
  ];
  const funnel = FLOW.map(s => [s, L.filter(l => FLOW.indexOf(l.status) >= FLOW.indexOf(s)).length]);
  const fmax = Math.max(1, ...funnel.map(f => f[1]));
  const byCat = CATS.map(c => [c, L.filter(l => l.cat === c.id).reduce((a, l) => a + commissionOf(S, l).amount, 0)]).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]);
  const cmax = Math.max(1, ...byCat.map(x => x[1]));
  return `<div class="stack">
    <div class="section-h"><div><h1 style="font-size:26px">לוח בקרה</h1><p class="small muted">כל הנתונים מדומים לצורך הדגמה</p></div><button class="btn ghost sm" data-act="reset">איפוס נתוני הדגמה</button></div>
    <div class="kpis">
      ${kpi('לידים', L.length, `${L.filter(l => within(l, 7)).length} בשבוע האחרון`)}
      ${kpi('עבודות פעילות', activeJobs, `${L.filter(l => ['completed','closed'].includes(l.status)).length} הושלמו`)}
      ${kpi('בעלי מקצוע פעילים', provActive, `${S.providers.filter(p => !p.approved).length} ממתינים לאישור`)}
      ${kpi('מחזור עסקאות', ils(turnover), 'כולל מע״מ, נטו מהחזרים')}
      ${kpi('עמלות שנצברו', ils(commTotal), `${ils(collected)} נגבו`)}
      ${kpi('שיעור סגירה', pct(L.filter(l => ['completed','closed'].includes(l.status)).length / Math.max(1, L.length)), 'לידים שהגיעו לסיום')}
      ${kpi('תלונות פתוחות', S.complaints.filter(c => c.status !== 'resolved').length)}
      ${kpi('מחלוקות עמלה', L.filter(l => l.commission.status === 'disputed').length)}
    </div>
    <div class="grid g2">
      <div class="card stack"><h2>דורש טיפול <span class="muted num">(${attention.length})</span></h2>
        ${attention.length ? `<div>${attention.map(([t, txt, type, id]) => `<button class="item" style="width:100%;border-inline:0;border-top:0;background:none;text-align:start;cursor:pointer" data-act="open" data-type="${type}" data-id="${id}"><span class="pill ${t} plain" style="padding:4px">${icon(t === 'info' ? 'user' : 'alert', 14)}</span><span class="small grow">${txt}</span></button>`).join('')}</div>` : empty('check', 'הכל מטופל')}</div>
      <div class="card stack"><h2>משפך עבודות</h2><div class="hbars">${funnel.map(([s, n]) => `<div class="hbar"><span>${STATUS[s].name}</span><div class="bar"><i style="width:${n / fmax * 100}%"></i></div><span class="num">${n}</span></div>`).join('')}</div></div>
      <div class="card stack"><h2>עמלות לפי תחום</h2>${byCat.length ? `<div class="hbars">${byCat.map(([c, v]) => `<div class="hbar"><span>${c.name}</span><div class="bar"><i style="width:${v / cmax * 100}%"></i></div><span class="num">${ils(v)}</span></div>`).join('')}</div>` : empty('chart', 'עוד אין עמלות')}</div>
    </div>
  </div>`;
};

  collect: (el) => { const l = lead(el.dataset.id); l.commission.status = 'collected'; log(l, `עמלה של ${ils2(commissionOf(S, l).amount)} סומנה כנגבתה (מדומה)`); refresh(); toast('העמלה סומנה כנגבתה'); },
  'dispute-keep': (el) => { const l = lead(el.dataset.id); l.commission.status = 'due'; log(l, 'הערעור על העמלה נדחה'); refresh(); toast('הערעור נדחה. העמלה חזרה לגבייה'); },
  'dispute-waive': (el) => { const l = lead(el.dataset.id); l.commission.status = 'waived'; log(l, 'העמלה בוטלה ביישוב מחלוקת'); refresh(); toast('העמלה בוטלה'); },
  'admin-cancel': (el) => askConfirm('לבטל את הליד?', 'אם התקבלו תשלומים, העמלה תחושב רק על מה ששולם בפועל.', 'ביטול', () => { const l = lead(el.dataset.id); l.offers.forEach(o => { if (o.status === 'pending') o.status = 'closed'; }); setStatus(S, l, 'cancelled'); log(l, 'בוטל ע״י מנהל'); refresh(); toast('הליד בוטל'); }),
  pv: (el) => { const p = prov(S, el.dataset.id), k = el.dataset.k; p[k] = !p[k]; refresh(); toast('נשמר'); },
  'clear-lf': () => { U.lf = { q: '', city: '', cat: '', status: '', from: '', to: '' }; render(); },
  'cust-leads': (el) => { U.lf = { q: el.dataset.phone, city: '', cat: '', status: '', from: '', to: '' }; go('admin', 'leads'); },
  'c-review': (el) => { S.complaints.find(c => c.id === el.dataset.id).status = 'in_review'; refresh(); },
  range: (el) => { U.rangeDays = +el.dataset.d; render(); },
  reset: () => askConfirm('לאפס את נתוני ההדגמה?', 'כל הבקשות, השינויים והתשלומים המדומים שיצרתם יימחקו מהדפדפן הזה.', 'איפוס', () => { resetDemo(); U.justCreated = null; go('admin', 'overview'); toast('נתוני ההדגמה אופסו'); }),
  ...GUIDE
};

document.addEventListener('click', (ev) => {
  const r = ev.target.closest('[data-role]');
  if (r && r.closest('.roles')) { go(r.dataset.role, TABS[r.dataset.role][0][0]); return; }
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  if (el.tagName === 'SUMMARY') return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  ev.preventDefault();
  fn(el);
});
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape' && U.sheet) closeSheet();
  if (ev.key === 'Enter' && ev.target.matches('tr[data-act]')) ACT[ev.target.dataset.act](ev.target);
});

document.addEventListener('input', (ev) => {
  const t = ev.target;
  if (t.dataset.bind) { U.form[t.dataset.bind] = t.type === 'checkbox' ? t.checked : t.value; if (U.errors[t.dataset.bind]) { delete U.errors[t.dataset.bind]; t.classList.remove('err'); } }
  if (t.dataset.quote) { U.quoteDraft[t.dataset.quote] = t.value; const n = num(t.value); const o = document.getElementById('q-total-' + t.dataset.quote); if (o) o.textContent = isFinite(n) && n > 0 ? `כולל מע״מ: ${ils2(n * (1 + VAT))}` : 'הלקוח יראה את הסכום כולל מע״מ'; }
  if (t.dataset.pay) U.payDraft[t.dataset.pay] = t.value;
  if (t.dataset.pbind) { me()[t.dataset.pbind] = t.value; save(); }
  if (t.dataset.lf === 'q') { U.lf.q = t.value; const pos = t.selectionStart; render(); const n = document.getElementById('lf-q'); n.focus(); n.setSelectionRange(pos, pos); }
  if (t.dataset.pf === 'q') { U.pf.q = t.value; const pos = t.selectionStart; render(); const n = document.getElementById('pf-q'); n.focus(); n.setSelectionRange(pos, pos); }
});
document.addEventListener('change', (ev) => {
  const t = ev.target;
  if (t.dataset.bind === 'consent') { U.form.consent = t.checked; render(); return; }
  if (t.dataset.bind === 'cat') { U.form.cat = t.value; delete U.errors.cat; render(); return; }
  if (t.dataset.bind === 'city') { U.form.city = t.value; delete U.errors.city; render(); return; }
  if (t.dataset.lf && t.dataset.lf !== 'q') { U.lf[t.dataset.lf] = t.value; render(); return; }
  if (t.dataset.pf && t.dataset.pf !== 'q') { U.pf[t.dataset.pf] = t.value; render(); return; }
  if (t.dataset.sim) { U.sim[t.dataset.sim] = t.value; render(); return; }
  if (t.id === 'pro-switch') { S.proId = t.value; save(); render(); toast(`מחוברים כעת כ${me().business}`); return; }
  if (t.id === 'avail-toggle') { me().available = t.checked; refresh(); toast(t.checked ? 'אתם זמינים לבקשות חדשות' : 'הזמינות כובתה'); return; }
  if (t.id === 'pf-addcity' && t.value) { const p = me(); if (!p.cities.includes(t.value)) p.cities.push(t.value); refresh(); return; }
  if (t.id === 'f-img' && t.files[0]) {
    const file = t.files[0];
    if (!file.type.startsWith('image/')) { toast('אפשר לצרף רק קובץ תמונה', true); return; }
    const rd = new FileReader();
    rd.onload = () => { const img = new Image(); img.onload = () => {
      const k = Math.min(1, 900 / Math.max(img.width, img.height)); const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k); cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      U.form.image = cv.toDataURL('image/jpeg', 0.72); render(); }; img.onerror = () => toast('לא הצלחנו לקרוא את התמונה. נסו קובץ JPG או PNG', true); img.src = rd.result; };
    rd.readAsDataURL(file);
  }
});

document.addEventListener('submit', (ev) => {
  const f = ev.target; ev.preventDefault();
  const id = f.dataset.id;
  switch (f.id) {
    case 'hero-search': {
      U.form.cat = document.getElementById('hs-cat').value; U.form.city = document.getElementById('hs-city').value; U.justCreated = null; go('customer', 'request'); break;
    }
    case 'req-form': {
      const F = U.form, e = {};
      if (!F.cat) e.cat = 'בחרו תחום';
      if (!F.city) e.city = 'בחרו עיר';
      if (F.desc.trim().length < 8) e.desc = 'כתבו לפחות כמה מילים על העבודה';
      if (!F.name.trim()) e.name = 'הזינו שם';
      if (!validPhone(F.phone)) e.phone = 'מספר טלפון ישראלי, לדוגמה 052-1234567';
      U.errors = e;
      if (Object.keys(e).length) { render(); const first = document.querySelector('.input.err'); if (first) first.focus(); toast('יש שדות שצריך להשלים', true); return; }
      U.submitting = true; render();
      setTimeout(() => {
        const l = { id: uid('l'), code: 'PN-' + (Math.max(...S.leads.map(x => +x.code.slice(3))) + 1), created: now(), demo: false,
          customer: { name: F.name.trim(), phone: F.phone.trim(), email: F.email.trim(), address: F.address.trim() },
          cat: F.cat, city: F.city, urgency: F.urgency, desc: F.desc.trim(), image: F.image, consent: F.consent,
          status: 'matched', offers: [], assignedTo: null, quote: null, payments: [], commission: { status: 'none' }, review: null,
          history: [{ at: now(), text: 'הבקשה נקלטה במערכת' }] };
        S.leads.push(l); intake(S, l);
        S.demoLeadId = l.id; S.adminSawDemo = false;
        U.submitting = false; U.justCreated = l.id;
        U.form = { cat: '', city: '', urgency: 'soon', desc: '', image: null, name: '', phone: '', email: '', address: '', consent: true };
        refresh(); window.scrollTo(0, 0);
      }, 700);
      break;
    }
    case 'track-form': U.trackCode = document.getElementById('t-code').value; render(); break;
    case 'fix-form': {
      const l = lead(id); l.customer.name = document.getElementById('fx-name').value.trim(); l.customer.phone = document.getElementById('fx-phone').value.trim(); l.desc = document.getElementById('fx-desc').value.trim();
      const r = intake(S, l); refresh(); toast(r.ok ? `הפרטים הושלמו. נשלח ל־${r.count} בעלי מקצוע` : r.reason === 'missing' ? 'עדיין חסרים: ' + r.miss.join(', ') : 'נשמר', !r.ok); break;
    }
    case 'review-form': {
      const l = lead(id), p = prov(S, l.assignedTo); const txt = document.getElementById('rv-text').value.trim() || 'ללא פירוט';
      l.review = { stars: U.rv || 5, text: txt, at: now() };
      p.reviews.push({ who: maskName(l.customer.name), stars: l.review.stars, text: txt, at: now() });
      p.rating = +(p.reviews.reduce((a, r) => a + r.stars, 0) / p.reviews.length).toFixed(1);
      log(l, `הלקוח דירג ${l.review.stars} כוכבים`); U.rv = 5; refresh(); toast('תודה! חוות הדעת פורסמה'); break;
    }
    case 'complain-form': {
      const txt = document.getElementById('cp-text').value.trim(); if (!txt) { toast('תארו בקצרה מה קרה', true); return; }
      S.complaints.push({ id: uid('c'), leadId: id, from: 'customer', type: document.getElementById('cp-type').value, text: txt, status: 'open', at: now() });
      log(lead(id), 'הלקוח פתח דיווח על בעיה'); closeSheet(); refresh(); toast('הדיווח התקבל. צוות PRO NETWORK יחזור אליכם'); break;
    }
    case 'quote-form': {
      const n = num(document.getElementById('q-amt-' + id).value);
      if (!(n > 0)) { toast('הזינו סכום גדול מאפס', true); return; }
      submitQuote(S, lead(id), n, document.getElementById('q-note-' + id).value.trim()); delete U.quoteDraft[id]; refresh(); toast('הצעת המחיר נשלחה ללקוח'); break;
    }
    case 'pay-form': {
      const n = num(document.getElementById('pay-amt-' + id).value);
      if (!(n > 0)) { toast('הזינו סכום תשלום', true); return; }
      addPayment(S, lead(id), 'payment', n, document.getElementById('pay-method-' + id).value); delete U.payDraft[id]; refresh();
      const c = commissionOf(S, lead(id)); toast(`תשלום מדומה נרשם. עמלה: ${ils2(c.amount)}`); break;
    }
    case 'refund-form': {
      const l = lead(id), n = num(document.getElementById('rf-amt').value);
      if (!(n > 0) || n > payInfo(l).net + 0.01) { toast('סכום ההחזר חייב להיות גדול מאפס ולא יותר ממה ששולם', true); return; }
      addPayment(S, l, 'refund', n, 'החזר ללקוח'); refresh(); toast('ההחזר נרשם והעמלה חושבה מחדש'); break;
    }
    case 'dispute-form': {
      const txt = document.getElementById('dp-text').value.trim(); if (!txt) { toast('כתבו נימוק', true); return; }
      const l = lead(id); l.commission.status = 'disputed'; l.commission.dispute = txt; l.commission.disputeAt = now(); log(l, 'בעל המקצוע ערער על העמלה'); closeSheet(); refresh(); toast('הערעור נשלח לבדיקה'); break;
    }
    case 'dispute-resolve': {
      const l = lead(id), n = num(document.getElementById('dr-rate').value);
      if (!(n >= 0 && n <= 20)) { toast('הזינו שיעור בין 0 ל־20', true); return; }
      l.commission.rateOverride = n; l.commission.status = 'due'; log(l, `המחלוקת יושבה: שיעור עמלה עודכן ל־${n}%`); refresh(); toast('השיעור עודכן והעמלה חזרה לגבייה'); break;
    }
    case 'agreement-form': {
      const v = document.getElementById('ag-rate').value.trim(); const p = prov(S, id);
      if (v === '') p.agreementRate = null; else { const n = num(v); if (!(n >= 1 && n <= 20)) { toast('שיעור בין 1 ל־20, או ריק לתעריף קטגוריה', true); return; } p.agreementRate = n; }
      refresh(); toast('הסכם העמלה נשמר'); break;
    }
    case 'rates-form': {
      let bad = null;
      f.querySelectorAll('input[name]').forEach(inp => { const n = num(inp.value); if (!(n >= +inp.dataset.min && n <= +inp.dataset.max)) bad = bad || inp; });
      if (bad) { bad.classList.add('err'); bad.focus(); toast(`השיעור חייב להיות בטווח ${bad.dataset.min}–${bad.dataset.max}%`, true); return; }
      f.querySelectorAll('input[name]').forEach(inp => { if (inp.name === 'large') S.largeRate = num(inp.value); else S.catRates[inp.name] = num(inp.value); });
      refresh(); toast('התעריפים נשמרו'); break;
    }
    case 'cr-form': {
      const c = S.complaints.find(x => x.id === id); const txt = document.getElementById('cr-' + id).value.trim();
      if (!txt) { toast('כתבו סיכום טיפול לפני סגירה', true); return; }
      c.status = 'resolved'; c.resolution = txt; refresh(); toast('התלונה נסגרה'); break;
    }
  }
});

window.addEventListener('hashchange', () => { fromHash(); render(); });
window.addEventListener('resize', () => drawHeroMap());

/* boot */
S = load();
fromHash();
render();
</script>
